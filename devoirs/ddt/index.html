<!doctype html>
<html lang="fr" data-theme="ddt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFF2F6">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="DDT">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="manifest" href="manifest.webmanifest">
<title>DDT · Mes devoirs</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,700;9..144,800&display=swap" rel="stylesheet">
<style>
:root {
  --paper: #F4F6FC;
  --card: #FFFFFF;
  --ink: #1D2340;
  --ink-2: #565C78;
  --ink-3: #8C90A6;
  --line: rgba(29, 35, 64, .12);
  --accent: #2B3FA8;
  --accent-ink: #FFFFFF;
  --late: #B3261E;
  --soon: #C2570C;
  --ok: #2E7D4F;
  --mark: #FFE27A;
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --display: "Fraunces", Georgia, serif;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body {
  background: var(--paper);
  background-image: linear-gradient(rgba(43, 63, 168, .07) 1px, transparent 1px);
  background-size: 100% 28px;
  color: var(--ink); font: 17px/1.4 var(--font); min-height: 100vh; -webkit-text-size-adjust: 100%;
}
::selection { background: var(--mark); color: var(--ink); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
input, textarea { caret-color: var(--accent); }
.app { max-width: 640px; margin: 0 auto; padding: calc(12px + env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
svg { flex: 0 0 auto; }

/* En-tête */
.top { display: flex; align-items: flex-end; gap: 12px; padding-top: 10px; }
.top h1 { flex: 1; margin: 0; font: 800 34px/1 var(--display); letter-spacing: -.02em; }
.top h1 mark { background: linear-gradient(transparent 58%, var(--mark) 58%, var(--mark) 92%, transparent 92%); color: inherit; padding: 0 2px; }
.top p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.icon-btn { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); }
.icon-btn svg { width: 20px; height: 20px; }

.switch { display: flex; background: rgba(29, 35, 64, .07); border-radius: 14px; padding: 4px; margin-top: 18px; }
.switch button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 16px; color: var(--ink-2); }
.switch button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -3px rgba(29, 35, 64, .3); }
.switch small { font-weight: 600; color: var(--ink-3); margin-left: 4px; }

.chips { display: flex; gap: 8px; overflow-x: auto; margin: 14px -16px 0; padding: 2px 16px 4px; scrollbar-width: none; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 7px; color: var(--ink); }
.chip i { width: 10px; height: 10px; border-radius: 50%; background: var(--c); }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.chip svg { width: 16px; height: 16px; }
.chip[aria-pressed="true"] i { box-shadow: 0 0 0 2px var(--paper); }

/* Recherche */
.search-wrap { position: relative; margin-top: 14px; }
.search-wrap .s-ico { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--ink-3); pointer-events: none; }
.search { width: 100%; min-height: 50px; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 10px 46px 10px 44px; font-size: 17px; -webkit-appearance: none; appearance: none; }
.search::placeholder { color: var(--ink-3); }
.search::-webkit-search-cancel-button { display: none; }
.clear-q { position: absolute; right: 7px; top: 50%; transform: translateY(-50%); width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(29, 35, 64, .08); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); }
.clear-q svg { width: 12px; height: 12px; }

/* Groupes par date */
.group { margin-top: 22px; }
.group h2 { display: flex; align-items: baseline; gap: 8px; margin: 0 0 8px; font: 800 20px/1.2 var(--display); letter-spacing: -.01em; }
.group h2 small { font: 600 14px var(--font); color: var(--ink-2); }
.group.late h2 { color: var(--late); }
.list { background: var(--card); border-radius: var(--radius); box-shadow: 0 1px 0 rgba(29, 35, 64, .04), 0 12px 30px -22px rgba(29, 35, 64, .45); overflow: hidden; }
.hw { display: flex; align-items: center; gap: 12px; padding: 8px 12px 8px 14px; border-top: 1px solid var(--line); min-height: 64px; position: relative; }
.hw:first-child { border-top: 0; }
.check { width: 32px; height: 32px; border-radius: 10px; border: 2px solid var(--ink-3); background: transparent; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0; }
.check svg { width: 18px; height: 18px; opacity: 0; }
.hw.done .check { background: var(--ok); border-color: var(--ok); }
.hw.done .check svg { opacity: 1; }
.hw-body { flex: 1; min-width: 0; border: 0; background: none; text-align: left; padding: 4px 0; }
.hw-title { display: block; font-weight: 700; font-size: 17px; overflow-wrap: anywhere; }
.hw.done .hw-title { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-3); }
.hw-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 10px; margin-top: 3px; font-size: 14px; color: var(--ink-2); }
.hw-meta .subj { font-weight: 700; color: var(--c2); display: inline-flex; align-items: center; gap: 6px; }
.hw-meta .subj::before { content: ""; width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.hw-meta .clip { display: inline-flex; align-items: center; gap: 3px; }
.hw-meta .clip svg { width: 14px; height: 14px; }
.due { flex: 0 0 auto; font-weight: 800; font-size: 13px; padding: 5px 9px; border-radius: 9px; background: rgba(29, 35, 64, .07); color: var(--ink-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
.due.late { background: #FBE3E1; color: var(--late); }
.due.soon { background: #FDEBDD; color: var(--soon); }

.empty { background: var(--card); border-radius: var(--radius); padding: 26px 20px; text-align: center; color: var(--ink-2); margin-top: 22px; }
.empty b { display: block; font: 800 22px/1.2 var(--display); color: var(--ink); margin-bottom: 6px; }

.hw-meta .steps-count { font-weight: 700; color: var(--ink); }
.bar { display: block; height: 5px; border-radius: 3px; background: rgba(29, 35, 64, .1); margin-top: 7px; overflow: hidden; max-width: 220px; }
.bar i { display: block; height: 100%; background: var(--ok); border-radius: 3px; }
.steps-edit { display: flex; flex-direction: column; gap: 6px; margin-bottom: 8px; }
.steps-edit:empty { display: none; }
.step-edit { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 6px 6px 6px 12px; }
.step-edit span { color: var(--ink-3); font-weight: 700; font-variant-numeric: tabular-nums; }
.step-edit b { flex: 1; min-width: 0; font-weight: 600; overflow-wrap: anywhere; }
.rm-step { width: 36px; height: 36px; border-radius: 50%; border: 0; background: rgba(29, 35, 64, .08); display: flex; align-items: center; justify-content: center; padding: 0; }
.rm-step svg { width: 12px; height: 12px; }

/* Animaux (version DDT) */
.animal { flex: 0 0 auto; display: block; }
.chip .animal { width: 22px; height: 22px; margin-left: -4px; }
.hw-meta .subj .animal { margin-right: 1px; }
.animals { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.animal-btn { border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 8px 4px 6px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
.animal-btn { position: relative; }
.animal-btn small { font-size: 12px; font-weight: 700; color: var(--ink-2); text-align: center; line-height: 1.15; }
.animal-btn .star { position: absolute; top: -8px; right: -4px; font-style: normal; font-size: 11px; font-weight: 800; background: var(--accent); color: #fff; border-radius: 999px; padding: 2px 7px; }
.animal-btn[aria-pressed="true"] { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent); }

/* Version DDT : tout en rose. */
[data-theme="ddt"] {
  --paper: #FFF2F6;
  --card: #FFFFFF;
  --ink: #3A1C2C;
  --ink-2: #74526A;
  --ink-3: #A88A9E;
  --line: rgba(58, 28, 44, .12);
  --accent: #C8366F;
  --mark: #FFC2D8;
}
[data-theme="ddt"] body { background-image: linear-gradient(rgba(200, 54, 111, .08) 1px, transparent 1px); }
[data-theme="ddt"] .footer { background: linear-gradient(rgba(255, 242, 246, 0), var(--paper) 35%); }
[data-theme="ddt"] .btn { box-shadow: 0 10px 22px -12px rgba(200, 54, 111, .75); }
[data-theme="ddt"] .switch { background: rgba(200, 54, 111, .09); }
[data-theme="ddt"] .hw-meta .subj::before { display: none; }

.rendu { margin-top: 20px; background: var(--card); border: 1.5px dashed var(--line); border-radius: var(--radius); padding: 14px; }
.rendu.on { border-style: solid; border-color: color-mix(in srgb, var(--ok) 45%, transparent); background: color-mix(in srgb, var(--ok) 5%, var(--card)); }
.rendu h4 { margin: 0 0 4px; font: 800 20px/1.2 var(--display); display: flex; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.rendu h4 small { font: 600 14px var(--font); color: var(--ink-2); }
.rendu .files { margin: 6px 0 12px; }
.rendu .files:empty { display: none; }
.rpill { display: flex; align-items: center; gap: 8px; margin-top: 7px; max-width: 100%; background: color-mix(in srgb, var(--ok) 8%, #fff); border: 1.5px solid color-mix(in srgb, var(--ok) 30%, transparent); border-radius: 10px; padding: 5px 9px 5px 5px; font-size: 14px; font-weight: 700; color: var(--ink); }
.rpill b { flex: 0 0 auto; font: 800 11px/1 var(--font); color: var(--fc); background: color-mix(in srgb, var(--fc) 14%, #fff); border-radius: 6px; padding: 5px 6px; }
.rpill span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.hw-meta .rendu-tag { display: inline-flex; align-items: center; gap: 3px; font-weight: 800; color: var(--ok); }
.hw-meta .rendu-tag svg { width: 14px; height: 14px; stroke: var(--ok); }
.hw-meta .grade { font-weight: 800; color: var(--ink); background: var(--mark); padding: 0 7px; border-radius: 6px; }

.prof { display: inline-flex; align-items: center; gap: 4px; font-weight: 600; color: var(--ink-2); }
.prof svg { width: 14px; height: 14px; }
.meta-line .prof { font-size: 15px; }
.step-edit span svg { width: 16px; height: 16px; display: block; color: var(--ink-3); }

.backup { margin-top: 26px; background: var(--card); border-radius: var(--radius); padding: 14px; box-shadow: 0 12px 30px -22px rgba(29, 35, 64, .45); }
.backup h4 { margin: 0 0 6px; font: 800 20px/1.2 var(--display); }

.due.const { background: color-mix(in srgb, var(--accent) 12%, #fff); color: var(--accent); }
.chip svg { width: 16px; height: 16px; }
.check.arm { border-color: var(--ok); box-shadow: 0 0 0 4px color-mix(in srgb, var(--ok) 30%, transparent); animation: arm .9s ease-in-out infinite alternate; }
@keyframes arm { to { box-shadow: 0 0 0 7px color-mix(in srgb, var(--ok) 12%, transparent); } }
.btn.confirm { background: #fff; color: var(--ok); border: 2px solid var(--ok); box-shadow: none; }

.check.loop { border-color: color-mix(in srgb, var(--accent) 45%, transparent); background: color-mix(in srgb, var(--accent) 8%, #fff); color: var(--accent); cursor: default; }
.check.loop svg { width: 18px; height: 18px; opacity: 1; stroke: currentColor; }
.const-note { display: flex; align-items: center; gap: 10px; margin: 0; background: color-mix(in srgb, var(--accent) 8%, #fff); color: var(--accent); border-radius: 14px; padding: 14px 16px; font-weight: 700; }
.const-note svg { width: 22px; height: 22px; }

.top { align-items: center; }
.top .icon-btn { flex: 0 0 auto; }
.sync { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 700; padding: 2px 8px; border-radius: 999px; vertical-align: 1px; margin-left: 4px; }
.sync::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.sync.ok { color: var(--ok); background: color-mix(in srgb, var(--ok) 10%, #fff); }
.sync.wait { color: var(--ink-2); background: rgba(29, 35, 64, .06); }
.sync.error { color: var(--soon); background: color-mix(in srgb, var(--soon) 10%, #fff); }
.link-box { margin-top: 12px; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 12px; font: 14px/1.4 ui-monospace, Menlo, monospace; overflow-wrap: anywhere; user-select: all; }

.dates { display: flex; flex-direction: column; gap: 2px; margin-top: 5px; font-size: 13.5px; color: var(--ink-2); }
.dates .dl b { font-weight: 700; color: var(--ink); margin-right: 3px; }
.dates em { font-style: normal; font-weight: 800; color: var(--accent); margin-left: 3px; }
.dates em::before { content: "· "; color: var(--ink-3); font-weight: 600; }
.dates em.soon { color: var(--soon); }
.dates em.late { color: var(--late); }
.dates.long { margin: 12px 0 0; gap: 8px; font-size: 16px; }
.dates.long .dl { display: block; background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 10px 12px; }
.dates.long .dl b { display: block; font-size: 13px; color: var(--ink-2); text-transform: uppercase; letter-spacing: .04em; margin-bottom: 2px; }
.dates.long .butoir { border-color: color-mix(in srgb, var(--late) 30%, transparent); }
.date-block { display: flex; flex-direction: column; gap: 8px; background: var(--card); border: 1.5px solid var(--line); border-radius: var(--radius); padding: 12px; transition: opacity .15s ease-out; }
.date-block.off { opacity: .45; }
.sub-label { font-weight: 700; font-size: 15px; }
.sub-label small { font-weight: 500; color: var(--ink-2); }
.date-block .sub-label:not(:first-child) { margin-top: 8px; padding-top: 12px; border-top: 1px dashed var(--line); }
.rel { font-weight: 800; color: var(--accent); font-size: 14px; }
.rel:empty { display: none; }

/* Matières */
.subj-row { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-top: 1px solid var(--line); }
.subj-row:first-child { border-top: 0; }
.subj-row .dot { width: 16px; height: 16px; border-radius: 50%; background: var(--c); flex: 0 0 auto; }
.subj-row button.grow { flex: 1; min-width: 0; text-align: left; border: 0; background: none; padding: 4px 0; }
.subj-row b { display: block; font-size: 17px; }
.subj-row small { color: var(--ink-2); font-size: 14px; }
.small-btn svg { width: 18px; height: 18px; }
.small-btn { min-height: 40px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; color: var(--ink); }

/* Bouton du bas */
.footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(16px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); background: linear-gradient(rgba(244, 246, 252, 0), var(--paper) 35%); z-index: 5; }
.btn { min-height: 56px; width: 100%; padding: 0 22px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 18px; border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; text-decoration: none; box-shadow: 0 10px 22px -12px rgba(43, 63, 168, .8); }
.btn svg { width: 22px; height: 22px; }
.footer .btn { max-width: 608px; margin: 0 auto; display: flex; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; font-weight: 700; font-size: 17px; }
.btn.danger { background: transparent; color: var(--late); border: 1.5px solid rgba(179, 38, 30, .35); box-shadow: none; font-size: 17px; }
.btn.ok { background: var(--ok); box-shadow: 0 10px 22px -12px rgba(46, 125, 79, .8); }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

/* Feuilles */
.sheet-back { position: fixed; inset: 0; background: rgba(29, 35, 64, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 0 max(18px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); animation: rise .32s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { transform: translateY(40px); opacity: .4; } }
.band { width: 40px; height: 5px; border-radius: 3px; background: rgba(29, 35, 64, .2); margin: 10px auto 0; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding: 14px 0 10px; position: sticky; top: 0; z-index: 3; background: var(--paper); margin: 0 -2px; }
.sheet .band { position: sticky; top: 0; z-index: 4; }
.close { width: 44px; height: 44px; background: rgba(29, 35, 64, .1) !important; }
.close svg { width: 18px !important; height: 18px !important; }
.sheet-head h3 { flex: 1; margin: 0; font: 800 26px/1.15 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(29, 35, 64, .08); display: flex; align-items: center; justify-content: center; padding: 0; flex: 0 0 auto; }
.close svg { width: 16px; height: 16px; }
.label { display: block; font-weight: 700; font-size: 16px; margin: 20px 0 8px; }
.label small { font-weight: 500; color: var(--ink-2); }
.field { width: 100%; min-height: 54px; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 18px; }
textarea.field { min-height: 90px; resize: vertical; font-size: 17px; }
.field::placeholder { color: var(--ink-3); }
.row { display: flex; gap: 8px; flex-wrap: wrap; }
.row .field[type=date] { flex: 1 1 160px; }
.hint { color: var(--ink-2); font-size: 15px; margin: 8px 0 0; }
.meta-line { color: var(--ink-2); margin: 6px 0 0; font-size: 16px; display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; }
.badge { display: inline-flex; align-items: center; gap: 6px; font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 999px; background: color-mix(in srgb, var(--c) 16%, #fff); color: var(--c2); }
.badge i { width: 9px; height: 9px; border-radius: 50%; background: var(--c); }
.note-box { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.colors { display: flex; flex-wrap: wrap; gap: 10px; }
.color { width: 40px; height: 40px; border-radius: 50%; border: 0; background: var(--c); }
.color[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 5px var(--ink); }

/* Pièces jointes */
.files { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
.files:empty { display: none; }
.frow { display: flex; align-items: center; gap: 6px; background: var(--card); border: 1.5px solid var(--line); border-radius: 14px; padding: 6px; }
.fopen { flex: 1; min-width: 0; display: flex; align-items: center; gap: 12px; border: 0; background: none; padding: 0; text-align: left; }
.fthumb { width: 56px; height: 56px; flex: 0 0 auto; border-radius: 10px; overflow: hidden; display: flex; align-items: center; justify-content: center; background: color-mix(in srgb, var(--fc) 13%, #fff); border: 1.5px solid color-mix(in srgb, var(--fc) 35%, transparent); }
.fthumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.fthumb b { font: 800 13px/1 var(--font); letter-spacing: .02em; color: var(--fc); }
.finfo { flex: 1; min-width: 0; }
.finfo b { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; font-size: 16px; font-weight: 700; overflow: hidden; overflow-wrap: anywhere; line-height: 1.25; }
.finfo small { display: block; margin-top: 2px; font-size: 13px; color: var(--ink-2); }
.fgo { flex: 0 0 auto; font-weight: 700; font-size: 14px; color: var(--accent); padding: 0 6px; }
.frow .rm { width: 36px; height: 36px; flex: 0 0 auto; border-radius: 50%; border: 0; background: rgba(29, 35, 64, .08); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); }
.frow .rm svg { width: 12px; height: 12px; }
.add-files { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick { position: relative; overflow: hidden; }
.pick input { position: absolute; inset: 0; opacity: 0; font-size: 0; cursor: pointer; }

.viewer { position: fixed; inset: 0; z-index: 40; background: rgba(10, 12, 24, .94); display: flex; flex-direction: column; }
.viewer img { flex: 1 1 auto; min-height: 0; width: 100%; object-fit: contain; }
.viewer .vbar, .viewer .hint-x { flex: 0 0 auto; }

  return new Promise((ok, ko) => {

    r.onerror = () => ko(r.error);

  });

const stable = (v) => (Array.isArray(v) ? `[${v.map(stable).join(',')}]` : v && typeof v === 'object' ? `{${Object.keys(v).filter((k) => v[k] !== undefined).sort().map((k) => JSON.stringify(k) + ':' + stable(v[k])).join(',')}}` : JSON.stringify(v ?? null));

async function fbInit() {
  if (fdb) return;
  const base = 'https://www.gstatic.com/firebasejs/12.17.1/';
  const { initializeApp } = await import(base + 'firebase-app.js');

}
const ref = (kind, id) => fs.doc(fdb, 'plannings', space, kind, id);

// Fusion : ce qui a changé ici garde la version d'ici, le reste prend la version en ligne.
function applyRemote(kind, docs) {
  const R = {};
  docs.forEach((x) => (R[x.id] = x));
  const P = last[kind];
  const L = {};
  db[kind].forEach((x) => (L[x.id] = x));
  const out = [];
  for (const id of new Set([...Object.keys(L), ...Object.keys(R)])) {
    const l = L[id];
    const dirty = (l ? stable(l) : undefined) !== P[id];
    if (dirty) {
      if (l) out.push(l);
    } else if (R[id]) out.push(R[id]);
  }
  // garder l'ordre d'avant (par date de création)
  db[kind] = out.sort((a, b) => (a.createdAt || 0) - (b.createdAt || 0));
  last[kind] = Object.fromEntries(Object.values(R).map((x) => [x.id, stable(x)]));
}

let pushing = false;
let pushAgain = false;
let pushTimer;
function schedulePush() {
  if (!space) return;
  clearTimeout(pushTimer);
  pushTimer = setTimeout(push, 300);
}
async function push() {
  if (!space || !fdb) return;
  if (pushing) {
    pushAgain = true;
    return;
  }
  pushing = true;
  setSync('wait');
  try {
    let b = fs.writeBatch(fdb);
    let n = 0;
    const flush = async () => {
      if (n) await b.commit();
      b = fs.writeBatch(fdb);
      n = 0;
    };
    for (const kind of ['hw', 'subjects']) {
      const cur = {};
      db[kind].forEach((x) => (cur[x.id] = stable(x)));
      for (const [id, j] of Object.entries(cur))
        if (last[kind][id] !== j) {
          b.set(ref(kind, id), JSON.parse(j));
          if (++n >= 400) await flush();
        }
      for (const id of Object.keys(last[kind]))
        if (!cur[id]) {
          b.delete(ref(kind, id));
          if (++n >= 400) await flush();
        }
      await flush();
      last[kind] = cur;
    }
    await pushFiles();
    setSync('ok');
  } catch (e) {
    console.warn(e);
    setSync('error');
  }
  pushing = false;
  if (pushAgain) {
    pushAgain = false;
    push();
  }
}

// Les photos et fichiers : découpés en morceaux (une fiche en ligne ne peut pas dépasser 1 Mo).
const CHUNK = 700000;
const allFileIds = () => new Set(db.hw.flatMap((h) => [...(h.files || []), ...(h.result || [])]).map((f) => f.id));
const toDataUrl = (blob) => new Promise((ok) => {
  const r = new FileReader();
  r.onload = () => ok(r.result);
  r.readAsDataURL(blob);
});
async function pushFiles() {
  const ids = allFileIds();
  for (const id of ids) {
    if (uploaded.has(id)) continue;
    const blob = await getFile(id).catch(() => null);
    if (!blob) continue;
    const data = await toDataUrl(blob);
    const n = Math.ceil(data.length / CHUNK);
    for (let i = 0; i < n; i++) await fs.setDoc(ref('files', `${id}__${i}`), { fid: id, i, n, data: data.slice(i * CHUNK, (i + 1) * CHUNK) });
    uploaded.add(id);
    saveUploaded();
  }
  for (const id of [...uploaded])
    if (!ids.has(id)) {
      const qs = await fs.getDocs(fs.query(fs.collection(fdb, 'plannings', space, 'files'), fs.where('fid', '==', id)));
      await Promise.all(qs.docs.map((d) => fs.deleteDoc(d.ref)));
      uploaded.delete(id);
      saveUploaded();
    }
}
// Un fichier ajouté sur un autre appareil : on le télécharge la première fois qu'on l'ouvre.
async function getFileAny(id) {
  const local = await getFile(id).catch(() => null);
  if (local || !space) return local;
  try {
    await fbInit();
    const qs = await fs.getDocs(fs.query(fs.collection(fdb, 'plannings', space, 'files'), fs.where('fid', '==', id)));
    const parts = qs.docs.map((d) => d.data()).sort((a, b) => a.i - b.i);
    if (!parts.length || parts.length !== parts[0].n) return null;
    const blob = await (await fetch(parts.map((p) => p.data).join(''))).blob();
    await putFile(id, blob);
    uploaded.add(id);
    saveUploaded();
    return blob;
  } catch (e) {
    return null;
  }
}

async function startSync() {
  if (!space) return;
  keepUrl();
  try {
    await fbInit();

  unsubs.forEach((f) => f());

    unsubs.push(

    );

// Les profs d'un devoir (plusieurs possibles, parmi ceux de sa matière).
const teacherIds = (h) => h.teachers || (h.teacher ? [h.teacher] : []);
const teachersOf = (h) => (subject(h.subject)?.teachers || []).filter((t) => teacherIds(h).includes(t.id));

// Deux dates facultatives : la date de rendu possible et la date butoir (la limite).
const keyDate = (h) => h.due || h.deadline || '';
const limitDate = (h) => h.deadline || h.due || '';
// Toujours en jours : « dans 3 jours », « dans 40 jours », « dépassée depuis 2 jours »…
function relText(d, limit) {
  const n = daysLeft(d);
  if (n === 0) return 'aujourd’hui';
  if (n === 1) return 'demain';
  if (n === -1) return limit ? 'dépassée depuis hier' : 'c’était hier';
  if (n < 0) return limit ? `dépassée depuis ${-n} jours` : `il y a ${-n} jours`;
  return `dans ${n} jours`;
}
// La date à droite de chaque devoir, toujours en jours : « Demain », « Dans 12 jours », « Retard 3 j ».
function shortRel(d) {
  const n = daysLeft(d);
  if (n === 0) return 'Aujourd’hui';
  if (n === 1) return 'Demain';
  if (n < 0) return `Retard ${-n} j`;
  return `Dans ${n} jours`;
}
const shortDate = (d) => fmt(d, { weekday: 'short', day: 'numeric', month: 'short' }).replace(/\./g, '');
function datesHtml(h, long) {
  if (h.constant) return '';
  const parts = [];
  if (h.due) parts.push(`<span class="dl"><b>Rendu possible</b> ${esc(long ? fmt(h.due, { weekday: 'long', day: 'numeric', month: 'long' }) : shortDate(h.due))} <em class="${h.done ? '' : dueClass(h.due, false)}">${esc(relText(h.due))}</em></span>`);
  if (h.deadline) parts.push(`<span class="dl butoir"><b>Date butoir</b> ${esc(long ? fmt(h.deadline, { weekday: 'long', day: 'numeric', month: 'long' }) : shortDate(h.deadline))} <em class="${h.done ? '' : dueClass(h.deadline, false)}">${esc(relText(h.deadline, true))}</em></span>`);
  return parts.length ? `<span class="dates${long ? ' long' : ''}">${parts.join('')}</span>` : '';
}

// Recherche dans tous les travaux (à faire et faits) : titre, matière, note, étapes, noms des fichiers, note obtenue.
const snorm = (t) => String(t || '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '');
function searchHtml() {
  const words = snorm(ui.q).split(/\s+/).filter(Boolean);
  const hay = (h) => snorm([h.constant ? 'constant' : '', h.title, subject(h.subject)?.name, ...teachersOf(h).map((t) => t.name), h.note, h.grade, ...(h.steps || []).map((x) => x.text), ...(h.files || []).map((x) => x.name), ...(h.result || []).map((x) => x.name), h.due ? fmt(h.due, { day: 'numeric', month: 'long' }) : '', h.deadline ? 'butoir ' + fmt(h.deadline, { day: 'numeric', month: 'long' }) : ''].join(' '));
  const hits = db.hw.filter((h) => words.every((w) => hay(h).includes(w)));
  if (!hits.length) return `<div class="empty"><b>Aucun travail trouvé</b>Rien ne correspond à « ${esc(ui.q.trim())} ».</div>`;
  const todo = hits.filter((h) => !h.done).sort(byDue);
  const done = hits.filter((h) => h.done).sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return `${todo.length ? `<section class="group"><h2>À faire <small>${todo.length}</small></h2><div class="list">${todo.map(hwHtml).join('')}</div></section>` : ''}
    ${done.length ? `<section class="group"><h2>Faits <small>${done.length}</small></h2><div class="list">${done.map(hwHtml).join('')}</div></section>` : ''}`;
}

function todoHtml(todo) {
  if (!db.hw.length) return `<div class="empty"><b>Aucun devoir</b>Touche « Nouveau devoir » en bas : écris ce qu’il faut faire, la matière et pour quand. Tu peux ajouter une photo de l’énoncé.</div>`;
  if (ui.filter !== 'all' && !todo.some((h) => h.subject === ui.filter)) ui.filter = 'all';
  let html = filterChips(todo);
  const list = todo.filter((h) => ui.filter === 'all' || h.subject === ui.filter).sort(byDue);
  if (!list.length) return html + `<div class="empty"><b>Tout est fait</b>Bravo, il n’y a plus rien à faire.</div>`;
  const groups = [
    ['late', 'En retard', (h) => limitDate(h) && daysLeft(limitDate(h)) < 0],
    ['', 'Aujourd’hui', (h) => keyDate(h) && daysLeft(limitDate(h)) >= 0 && daysLeft(keyDate(h)) <= 0],
    ['', 'Demain', (h) => keyDate(h) && daysLeft(keyDate(h)) === 1],
    ['', 'Cette semaine', (h) => keyDate(h) && daysLeft(keyDate(h)) > 1 && daysLeft(keyDate(h)) < 7],
    ['', 'Plus tard', (h) => keyDate(h) && daysLeft(keyDate(h)) >= 7],
    ['', 'Constant', (h) => !keyDate(h) && h.constant],
    ['', 'Sans date', (h) => !keyDate(h) && !h.constant],
  ];
  for (const [cls, title, test] of groups) {
    const g = list.filter(test);
    if (g.length) html += `<section class="group ${cls}"><h2>${title} <small>${g.length}</small></h2><div class="list">${g.map(hwHtml).join('')}</div></section>`;
  }
  return html;
}

function doneHtml(done) {
  if (!done.length) return `<div class="empty"><b>Rien de fini pour l’instant</b>Coche un devoir quand il est fait : il arrive ici.</div>`;
  const list = done.slice().sort((a, b) => (b.doneAt || 0) - (a.doneAt || 0));
  return `<section class="group"><h2>Faits <small>${list.length}</small></h2><div class="list">${list.map(hwHtml).join('')}</div></section>
    <div class="actions"><button class="btn ghost" data-action="clear-done">Effacer les devoirs faits</button></div>`;
}

const PACKS = {

// Sauvegarde dans un fichier (devoirs, matières, photos et fichiers), pour ne jamais rien perdre.
const backupHtml = () => `<section class="backup"><h4>Sauvegarde</h4>
    <p class="hint" style="margin:0 0 10px">Tes devoirs restent dans ce téléphone, même quand tu recharges la page. Pour être sûr de ne jamais les perdre (nouveau téléphone, données effacées…), garde aussi une copie dans un fichier.${db.savedAt ? ` Dernière sauvegarde : ${esc(new Date(db.savedAt).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long' }))}.` : ''}</p>
    <div class="add-files"><button class="btn ghost" data-action="backup">Sauvegarder</button><label class="btn ghost pick">Restaurer<input type="file" accept=".json,application/json" id="restore"></label></div>
  </section>`;

async function makeBackup() {
  toast('Je prépare la sauvegarde…');
  const files = {};
  for (const h of db.hw)
    for (const f of [...(h.files || []), ...(h.result || [])]) {
      const blob = await getFileAny(f.id).catch(() => null);
      if (blob) files[f.id] = await new Promise((ok) => {
        const r = new FileReader();
        r.onload = () => ok(r.result);
        r.readAsDataURL(blob);
      });
    }
  const day = todayIso();
  const out = new File([JSON.stringify({ app: 'mes-devoirs', version: 1, at: Date.now(), db, files })], `sauvegarde-devoirs-${day}.json`, { type: 'application/json' });
  await shareFile(out);
  db.savedAt = Date.now();
  save();
  render();
}

// Restaurer : on ajoute ce qui manque, sans rien effacer de ce qui est déjà là.
async function restoreBackup(file) {
  let data;
  try {
    data = JSON.parse(await file.text());
  } catch (e) {
    return toast('Ce fichier n’est pas une sauvegarde de devoirs.');
  }
  if (!data?.db?.hw) return toast('Ce fichier n’est pas une sauvegarde de devoirs.');
  let nh = 0;
  for (const s of data.db.subjects || []) if (!db.subjects.some((x) => x.id === s.id)) db.subjects.push(s);
  for (const h of data.db.hw)
    if (!db.hw.some((x) => x.id === h.id)) {
      db.hw.push(h);
      nh++;
    }
  for (const [id, url] of Object.entries(data.files || {})) {
    if (await getFile(id).catch(() => null)) continue;
    try {
      await putFile(id, await (await fetch(url)).blob());
    } catch (e) {}
  }
  save();
  render();
  toast(nh ? `${nh} devoir${nh > 1 ? 's' : ''} retrouvé${nh > 1 ? 's' : ''} !` : 'Tout était déjà là.');
}

function subjectsHtml() {
  if (!db.subjects.length) return `<div class="empty"><b>Pas encore de matière</b>Ajoute tes matières : chaque devoir prend la couleur de sa matière.</div>${packHtml()}${backupHtml()}`;
  const hasPack = PACKS.archi.every((n) => db.subjects.some((x) => x.name === n));
  return `<section class="group"><h2>Matières <small>${db.subjects.length}</small></h2><div class="list">${db.subjects
    .map((s) => {
      const todo = db.hw.filter((h) => h.subject === s.id && !h.done).length;

document.addEventListener('click', (e) => {
  if (e.target.closest('.sheet-back, .viewer')) return;
  if (e.target.closest('[data-clear-q]')) {
    ui.q = '';
    render();
    return document.getElementById('q')?.focus();
  }
  const tab = e.target.closest('[data-tab]');
  if (tab) {
    ui.tab = tab.dataset.tab;
    return render();
  }
  const f = e.target.closest('[data-filter]');
  if (f) {
    ui.filter = f.dataset.filter;
    return render();
  }
  const see = e.target.closest('[data-see]');
  if (see) {
    ui.tab = 'todo';
    ui.filter = see.dataset.see;
    render();
    return window.scrollTo(0, 0);
  }
  const d = e.target.closest('[data-done]');
  if (d) return armDone(d);
  const o = e.target.closest('[data-open]');
  if (o) return openDetail(o.dataset.open);
  const es = e.target.closest('[data-edit-subject]');
  if (es) return openSubject(es.dataset.editSubject);
  const a = e.target.closest('[data-action]')?.dataset.action;
  const pk = e.target.closest('[data-pack]');
  if (pk) {
    let n = 0;
    for (const name of PACKS[pk.dataset.pack]) {
      if (db.subjects.some((x) => x.name.toLowerCase() === name.toLowerCase())) continue;
      db.subjects.push({ id: uid(), name, color: COLORS[db.subjects.length % COLORS.length] });
      n++;
    }
    save();
    render();
    return toast(n ? `${n} matières ajoutées.` : 'Elles sont déjà là.');
  }
  if (a === 'backup') return makeBackup();
  if (a === 'invite') return openInvite();
  if (a === 'reload') {
    // Recharge la dernière version de l'appli (les devoirs restent dans le téléphone).
    toast('Je recharge…');
    const u = new URL(location.href);
    u.searchParams.set('r', Date.now());
    return location.replace(u.toString());
  }
  if (a === 'new') openEditor(null);
  else if (a === 'new-subject') openSubject(null);
  else if (a === 'clear-done') {
    if (!confirm('Effacer tous les devoirs faits (et leurs photos) ?')) return;
    db.hw.filter((h) => h.done).forEach((h) => [...(h.files || []), ...(h.result || [])].forEach((x) => delFile(x.id)));
    db.hw = db.hw.filter((h) => !h.done);
    save();
    render();
    toast('Devoirs faits effacés.');
  }
});

// Sécurité : il faut appuyer deux fois (dans les 3 secondes) pour cocher ou décocher un devoir.
let armed = null;
function armDone(btn) {
  const id = btn.dataset.done;
  if (armed && armed.id === id && Date.now() < armed.until) {
    clearTimeout(armed.timer);
    armed = null;
    return toggleDone(id);
  }
  if (armed) {
    clearTimeout(armed.timer);
    document.querySelector('.check.arm')?.classList.remove('arm');
  }
  const h = db.hw.find((x) => x.id === id);
  btn.classList.add('arm');
  armed = { id, until: Date.now() + 3000, timer: setTimeout(() => {
    armed = null;
    document.querySelector('.check.arm')?.classList.remove('arm');
  }, 3000) };
  toast(h?.done ? 'Appuie encore pour le remettre à faire' : 'Appuie encore sur la case pour confirmer');
}

function toggleDone(id) {
  const h = db.hw.find((x) => x.id === id);
  if (!h || (h.constant && !h.done)) return;
  h.done = !h.done;
  h.doneAt = h.done ? Date.now() : null;

  render();
  if (!document.querySelector('.sheet-back')) toast(h.done ? 'Bien joué ! Touche le devoir pour ajouter ton rendu.' : 'Remis à faire.');

// Photos réduites avant d'être rangées (une photo d'iPhone est très lourde).
async function shrinkImage(file) {
  if (!/^image\/(jpeg|png|heic|heif|webp)/.test(file.type) && !/\.(heic|jpe?g|png)$/i.test(file.name)) return file;
  try {
    const img = await new Promise((ok, ko) => {
      const im = new Image();
      im.onload = () => ok(im);
      im.onerror = ko;
      im.src = URL.createObjectURL(file);
    });
    const k = Math.min(1, 2000 / Math.max(img.naturalWidth, img.naturalHeight));
    const cv = document.createElement('canvas');
    cv.width = Math.round(img.naturalWidth * k);
    cv.height = Math.round(img.naturalHeight * k);
    cv.getContext('2d').drawImage(img, 0, 0, cv.width, cv.height);
    URL.revokeObjectURL(img.src);
    const blob = await new Promise((ok) => cv.toBlob(ok, 'image/jpeg', 0.85));
    return blob ? new File([blob], (file.name || 'photo').replace(/\.\w+$/, '') + '.jpg', { type: 'image/jpeg' }) : file;
  } catch (e) {
    return file;
  }
}

// Le type d'un fichier : son extension en grand, dans une couleur reconnaissable.
function fileKind(f) {
  const ext = ((f.name || '').match(/\.([a-z0-9]{1,5})$/i)?.[1] || '').toLowerCase();
  if (/^image\//.test(f.type) || /^(jpe?g|png|heic|gif|webp)$/.test(ext)) return { label: 'Photo', short: 'IMG', c: '#2E7D4F' };
  if (ext === 'pdf' || /pdf/.test(f.type)) return { label: 'PDF', short: 'PDF', c: '#C5221F' };
  if (/^(docx?|odt|pages|rtf|txt)$/.test(ext)) return { label: 'Document', short: ext.toUpperCase().slice(0, 4), c: '#1A5FB4' };
  if (/^(xlsx?|ods|csv|numbers)$/.test(ext)) return { label: 'Tableur', short: ext.toUpperCase().slice(0, 4), c: '#1E7B45' };
  if (/^(pptx?|odp|key)$/.test(ext)) return { label: 'Présentation', short: ext.toUpperCase().slice(0, 4), c: '#C2570C' };
  if (/^(dwg|dxf|skp|3dm|rvt|ifc|obj|blend|max|c4d)$/.test(ext)) return { label: 'Plan / 3D', short: ext.toUpperCase().slice(0, 4), c: '#7E3FBF' };
  if (/^(zip|rar|7z)$/.test(ext)) return { label: 'Archive', short: ext.toUpperCase(), c: '#4D5466' };
  if (/^(mp4|mov|m4v)$/.test(ext) || /^video\//.test(f.type)) return { label: 'Vidéo', short: ext.toUpperCase() || 'VID', c: '#B3261E' };
  return { label: 'Fichier', short: (ext || 'FIC').toUpperCase().slice(0, 4), c: '#4D5466' };
}
const sizeText = (n) => (!n ? '' : n < 1024 * 1024 ? `${Math.max(1, Math.round(n / 1024))} Ko` : `${(n / 1024 / 1024).toFixed(1).replace('.', ',')} Mo`);

async function filesGridHtml(files, removable) {
  const parts = [];

 <button type="button" class="fopen" data-file="${f.id}" aria-label="Ouvrir ${esc(f.name)}">
        <span class="fthumb" style="--fc:${k.c}">${img ? `<img src="${blobUrl(blob)}" alt="">` : `<b>${esc(k.short)}</b>`}</span>
        <span class="finfo"><b>${esc(blob ? f.name : 'Fichier introuvable')}</b><small>${esc([k.label, sizeText(f.size || blob?.size)].filter(Boolean).join(' · '))}</small></span>
        <span class="fgo">Ouvrir</span>
      </button> ${removable ? `<button type="button" class="rm" data-rm="${f.id}" aria-label="Enlever ${esc(f.name)}">${icons.close}</button>` : ''}

async function openFile(f) {
  const blob = await getFileAny(f.id).catch(() => null);
  if (!blob) return toast('Ce fichier n’est plus sur ce téléphone.');
  if (/^image\//.test(f.type)) {
    const v = document.createElement('div');
    v.className = 'viewer';
    const u = URL.createObjectURL(blob);
    v.innerHTML = `<div class="vbar"><button data-share>Partager</button><button class="x" data-x aria-label="Fermer la photo">${icons.close}</button></div><img src="${u}" alt="${esc(f.name)}"><p class="hint-x">Touche la croix en haut à droite pour revenir.</p>`;
    v.addEventListener('click', (e) => {
      if (e.target.closest('[data-share]')) return shareFile(new File([blob], f.name, { type: f.type }));
      if (e.target.closest('[data-x]') || e.target === v) {
        URL.revokeObjectURL(u);
        v.remove();
      }
    });
    document.body.appendChild(v);
  } else shareFile(new File([blob], f.name, { type: f.type || 'application/octet-stream' }));
}

// Sur iPhone, la feuille « Partager » ouvre le fichier (Fichiers, Mail, AirDrop…).
async function shareFile(file) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      return await navigator.share({ files: [file], title: file.name });
    } catch (e) {
      if (e.name === 'AbortError') return;
    }
  }
  const u = URL.createObjectURL(file);
  const a = document.createElement('a');
  a.href = u;
  a.download = file.name;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(u), 60000);
}

  const syncDue = () => {
    back.querySelectorAll('[data-due]').forEach((c) => c.setAttribute('aria-pressed', String(!constant && c.dataset.due === due)));
    back.querySelectorAll('[data-limit]').forEach((c) => c.setAttribute('aria-pressed', String(!constant && c.dataset.limit === deadline)));
    back.querySelector('[data-constant]').setAttribute('aria-pressed', String(constant));
    back.querySelector('#constant-hint').hidden = !constant;
    back.querySelector('#dates-box').classList.toggle('off', constant);
    back.querySelector('#due-rel').textContent = due ? `→ ${relText(due)}` : '';
    back.querySelector('#limit-rel').textContent = deadline ? `→ ${relText(deadline, true)}` : '';
  };
  syncDue();
  dueIn.addEventListener('change', () => {
    due = dueIn.value;
    if (due) constant = false;
    syncDue();
  });
  limitIn.addEventListener('change', () => {
    deadline = limitIn.value;
    if (deadline) constant = false;
    syncDue();
  });
  const drawSteps = () => {
    back.querySelector('#steps').innerHTML = steps.map((x, i) => `<div class="step-edit"><span>${i + 1}.</span><b>${esc(x.text)}</b><button type="button" class="rm-step" data-step-rm="${x.id}" aria-label="Enlever l’étape ${esc(x.text)}">${icons.close}</button></div>`).join('');
  };
  drawSteps();
  const stepIn = back.querySelector('#step-new');
  const addStep = () => {
    const t = stepIn.value.trim();
    if (!t) return stepIn.focus();
    steps.push({ id: uid(), text: t, done: false });
    stepIn.value = '';
    drawSteps();
    stepIn.focus();
  };
  stepIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addStep();
    }
  });
  const drawFiles = async () => {
    back.querySelector('#files').innerHTML = await filesGridHtml(files, true);
  };
  drawFiles();
  const addFiles = async (list) => {
    for (const raw of list) {
      const file = await shrinkImage(raw);
      const f = { id: uid(), name: file.name || 'fichier', type: file.type || '', size: file.size };
      try {
        await putFile(f.id, file);
      } catch (e) {
        toast('Impossible d’enregistrer ce fichier (trop gros ?).');
        continue;
      }
      files.push(f);
      added.push(f.id);
    }
    drawFiles();
  };
  back.querySelector('#add-photo').addEventListener('change', (e) => {
    addFiles([...e.target.files]);
    e.target.value = '';
  });
  back.querySelector('#add-file').addEventListener('change', (e) => {
    addFiles([...e.target.files]);
    e.target.value = '';
  });
  let saved = false;
  back.addEventListener('click', (e) => {
    const s = e.target.closest('[data-subj]');
    if (s) {
      subj = subj === s.dataset.subj ? null : s.dataset.subj;
      teachers = [];
      return drawSubjects();
    }
    if (e.target.closest('[data-subj-new]')) {
      const name = (prompt('Nom de la matière (ex. Maths) :') || '').trim();
      if (!name) return;
      const ns = { id: uid(), name: name.slice(0, 40), color: COLORS[db.subjects.length % COLORS.length] };
      db.subjects.push(ns);
      save();
      subj = ns.id;
      return drawSubjects();
    }
    const tc = e.target.closest('[data-teacher]');
    if (tc) {
      const tid = tc.dataset.teacher;
      teachers = teachers.includes(tid) ? teachers.filter((x) => x !== tid) : [...teachers, tid];
      return drawSubjects();
    }
    if (e.target.closest('[data-teacher-new]')) {
      const sb = subject(subj);
      const name = (prompt(`Nom du prof de ${sb.name} (ex. Mme Martin) :`) || '').trim();
      if (!name) return;
      const t = { id: uid(), name: name.slice(0, 60) };
      sb.teachers = [...(sb.teachers || []), t];
      save();
      teachers = [...teachers, t.id];
      return drawSubjects();
    }
    const q = e.target.closest('[data-due]');
    if (q) {
      due = due === q.dataset.due ? '' : q.dataset.due;
      dueIn.value = due;
      constant = false;
      return syncDue();
    }
    const ql = e.target.closest('[data-limit]');
    if (ql) {
      deadline = deadline === ql.dataset.limit ? '' : ql.dataset.limit;
      limitIn.value = deadline;
      constant = false;
      return syncDue();
    }
    const cd = e.target.closest('[data-clear-date]');
    if (cd) {
      if (cd.dataset.clearDate === 'due') due = dueIn.value = '';
      else deadline = limitIn.value = '';
      return syncDue();
    }
    if (e.target.closest('[data-constant]')) {
      constant = !constant;
      if (constant) {
        due = dueIn.value = '';
        deadline = limitIn.value = '';
      }
      return syncDue();
    }
    if (e.target.closest('[data-step-add]')) return addStep();
    const rs = e.target.closest('[data-step-rm]');
    if (rs) {
      steps = steps.filter((x) => x.id !== rs.dataset.stepRm);
      return drawSteps();
    }
    const rm = e.target.closest('[data-rm]');
    if (rm) {
      files = files.filter((x) => x.id !== rm.dataset.rm);
      return drawFiles();
    }
    const of = e.target.closest('[data-file]');
    if (of) openFile(files.find((x) => x.id === of.dataset.file));
  });
  // Fermer sans enregistrer : les fichiers ajoutés ici sont effacés.
  const obs = new MutationObserver(() => {
    if (!document.body.contains(back)) {
      obs.disconnect();
      if (!saved) added.forEach(delFile);
    }
  });
  obs.observe(document.body, { childList: true });
  back.querySelector('#hw-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = back.querySelector('#hw-title').value.trim();
    if (!title) {
      back.querySelector('#hw-title').focus();
      return toast('Écris ce qu’il faut faire.');
    }
    const data = { title, subject: subj || null, teachers: subj ? teachers : [], teacher: null, due: constant ? '' : dueIn.value || '', deadline: constant ? '' : limitIn.value || '', constant: constant && !dueIn.value && !limitIn.value, note: back.querySelector('#hw-note').value.trim(), files, steps };
    if (stepIn.value.trim()) data.steps.push({ id: uid(), text: stepIn.value.trim(), done: false });
    if (data.constant) Object.assign(data, { done: false, doneAt: null });
    if (cur) {
      (cur.files || []).filter((x) => !files.some((y) => y.id === x.id)).forEach((x) => delFile(x.id));
      Object.assign(cur, data);
    } else db.hw.push({ id: uid(), done: false, doneAt: null, createdAt: Date.now(), ...data });
    saved = true;
    save();
    closeSheet();
    ui.tab = 'todo';
    render();
    toast(cur ? 'Modifié !' : data.constant ? 'Ajouté en constant !' : limitDate(data) ? `Ajouté : ${relText(limitDate(data), !!data.deadline)} !` : 'Ajouté !');
  });
  if (!cur) setTimeout(() => back.querySelector('#hw-title').focus(), 80);
}

async function openDetail(id) {
  const h = db.hw.find((x) => x.id === id);
  if (!h) return;
  const s = subject(h.subject);
  let confirmDel = false;
  const back = showSheet(`<div class="sheet-head"><h3>${esc(h.title)}</h3>${closeBtn}</div>
    <p class="meta-line">${s ? `<span class="badge" style="${subjStyle(s)}">${mark(s, 22)}${esc(s.name)}</span>` : ''}${profHtml(h)}${h.constant ? '<span>Constant : à faire en continu</span>' : keyDate(h) ? '' : '<span>Sans date</span>'}${h.done ? '<span style="color:var(--ok);font-weight:700">· Fait</span>' : limitDate(h) && daysLeft(limitDate(h)) < 0 ? '<span style="color:var(--late);font-weight:700">· En retard</span>' : ''}</p>
    ${datesHtml(h, true)}
    ${h.note ? `<div class="note-box">${esc(h.note)}</div>` : ''}
    ${(h.steps || []).length ? `<span class="label">Étapes <small id="steps-sum"></small></span><div class="list" id="steps-list"></div>` : ''}
    ${h.done ? '<div id="rendu-slot"></div>' : ''}
    ${(h.files || []).length ? `<span class="label">Photos et fichiers de l’énoncé</span><div class="files" id="files"></div>` : ''}
    <section class="rendu${h.done ? ' on' : ''}">
      <h4>${h.constant ? 'Mes travaux' : 'Mon rendu'} <small>${h.constant ? 'ajoute tes travaux au fur et à mesure' : h.done ? 'le résultat de ton travail' : 'quand c’est fait'}</small></h4>
      <div class="files" id="result"></div>
      <div class="add-files">
        <label class="btn ghost pick">${icons.camera} Photo<input type="file" accept="image/*" capture="environment" id="res-photo"></label>
        <label class="btn ghost pick">${icons.clip} Fichier<input type="file" multiple id="res-file"></label>
      </div>
      <label class="label" for="res-grade" style="margin-top:14px">Note obtenue <small>(facultatif)</small></label>
      <input id="res-grade" class="field" value="${esc(h.grade || '')}" placeholder="ex. 15/20, A, très bien…" maxlength="40" autocomplete="off" style="max-width:240px">
    </section>
    <div class="actions">
      ${h.constant ? '<p class="const-note">' + icons.loop + '<span>Travail constant : il se fait en continu, il reste toujours dans ta liste.</span></p>' : `<button class="btn ${h.done ? 'ghost' : 'ok'}" data-toggle>${h.done ? 'Remettre à faire' : `${icons.check} C’est fait !`}</button>`}
      ${!h.done && limitDate(h) && daysLeft(limitDate(h)) >= 1 ? `<button class="btn ghost" data-remind>${icons.cal} Rappel dans mon agenda</button>` : ''}
      <button class="btn ghost" data-edit>${icons.edit} Modifier</button>
      <button class="btn danger" data-del>Supprimer</button>
    </div>
    ${!h.done && limitDate(h) && daysLeft(limitDate(h)) >= 1 ? `<p class="hint">Le rappel te prévient la veille à 18 h${h.deadline ? ' (de la date butoir)' : ''}.</p>` : ''}`);
  const drawChecks = () => {
    const box = back.querySelector('#steps-list');
    if (!box) return;
    const d = h.steps.filter((x) => x.done).length;
    back.querySelector('#steps-sum').textContent = `(${d} sur ${h.steps.length} faites)`;
    box.innerHTML = h.steps.map((x) => `<div class="hw${x.done ? ' done' : ''}"><button class="check" data-step="${x.id}" aria-pressed="${!!x.done}" aria-label="${x.done ? 'Pas encore faite' : 'Faite'} : ${esc(x.text)}">${icons.check}</button><span class="hw-title" style="flex:1">${esc(x.text)}</span></div>`).join('');
  };
  drawChecks();
  if ((h.files || []).length) back.querySelector('#files').innerHTML = await filesGridHtml(h.files, false);
  const slot = back.querySelector('#rendu-slot');
  if (slot) slot.replaceWith(back.querySelector('.rendu'));
  const drawResult = async () => {
    back.querySelector('#result').innerHTML = await filesGridHtml(h.result || [], true);
  };
  drawResult();
  const addResult = async (list) => {
    h.result = h.result || [];
    for (const raw of list) {
      const file = await shrinkImage(raw);
      const f = { id: uid(), name: file.name || 'rendu', type: file.type || '', size: file.size };
      try {
        await putFile(f.id, file);
      } catch (e) {
        toast('Impossible d’enregistrer ce fichier (trop gros ?).');
        continue;
      }
      h.result.push(f);
    }
    save();
    drawResult();
    render();
    toast('Rendu ajouté !');
  };
  for (const sel of ['#res-photo', '#res-file'])
    back.querySelector(sel).addEventListener('change', (e) => {
      addResult([...e.target.files]);
      e.target.value = '';
    });
  back.querySelector('#res-grade').addEventListener('change', (e) => {
    h.grade = e.target.value.trim();
    save();
    render();
  });
  back.addEventListener('click', (e) => {
    const rr = e.target.closest('#result [data-rm]');
    if (rr) {
      delFile(rr.dataset.rm);
      h.result = (h.result || []).filter((x) => x.id !== rr.dataset.rm);
      save();
      drawResult();
      return render();
    }
    const rf = e.target.closest('#result [data-file]');
    if (rf) return openFile(h.result.find((x) => x.id === rf.dataset.file));
    const sc = e.target.closest('[data-step]');
    if (sc) {
      const x = h.steps.find((y) => y.id === sc.dataset.step);
      x.done = !x.done;
      save();
      drawChecks();
      render();
      if (h.steps.every((y) => y.done) && !h.done) toast('Toutes les étapes sont faites : coche le devoir quand tu l’as rendu !');
      return;
    }
    const of = e.target.closest('[data-file]');
    if (of) return openFile(h.files.find((x) => x.id === of.dataset.file));
    const tg = e.target.closest('[data-toggle]');
    if (tg && !tg.dataset.sure) {
      // Premier appui : on demande de confirmer.
      tg.dataset.sure = '1';
      const old = tg.innerHTML;
      tg.classList.add('confirm');
      tg.textContent = h.done ? 'Appuie encore pour remettre à faire' : 'Appuie encore pour confirmer : c’est fait';
      setTimeout(() => {
        if (!document.body.contains(tg)) return;
        delete tg.dataset.sure;
        tg.classList.remove('confirm');
        tg.innerHTML = old;
      }, 3000);
      return;
    }
    if (tg) {
      const wasDone = h.done;
      closeSheet();
      toggleDone(id);
      if (!wasDone) {
        openDetail(id).then(() => document.querySelector('.rendu')?.scrollIntoView({ behavior: 'smooth', block: 'center' }));
        toast('Bien joué ! Ajoute ton rendu si tu veux.');
      }
      return;
    }
    if (e.target.closest('[data-edit]')) return openEditor(id);
    if (e.target.closest('[data-remind]')) return shareFile(new File([icsOf(h)], 'rappel-devoir.ics', { type: 'text/calendar' }));
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!confirmDel) {
        confirmDel = true;
        del.textContent = 'Appuie encore pour supprimer';
        return;
      }
      [...(h.files || []), ...(h.result || [])].forEach((x) => delFile(x.id));
      db.hw = db.hw.filter((x) => x.id !== id);
      save();
      closeSheet();
      render();
      toast('Supprimé.');
    }
  });
}

// Rappel : un événement le jour du rendu, avec une alerte la veille à 18 h.
function icsOf(h) {
  const t = (s) => String(s || '').replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');
  const day = limitDate(h);
  const d = day.replace(/-/g, '');
  const next = iso(addDays(parseIso(day), 1)).replace(/-/g, '');
  const s = subject(h.subject);
  return ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Mes devoirs//FR', 'BEGIN:VEVENT', `UID:devoir-${h.id}@mes-devoirs`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`,
    `DTSTART;VALUE=DATE:${d}`, `DTEND;VALUE=DATE:${next}`, `SUMMARY:${t(`Devoir${s ? ' de ' + s.name : ''} : ${h.title}`)}`, h.note ? `DESCRIPTION:${t(h.note)}` : '',
    'BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${t('À rendre demain : ' + h.title)}`, 'TRIGGER:-PT6H', 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR'].filter(Boolean).join('\r\n');
}

// Matières : nom et couleur.
function openSubject(id) {
  const cur = id ? subject(id) : null;
  let color = cur?.color || COLORS[db.subjects.length % COLORS.length];
  let animal = cur ? animalOf(cur) : ANIMAL_KEYS[db.subjects.length % ANIMAL_KEYS.length];
  let confirmDel = false;
  const back = showSheet(`<div class="sheet-head"><h3>${cur ? 'Modifier la matière' : 'Nouvelle matière'}</h3>${closeBtn}</div>
    <form id="s-form">
      <label class="label" for="s-name">Nom</label>
      <input id="s-name" class="field" value="${esc(cur?.name || '')}" placeholder="ex. Maths" maxlength="40" autocomplete="off">
      <span class="label">Couleur</span>
      <div class="colors">${COLORS.map((c) => `<button type="button" class="color" style="--c:${c}" data-color="${c}" aria-label="Couleur" aria-pressed="${c === color}"></button>`).join('')}</div>
      <span class="label">Prof <small>(un ou plusieurs, facultatif)</small></span>
      <div class="steps-edit" id="teachers"></div>
      <div class="row"><input id="t-new" class="field" placeholder="ex. Mme Martin" maxlength="60" autocomplete="off" enterkeyhint="done" style="flex:1 1 200px"><button type="button" class="chip" data-t-add>${icons.plus} Ajouter</button></div>
      ${ANIMALS_ON ? '<span class="label">Chien</span><div class="animals" id="animals"></div>' : ''}
      <div class="actions"><button class="btn" type="submit">${cur ? 'Enregistrer' : 'Ajouter la matière'}</button>${cur ? '<button class="btn danger" type="button" data-del>Supprimer la matière</button>' : ''}</div>
    </form>`);
  let teachers = (cur?.teachers || []).map((t) => ({ ...t }));
  const tIn = back.querySelector('#t-new');
  const drawTeachers = () => {
    back.querySelector('#teachers').innerHTML = teachers.map((t) => `<div class="step-edit"><span>${icons.user}</span><b>${esc(t.name)}</b><button type="button" class="rm-step" data-t-rm="${t.id}" aria-label="Enlever ${esc(t.name)}">${icons.close}</button></div>`).join('');
  };
  drawTeachers();
  const addTeacher = () => {
    const n = tIn.value.trim();
    if (!n) return tIn.focus();
    teachers.push({ id: uid(), name: n });
    tIn.value = '';
    drawTeachers();
    tIn.focus();
  };
  tIn.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') {
      e.preventDefault();
      addTeacher();
    }
  });
  const drawAnimals = () => {
    const box = back.querySelector('#animals');
    if (box) box.innerHTML = ANIMAL_KEYS.map((k) => `<button type="button" class="animal-btn" data-animal="${k}" aria-pressed="${k === animal}" aria-label="${ANIMALS[k].name}">${animalSvg(k, color, 40)}<small>${ANIMALS[k].name}</small>${ANIMALS[k].star ? '<em class="star">La star</em>' : ''}</button>`).join('');
  };
  drawAnimals();
  back.addEventListener('click', (e) => {
    const c = e.target.closest('[data-color]');
    if (c) {
      color = c.dataset.color;
      back.querySelectorAll('[data-color]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.color === color)));
      return drawAnimals();
    }
    const an = e.target.closest('[data-animal]');
    if (an) {
      animal = an.dataset.animal;
      return drawAnimals();
    }
    if (e.target.closest('[data-t-add]')) return addTeacher();
    const tr = e.target.closest('[data-t-rm]');
    if (tr) {
      teachers = teachers.filter((t) => t.id !== tr.dataset.tRm);
      return drawTeachers();
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!confirmDel) {
        confirmDel = true;
        del.textContent = 'Appuie encore (les devoirs restent, sans matière)';
        return;
      }
      db.subjects = db.subjects.filter((s) => s.id !== id);
      db.hw.forEach((h) => h.subject === id && (h.subject = null));
      if (ui.filter === id) ui.filter = 'all';
      save();
      closeSheet();
      render();
      toast('Matière supprimée.');
    }
  });
  back.querySelector('#s-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = back.querySelector('#s-name').value.trim();
    if (!name) return back.querySelector('#s-name').focus();
    if (tIn.value.trim()) teachers.push({ id: uid(), name: tIn.value.trim() });
    if (cur) {
      Object.assign(cur, { name, color, animal, teachers });
      db.hw.forEach((h) => {
        if (h.subject !== cur.id) return;
        const keep = teacherIds(h).filter((id) => teachers.some((t) => t.id === id));
        if (keep.length !== teacherIds(h).length) Object.assign(h, { teachers: keep, teacher: null });
      });
    } else db.subjects.push({ id: uid(), name, color, animal, teachers });
    save();
    closeSheet();
    render();
    toast(cur ? 'Modifié !' : 'Matière ajoutée.');
  });
  setTimeout(() => back.querySelector('#s-name').focus(), 80);
}

// Demander au navigateur de garder les données (photos comprises).
navigator.storage?.persist?.().catch(() => {});
// Retour sur l'appli (ou minuit passé) : les dates « aujourd'hui / demain » se remettent à jour.
document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && !document.querySelector('.sheet-back') && render());
render();
startSync();
document.addEventListener('keydown', (e) => {
  if (e.key !== 'Escape') return;
  const v = document.querySelector('.viewer');
  if (v) return v.querySelector('[data-x]').click();
  if (document.querySelector('.sheet-back')) closeSheet();
});
</script>
