<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#101a4d">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Pilotage atelier</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b1336;
  --bg-2: #111c4a;
  --navy: #17266b;
  --line: rgba(196, 210, 255, .14);
  --ink: #eef2ff;
  --ink-2: #aeb9e6;
  --paper: #f5f7fd;
  --paper-2: #ebeffa;
  --paper-ink: #131c45;
  --paper-ink-2: #56608d;
  --paper-line: #dde3f3;
  --sel: #8fd3ff;
  --sel-ink: #071640;
  --qm: #2f8f5b;
  --qam: #d0731d;
  --qn: #6d4cc8;
  --pole: #fff0a6;
  --red: #d63a2f;
  --blue: #2f45c4;
  --font: "Barlow", -apple-system, "Segoe UI", Roboto, sans-serif;
  --cond: "Barlow Condensed", "Barlow", -apple-system, sans-serif;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: radial-gradient(1200px 500px at 15% -10%, #1a2a78 0%, transparent 60%), var(--bg); color: var(--ink); font: 500 16px/1.35 var(--font); min-height: 100vh; -webkit-text-size-adjust: 100%; font-variant-numeric: tabular-nums; }
::selection { background: var(--sel); color: var(--sel-ink); }
button { font: inherit; color: inherit; cursor: pointer; }
:focus-visible { outline: 3px solid var(--sel); outline-offset: 2px; border-radius: 8px; }
* { scrollbar-width: thin; scrollbar-color: #b9c3e3 transparent; }
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { background: #b9c3e3; border-radius: 8px; }
.app { max-width: 1900px; margin: 0 auto; padding: max(14px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) 14px max(16px, env(safe-area-inset-left)); display: flex; flex-direction: column; gap: 12px; min-height: 100vh; }
svg { flex: 0 0 auto; }

/* En-tête */
.head { display: flex; align-items: center; gap: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--line); }
.badge { flex: 0 0 auto; background: #fff; color: var(--navy); border-radius: 12px; padding: 6px 14px; font: 800 26px/1 var(--cond); letter-spacing: .02em; box-shadow: 0 6px 18px -8px rgba(0, 0, 0, .6); }
.titles { flex: 1; min-width: 0; }
.titles small { display: block; font: 700 14px/1.1 var(--cond); letter-spacing: .12em; text-transform: uppercase; color: var(--ink-2); }
.titles h1 { margin: 3px 0 0; font: 800 clamp(24px, 2.6vw, 38px)/1 var(--cond); letter-spacing: .01em; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.titles h1 b { color: var(--sel); font-weight: 800; }
.titles h1 i { font-style: normal; color: var(--ink-2); font-weight: 600; margin: 0 .25em; }
.clock { flex: 0 0 auto; text-align: right; }
.clock b { display: block; font: 700 clamp(26px, 2.6vw, 40px)/1 var(--cond); letter-spacing: .02em; }
.clock small { display: inline-flex; align-items: center; gap: 6px; margin-top: 4px; font: 700 13px/1 var(--cond); letter-spacing: .08em; text-transform: uppercase; color: var(--ink-2); }
.clock small i { width: 8px; height: 8px; border-radius: 50%; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 30%, transparent); }
.week { flex: 0 0 auto; border-radius: 14px; padding: 8px 18px; text-align: center; background: var(--bg-2); border: 1px solid var(--line); }
.week b { display: block; font: 800 clamp(20px, 1.9vw, 28px)/1.05 var(--cond); letter-spacing: .02em; text-transform: uppercase; }
.week b span { color: var(--sel); }
.week small { color: var(--ink-2); font-size: 13px; font-weight: 600; }
.tools { display: flex; gap: 6px; }
.tool { width: 44px; height: 44px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); transition: background-color .15s ease-out, color .15s ease-out, transform .12s ease-out; }
.tool:hover { background: var(--navy); color: var(--ink); }
.tool:active { transform: scale(.94); }
.tool svg { width: 20px; height: 20px; }

/* Jours */
.days { display: flex; gap: 6px; align-items: stretch; }
.days .arrow { flex: 0 0 auto; width: 42px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); }
.days .arrow svg { width: 20px; height: 20px; }
.day { position: relative; flex: 1; min-width: 0; border-radius: 12px; border: 1px solid var(--line); background: var(--bg-2); padding: 7px 4px 8px; text-align: center; transition: background-color .15s ease-out, transform .12s ease-out; }
.day:hover { background: var(--navy); }
.day:active, .days .arrow:active { transform: scale(.97); }
.day b { display: block; font: 700 18px/1.1 var(--cond); letter-spacing: .03em; text-transform: uppercase; }
.day small { color: var(--ink-2); font-size: 13px; font-weight: 600; }
.day.today::after { content: ""; position: absolute; top: 7px; right: 8px; width: 7px; height: 7px; border-radius: 50%; background: var(--sel); }
.day[aria-pressed="true"] { background: var(--sel); color: var(--sel-ink); border-color: var(--sel); box-shadow: 0 8px 22px -12px rgba(143, 211, 255, .9); }
.day[aria-pressed="true"] small { color: #24406e; }
.day.today[aria-pressed="true"]::after { background: var(--sel-ink); }

/* Corps : tableau + panneaux */
.body { display: grid; grid-template-columns: minmax(0, 2.15fr) minmax(300px, 1fr); gap: 12px; flex: 1; min-height: 0; }
.board { background: var(--paper); color: var(--paper-ink); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; min-height: 0; box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .8); }
table { width: 100%; border-collapse: collapse; table-layout: fixed; }
thead th { position: sticky; top: 0; z-index: 1; padding: 12px 8px 10px; font: 800 17px/1 var(--cond); text-transform: uppercase; letter-spacing: .05em; background: var(--paper); border-bottom: 1px solid var(--paper-line); }
thead th.acts { text-align: left; width: 33%; padding-left: 14px; color: var(--paper-ink-2); }
thead th.shift-h { color: var(--c); background: color-mix(in srgb, var(--c) 16%, #fff); border-bottom: 3px solid var(--c); }
thead th.shift-h span { display: inline-flex; align-items: center; gap: 7px; }
thead th.shift-h span::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
thead th.shift-h em { font-style: normal; }
thead th.shift-h .short { display: none; }
thead th.shift-h small { display: block; margin-top: 5px; font: 600 12px/1 var(--font); letter-spacing: 0; text-transform: none; color: var(--paper-ink-2); }
thead th.now { background: color-mix(in srgb, var(--c) 28%, #fff); }
thead th.now small { color: var(--c); font-weight: 800; }
tbody tr { border-top: 1px solid var(--paper-line); }
tbody tr:first-child { border-top: 0; }
tbody tr:nth-child(even) td { background: color-mix(in srgb, var(--paper-2) 55%, var(--paper)); }
tbody td { padding: 0; vertical-align: middle; }
.act { width: 100%; text-align: left; border: 0; background: none; padding: 7px 14px; display: flex; flex-direction: column; gap: 1px; color: var(--paper-ink); }
.act b { font: 700 17px/1.15 var(--cond); letter-spacing: .01em; }
.act small { font-size: 12px; color: var(--paper-ink-2); font-weight: 700; }
tbody tr.pole td:first-child { background: var(--pole); }
tbody tr:hover td { background: #e2e8fb; }
tbody tr.pole:hover td:first-child { background: #ffe97f; }
/* Chaque quart garde sa couleur de fond : vert le matin, orange l'après-midi, violet la nuit. */
td.who { text-align: center; background: color-mix(in srgb, var(--c) 10%, #fff) !important; }
tbody tr:nth-child(even) td.who { background: color-mix(in srgb, var(--c) 15%, #fff) !important; }
tbody tr:hover td.who { background: color-mix(in srgb, var(--c) 22%, #fff) !important; }
td.who.now { background: color-mix(in srgb, var(--c) 20%, #fff) !important; }
tbody tr:nth-child(even) td.who.now { background: color-mix(in srgb, var(--c) 25%, #fff) !important; }
td.who + td.who { border-left: 1px solid #fff; }
td.who button { width: 100%; min-height: 46px; border: 0; background: none; color: var(--paper-ink); padding: 4px 6px; display: inline-flex; align-items: center; justify-content: center; gap: 6px; font: 700 18px/1.15 var(--cond); letter-spacing: .03em; }
td.who .none { color: #b6bdd8; font-weight: 600; }
td.who .note { width: 18px; height: 18px; color: var(--red); }
.scroll { overflow: auto; flex: 1; min-height: 0; }

/* Détail d'une activité */
.detail { display: grid; grid-template-columns: minmax(170px, 26%) 1fr; flex: 1; min-height: 0; }
.side { border-right: 1px solid var(--paper-line); overflow: auto; background: var(--paper-2); }
.side h3 { margin: 0; padding: 13px 14px 10px; font: 800 17px/1 var(--cond); text-transform: uppercase; letter-spacing: .05em; color: var(--paper-ink-2); }
.side button { display: block; width: 100%; text-align: left; border: 0; border-top: 1px solid var(--paper-line); background: none; padding: 9px 14px; font: 700 16px/1.15 var(--cond); color: var(--paper-ink); }
.side button.pole { background: var(--pole); }
.side button:hover { background: #dfe6fb; }
.side button[aria-current="true"] { background: var(--blue); color: #fff; }
.pane { padding: 18px 20px; overflow: auto; }
.pane-head { display: flex; align-items: center; gap: 12px; }
.pane-head h2 { flex: 1; margin: 0; font: 800 clamp(24px, 2vw, 32px)/1.05 var(--cond); letter-spacing: .01em; }
.back { display: inline-flex; align-items: center; gap: 6px; border: 0; background: var(--blue); color: #fff; border-radius: 12px; padding: 10px 16px; font: 700 17px/1 var(--cond); letter-spacing: .03em; text-transform: uppercase; }
.back svg { width: 18px; height: 18px; }
.shifts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 16px; }
.shift { border: 1px solid var(--paper-line); border-radius: 14px; padding: 10px 8px 12px; background: #fff; text-align: center; color: var(--paper-ink); transition: box-shadow .15s ease-out, border-color .15s ease-out; }
.shift small { display: flex; align-items: center; justify-content: center; gap: 6px; font: 800 14px/1 var(--cond); text-transform: uppercase; letter-spacing: .06em; color: var(--c); }
.shift small::before { content: ""; width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.shift b { display: block; margin-top: 6px; font: 800 22px/1.1 var(--cond); letter-spacing: .03em; }
.shift[aria-pressed="true"] { border-color: var(--c); box-shadow: 0 0 0 2px var(--c), 0 10px 24px -14px var(--c); }
.consigne { margin-top: 14px; background: #fff; border: 1px solid var(--paper-line); border-radius: 14px; padding: 16px 18px; white-space: pre-wrap; min-height: 160px; font-size: 18px; line-height: 1.5; max-width: 80ch; }
.consigne.empty { color: #8b93b6; font-style: italic; }

/* Panneaux Sécurité / Qualité */
.panels { display: flex; flex-direction: column; gap: 12px; min-height: 0; }
.panel { background: var(--paper); color: var(--paper-ink); border-radius: 16px; overflow: hidden; display: flex; flex-direction: column; flex: 1; min-height: 160px; box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .8); }
.panel h2 { display: flex; align-items: center; gap: 10px; margin: 0; padding: 11px 16px; color: #fff; font: 800 24px/1 var(--cond); letter-spacing: .05em; text-transform: uppercase; }
.panel h2 svg { width: 22px; height: 22px; }
.panel h2 small { margin-left: auto; font: 700 13px/1 var(--font); letter-spacing: 0; text-transform: none; opacity: .85; }
.panel.secu h2 { background: var(--red); }
.panel.qual h2 { background: var(--blue); }
.panel .msgs { overflow: auto; padding: 12px 16px; flex: 1; display: flex; flex-direction: column; gap: 12px; }
.zone-block { display: flex; flex-direction: column; gap: 6px; }
.zone { align-self: flex-start; font: 800 14px/1 var(--cond); letter-spacing: .06em; text-transform: uppercase; padding: 4px 8px; border-radius: 6px; background: var(--zc); color: #fff; }
.panel.secu .zone { --zc: #b1302a; }
.panel.qual .zone { --zc: #2a3ca8; }
.msg { margin: 0; font-size: 16px; line-height: 1.4; padding-left: 14px; position: relative; }
.msg::before { content: ""; position: absolute; left: 0; top: .55em; width: 6px; height: 6px; border-radius: 50%; background: var(--paper-ink-2); }
.msgs .nothing { color: #8b93b6; font-style: italic; margin: 0; }

.foot { display: flex; align-items: center; justify-content: flex-end; gap: 8px; color: var(--ink-2); font-size: 13px; }
.foot i { width: 7px; height: 7px; border-radius: 50%; background: #3ccf7e; }
.empty-app { background: var(--paper); color: var(--paper-ink); border-radius: 18px; padding: 32px; text-align: center; max-width: 640px; margin: 48px auto; box-shadow: 0 18px 40px -24px rgba(0, 0, 0, .8); }
.empty-app h2 { margin: 0 0 8px; font: 800 30px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.empty-app p { color: var(--paper-ink-2); font-size: 17px; }
.btn { display: inline-flex; align-items: center; justify-content: center; min-height: 50px; padding: 0 20px; border-radius: 12px; border: 0; background: var(--blue); color: #fff; font: 700 18px/1 var(--cond); letter-spacing: .03em; margin: 6px; text-decoration: none; transition: transform .12s ease-out, background-color .15s ease-out; }
.btn:hover { background: #2639a8; }
.btn:active { transform: scale(.97); }
.btn.ghost { background: #fff; color: var(--paper-ink); border: 1px solid var(--paper-line); }
.btn.ghost:hover { background: var(--paper-2); }

/* Feuille Réglages */
.sheet-back { position: fixed; inset: 0; background: rgba(5, 10, 30, .6); z-index: 20; display: flex; align-items: center; justify-content: center; padding: 16px; }
.sheet { background: var(--paper); color: var(--paper-ink); border-radius: 18px; width: 100%; max-width: 580px; max-height: 92vh; overflow: auto; padding: 22px; animation: rise .28s cubic-bezier(.16, 1, .3, 1); }
@keyframes rise { from { transform: translateY(16px); opacity: .4; } }
.sheet h2 { margin: 0 0 8px; font: 800 28px/1.1 var(--cond); text-transform: uppercase; letter-spacing: .02em; }
.sheet p { margin: 8px 0; color: var(--paper-ink-2); }
.sheet .row { display: flex; flex-wrap: wrap; gap: 4px; margin: 10px -6px; }
.file-state { background: #fff; border: 1px solid var(--paper-line); border-radius: 12px; padding: 10px 12px; font-weight: 700; color: var(--paper-ink) !important; }
.toast { position: fixed; left: 50%; bottom: 22px; transform: translateX(-50%); background: #fff; color: var(--paper-ink); padding: 12px 20px; border-radius: 999px; font-weight: 800; z-index: 30; box-shadow: 0 14px 30px -10px rgba(0, 0, 0, .55); max-width: calc(100% - 32px); text-align: center; }

/* Téléphone / petit écran : tout l'un sous l'autre. */
@media (max-width: 1100px) {
  .clock { display: none; }
}
@media (max-width: 900px) {
  .body { grid-template-columns: 1fr; }
  .head { flex-wrap: wrap; gap: 12px; }
  .titles { order: 2; flex-basis: 100%; }
  .titles h1 { white-space: normal; }
  .tools { margin-left: auto; }
  .week { order: 3; flex-basis: 100%; display: flex; align-items: baseline; justify-content: center; gap: 10px; padding: 8px; }
  .days { overflow-x: auto; padding-bottom: 2px; }
  .day { min-width: 76px; }
  thead th { font-size: 14px; }
  thead th.acts { width: 36%; }
  thead th.shift-h small { display: none; }
  thead th.shift-h .long { display: none; }
  thead th.shift-h .short { display: inline; }
  td.who button { font-size: 16px; }
  .detail { grid-template-columns: 1fr; }
  .side { display: none; }
  .panel { flex: none; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>

<body>
<div class="app" id="app"></div>
<input type="file" id="pick" accept=".xlsx,.xlsm,.xls" hidden>
<script>
'use strict';

// ---------- Données : seulement ce qu'il y a dans le fichier Excel lu maintenant ----------

const KEY = 'pilotage-atelier-v1';
let data = load(); // { infos, acts:[{name,rp,pole}], aff:{date:{act:{M,AM,N,cM,cAM,cN}}}, secu:[{du,au,zone,msg}], qual:[...], file, at }
function load() {
  try {
    return JSON.parse(localStorage.getItem(KEY)) || null;
  } catch (e) {
    return null;
  }
}
function save() {
  try {
    localStorage.setItem(KEY, JSON.stringify(data));
  } catch (e) {}
}

const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const monday = (d) => addDays(d, -((d.getDay() + 6) % 7));
const todayIso = () => iso(new Date());
const ddmm = (d) => `${pad(d.getDate())}/${pad(d.getMonth() + 1)}`;
function isoWeek(d) {
  const t = new Date(Date.UTC(d.getFullYear(), d.getMonth(), d.getDate()));
  const day = t.getUTCDay() || 7;
  t.setUTCDate(t.getUTCDate() + 4 - day);
  const y0 = new Date(Date.UTC(t.getUTCFullYear(), 0, 1));
  return { week: Math.ceil(((t - y0) / 864e5 + 1) / 7), year: t.getUTCFullYear() };
}
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const norm = (s) => String(s ?? '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().replace(/\s+/g, ' ').trim();

let ui = { day: todayIso(), act: null, shift: 'M' };
const SHIFTS = [
  ['M', 'qm', 'QM · Matin', 'Matin', 'var(--qm)'],
  ['AM', 'qam', 'QAM · Après-midi', 'Après-midi', 'var(--qam)'],
  ['N', 'qn', 'QN · Nuit', 'Nuit', 'var(--qn)'],
];
const SHIFT_COLOR = { M: 'var(--qm)', AM: 'var(--qam)', N: 'var(--qn)' };
// Le quart en cours (matin 5h30–13h30, après-midi 13h30–21h30, nuit 21h30–5h30).
function shiftNow(d = new Date()) {
  const m = d.getHours() * 60 + d.getMinutes();
  return m >= 330 && m < 810 ? 'M' : m >= 810 && m < 1290 ? 'AM' : 'N';
}
// Le jour « de travail » : la nuit après minuit compte encore pour la veille.
const workDayIso = (d = new Date()) => iso(d.getHours() * 60 + d.getMinutes() < 330 ? addDays(d, -1) : d);
const DAYS = ['Lundi', 'Mardi', 'Mercredi', 'Jeudi', 'Vendredi', 'Samedi', 'Dimanche'];
const icons = {
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  note: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h14v12l-4 4H5z"/><path d="M9 9h6M9 13h4"/></svg>',
  shield: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l8 3v6c0 4.5-3.4 8.2-8 9-4.6-.8-8-4.5-8-9V6z"/><path d="M12 8v5M12 16.5v.5"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 12.5l2.8 2.8L16.5 9.5"/></svg>',
  gear: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>',

function daysHtml(day) {

const dayAff = () => data.aff?.[ui.day] || {};

function actList() {

function boardHtml() {

// Messages du jour choisi (sans date = tous les jours), rangés par zone.
function msgsHtml(list) {
  const on = (list || []).filter((m) => (!m.du || m.du <= ui.day) && (!m.au || m.au >= ui.day) && (m.du || m.au || true));

  return zones.map((z) => `<div class="zone-block">${z ? `<span class="zone">${esc(z)}</span>` : ''}${on.filter((m) => (m.zone || '') === z).map((m) => `<p class="msg">${esc(m.msg)}</p>`).join('')}</div>`).join('');
}
function panelsHtml() {
  return `<aside class="panels"><section class="panel secu"><h2>${icons.shield}Sécurité</h2><div class="msgs">${msgsHtml(data.secu)}</div></section>
    <section class="panel qual"><h2>${icons.check}Qualité</h2><div class="msgs">${msgsHtml(data.qual)}</div></section></aside>`;
}

document.addEventListener('click', (e) => {
  touched();
  const back = e.target.closest('.sheet-back');
  if (back && (e.target === back || e.target.closest('[data-close]'))) return closeSheet();
  const day = e.target.closest('[data-day]');
  if (day) {
    ui.day = day.dataset.day;
    return render();
  }
  const wk = e.target.closest('[data-week]');
  if (wk) {
    ui.day = iso(addDays(parseIso(ui.day), 7 * Number(wk.dataset.week)));
    return render();
  }
  const only = e.target.closest('[data-shift-only]');
  if (only) {
    ui.shift = only.dataset.shiftOnly;
    return render();
  }
  const act = e.target.closest('[data-act]');
  if (act) {
    ui.act = act.dataset.act;
    if (act.dataset.shift) ui.shift = act.dataset.shift;
    render();
    return window.scrollTo(0, 0);
  }
  const a = e.target.closest('[data-action]')?.dataset.action;
  if (a === 'board') {
    ui.act = null;
    render();
  } else if (a === 'settings') openSettings();
  else if (a === 'link') linkFile();
  else if (a === 'pick') document.getElementById('pick').click();
  else if (a === 'demo') loadDemo();
  else if (a === 'reread') refresh(true);
  else if (a === 'unlink') unlink();
  else if (a === 'reload') reloadPage();
  else if (a === 'full') {
    if (document.fullscreenElement) document.exitFullscreen?.();
    else document.documentElement.requestFullscreen?.().catch(() => toast('Plein écran impossible ici : touche F11.'));
  }
});

// Écran au mur : retour tout seul sur aujourd'hui après 3 minutes sans toucher, et au changement de jour.
let idleTimer;
let lastToday = todayIso();
let lastShift = '';
function touched() {
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (document.querySelector('.sheet-back')) return touched();
    ui = { day: workDayIso(), act: null, shift: shiftNow() };
    render();
  }, 180000);
}
setInterval(() => {
  // Changement de jour de travail (5h30) ou de quart : l'écran suit tout seul.
  if (workDayIso() !== lastToday || shiftNow() !== lastShift) {
    if (ui.day === lastToday) ui.day = workDayIso();
    lastToday = workDayIso();
    lastShift = shiftNow();

}, 60000);

function reloadPage() {

  const u = new URL(location.href);
  u.searchParams.set('r', Date.now());
  location.replace(u.toString());
}

// ---------- Lire le fichier Excel ----------

let xlsxWait;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxWait)
    xlsxWait = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => {
        xlsxWait = null;
        reject(new Error('xlsx'));
      };
      document.head.appendChild(s);
    });
  return xlsxWait;
}

const cellText = (v) => (v instanceof Date ? '' : String(v ?? '').replace(/\r/g, '').trim());
function toIso(v) {
  if (v instanceof Date && !isNaN(v)) return iso(new Date(v.getTime() + 12 * 3600e3));
  if (typeof v === 'number' && v > 30000 && v < 80000) return iso(new Date(Math.round((v - 25569) * 864e5) + 12 * 3600e3));
  const m = String(v ?? '').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return '';
  const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  return `${y}-${pad(m[2])}-${pad(m[1])}`;
}
const rowsOf = (ws) => XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: false });
const sheetLike = (wb, re) => wb.SheetNames.find((n) => re.test(norm(n)));
// La ligne de titres : la première qui contient les mots attendus.
function headerOf(rows, must) {
  for (let i = 0; i < Math.min(rows.length, 15); i++) {
    const h = (rows[i] || []).map((v) => norm(cellText(v)));
    if (must.every((re) => h.some((x) => re.test(x)))) return { i, h };
  }
  return null;
}
const colOf = (h, re, not) => h.findIndex((x) => re.test(x) && !(not && not.test(x)));

function readWorkbook(wb, fileName) {
  const out = { infos: {}, acts: [], aff: {}, secu: [], qual: [], file: fileName, at: Date.now() };
  // Infos
  const si = sheetLike(wb, /^info/);
  if (si)
    for (const r of rowsOf(wb.Sheets[si])) {
      const k = norm(cellText(r?.[0]));
      if (k === 'atelier') out.infos.atelier = cellText(r[1]);
      if (k === 'titre') out.infos.titre = cellText(r[1]);
    }
  // Activités
  const sa = sheetLike(wb, /^activit/);
  if (sa) {
    const rows = rowsOf(wb.Sheets[sa]);
    const hd = headerOf(rows, [/activit/]);
    if (hd) {
      const cA = colOf(hd.h, /activit/), cR = colOf(hd.h, /responsable|\brp\b/), cP = colOf(hd.h, /batiment|pole|surlign/);
      for (const r of rows.slice(hd.i + 1)) {
        const name = cellText(r?.[cA]);
        if (!name) continue;
        out.acts.push({ name, rp: cR >= 0 ? cellText(r[cR]) : '', pole: cP >= 0 && /^(oui|x|yes|1|o)$/i.test(cellText(r[cP])) });
      }
    }
  }
  // Affectations
  const sf = sheetLike(wb, /affect/) || wb.SheetNames.find((n) => headerOf(rowsOf(wb.Sheets[n]), [/date/, /activit/, /matin|qm/]));
  let found = false;
  if (sf) {
    const rows = rowsOf(wb.Sheets[sf]);
    const hd = headerOf(rows, [/date/, /activit/]);
    if (hd) {
      found = true;
      const h = hd.h;
      const c = {
        date: colOf(h, /date/),
        act: colOf(h, /activit/),
        M: colOf(h, /matin|\bqm\b/, /consigne/),
        AM: colOf(h, /apres|\bqam\b/, /consigne/),
        N: colOf(h, /nuit|\bqn\b/, /consigne/),
        cM: colOf(h, /consigne.*(matin|qm)/),
        cAM: colOf(h, /consigne.*(apres|qam)/),
        cN: colOf(h, /consigne.*(nuit|qn)/),
      };
      let lastDate = '';
      for (const r of rows.slice(hd.i + 1)) {
        if (!r) continue;
        const d = toIso(r[c.date]) || lastDate; // date écrite une seule fois pour plusieurs lignes
        const name = cellText(r[c.act]);
        if (!d || !name) continue;
        lastDate = d;
        const f = {};
        for (const k of ['M', 'AM', 'N', 'cM', 'cAM', 'cN']) if (c[k] >= 0 && cellText(r[c[k]])) f[k] = cellText(r[c[k]]);
        (out.aff[d] = out.aff[d] || {})[name] = f;
      }
    }
  }
  // Sécurité et Qualité
  for (const [key, re] of [['secu', /^secu/], ['qual', /^qualit/]]) {
    const sn = sheetLike(wb, re);
    if (!sn) continue;
    const rows = rowsOf(wb.Sheets[sn]);
    const hd = headerOf(rows, [/message|consigne|texte|info/]);
    if (!hd) continue;
    const cDu = colOf(hd.h, /^du$|debut|^date/), cAu = colOf(hd.h, /^au$|fin/), cZ = colOf(hd.h, /zone|secteur|batiment/), cM = colOf(hd.h, /message|consigne|texte|info/);
    for (const r of rows.slice(hd.i + 1)) {
      const msg = cellText(r?.[cM]);
      if (!msg) continue;
      out[key].push({ du: cDu >= 0 ? toIso(r[cDu]) : '', au: cAu >= 0 ? toIso(r[cAu]) : '', zone: cZ >= 0 ? cellText(r[cZ]) : '', msg });
    }
  }
  return found || out.acts.length || out.secu.length || out.qual.length ? out : null;
}

async function importFile(file, verbose) {
  try {
    await loadXlsx();
  } catch (e) {
    return toast('Il faut internet la première fois pour lire le fichier Excel.');
  }
  let wb;
  try {
    wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  } catch (e) {
    return toast('Ce fichier n’est pas un fichier Excel lisible.');
  }
  const out = readWorkbook(wb, file.name);
  if (!out) return toast('Je ne trouve pas l’onglet « Affectations » (colonnes Date, Activité, Matin…) dans ce fichier.');
  // Seulement ce fichier : on remplace tout.
  data = out;
  data.modified = file.lastModified;
  save();
  if (ui.act && !actList().some((a) => norm(a.name) === norm(ui.act))) ui.act = null;
  closeSheet();
  render();
  if (verbose) {
    const days = Object.keys(data.aff).length;
    toast(`Fichier lu : ${data.acts.length || actList().length} activités, ${days} jour${days > 1 ? 's' : ''}.`);
  }
}

// Raccorder le fichier (Chrome / Edge sur ordinateur) : relu tout seul quand il change.
const canLink = 'showOpenFilePicker' in window;
let handle = null;
function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('pilotage-fichier', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('h', mode);
    const req = fn(tx.objectStore('h'));
    tx.oncomplete = () => resolve(req?.result);
    tx.onerror = () => reject(tx.error);
  });
}
async function linkFile() {
  if (!canLink) return document.getElementById('pick').click();
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'], 'application/vnd.ms-excel': ['.xls'] } }] });
    handle = h;
    await idbDo('readwrite', (st) => st.put(h, 'file')).catch(() => {});
    await importFile(await h.getFile(), true);
  } catch (e) {
    if (e.name !== 'AbortError') toast('Impossible d’ouvrir ce fichier.');
  }
}
let needTap = false;
async function refresh(fromTap) {
  try {
    if (!handle) handle = await idbDo('readonly', (st) => st.get('file')).catch(() => null);
    if (!handle) return fromTap && toast('Aucun fichier raccordé.');
    let perm = await handle.queryPermission({ mode: 'read' });
    if (perm !== 'granted' && fromTap) perm = await handle.requestPermission({ mode: 'read' });
    if (perm !== 'granted') {
      if (!needTap) {
        needTap = true;
        showTapBanner();
      }
      return;
    }
    needTap = false;
    document.querySelector('.tap-banner')?.remove();
    const f = await handle.getFile();
    if (fromTap || !data || f.lastModified !== data.modified || f.name !== data.file) await importFile(f, fromTap);
  } catch (e) {
    if (fromTap) toast('Impossible de relire le fichier : raccorde-le à nouveau dans les réglages.');
  }
}
// Après un redémarrage, le navigateur demande une fois l'autorisation de relire le fichier.
function showTapBanner() {
  if (document.querySelector('.tap-banner')) return;
  const b = document.createElement('button');
  b.className = 'btn tap-banner';
  b.style.cssText = 'position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:25';
  b.textContent = 'Touche ici pour relire le fichier Excel';
  b.addEventListener('click', () => refresh(true));
  document.body.appendChild(b);
}
async function unlink() {
  handle = null;
  await idbDo('readwrite', (st) => st.delete('file')).catch(() => {});
  data = null;
  try {
    localStorage.removeItem(KEY);
  } catch (e) {}
  closeSheet();
  render();
  toast('Écran vidé.');
}
document.getElementById('pick').addEventListener('change', (e) => {
  const f = e.target.files?.[0];
  if (f) importFile(f, true);
  e.target.value = '';
});
async function loadDemo() {
  toast('Je charge l’exemple…');
  try {
    const r = await fetch('excel/pilotage-atelier.xlsx', { cache: 'no-store' });
    await importFile(new File([await r.blob()], 'Exemple (noms inventés)'), true);
  } catch (e) {
    toast('Impossible de charger l’exemple : vérifie ta connexion internet.');
  }
}

document.addEventListener('visibilitychange', () => document.visibilityState === 'visible' && (refresh(false), render()));
setInterval(() => document.visibilityState === 'visible' && refresh(false), 30000);

ui.day = workDayIso();
ui.shift = shiftNow();
render();
touched();
refresh(false);
</script>
