<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Danaïs">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#060A16">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>La bibliothèque de Danaïs</title>
<style>
/* Style « console de jeu » : fond nuit profond, couvertures en grand, rangées qui défilent,
   bleu vif pour les actions, coins arrondis, barre du bas translucide. */
:root {
  --bg: #060A16;
  --surface: #0E1427;
  --surface-2: #172039;
  --surface-3: #212C4A;
  --text: #FFFFFF;
  --text-2: #A9B3C9;
  --text-3: #7C87A1;
  --line: rgba(255, 255, 255, .09);
  --blue: #1F6FEB;
  --blue-text: #6EA8FF;
  --gold: #E8B84A;
  --danger: #FF6B81;
  --radius: 16px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font: 17px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  -webkit-font-smoothing: antialiased;
}
::selection { background: var(--blue); color: #fff; }
button, input, textarea, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--blue-text); outline-offset: 2px; border-radius: 8px; }

#app { min-height: 100vh; padding-top: env(safe-area-inset-top); padding-bottom: calc(96px + env(safe-area-inset-bottom)); }
.wrap { padding-left: max(18px, env(safe-area-inset-left)); padding-right: max(18px, env(safe-area-inset-right)); }

/* En-tête de profil (avatar, niveau, trophées). */
.profile { display: flex; align-items: center; gap: 14px; padding-top: 18px; }
.avatar { width: 58px; height: 58px; border-radius: 50%; background: var(--blue); display: flex; align-items: center; justify-content: center; font-size: 26px; font-weight: 800; flex: 0 0 auto; box-shadow: 0 0 0 3px var(--bg), 0 0 0 5px var(--blue); }
.profile h1 { margin: 0; font-size: 26px; line-height: 1.1; font-weight: 800; letter-spacing: -.01em; }
.profile .level { color: var(--text-2); font-size: 15px; margin-top: 2px; }
.profile .level b { color: var(--blue-text); }
.level-bar { height: 6px; border-radius: 3px; background: var(--surface-3); margin-top: 8px; overflow: hidden; }
.level-bar i { display: block; height: 100%; background: var(--blue-text); border-radius: 3px; }
.trophies { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 16px -18px 0; padding: 0 18px 2px; }
.trophies::-webkit-scrollbar, .rail::-webkit-scrollbar { display: none; }
.trophy-chip { flex: 0 0 auto; display: flex; align-items: center; gap: 6px; background: var(--surface); border: 1px solid var(--line); padding: 7px 12px 7px 9px; border-radius: 999px; font-size: 14px; font-weight: 700; font-variant-numeric: tabular-nums; }
.trophy-chip svg { width: 18px; height: 18px; }
.trophy-chip span { color: var(--text-2); font-weight: 600; }

h2.page { font-size: 30px; margin: 22px 0 6px; font-weight: 800; letter-spacing: -.015em; }
.section-head { display: flex; align-items: baseline; justify-content: space-between; margin: 30px 0 12px; }
.section-head h3 { margin: 0; font-size: 21px; font-weight: 800; letter-spacing: -.01em; }
.section-head h3 small { color: var(--text-3); font-size: 15px; font-weight: 600; margin-left: 6px; }
.see-all { background: none; border: 0; color: var(--blue-text); font-weight: 700; font-size: 15px; min-height: 44px; padding: 0 2px; }
.hint { color: var(--text-2); font-size: 15px; margin: 6px 0 0; }
.empty { color: var(--text-2); font-size: 15px; background: var(--surface); border: 1px dashed var(--surface-3); border-radius: var(--radius); padding: 18px; }

/* Couvertures. */
.cover { width: 62px; height: 93px; flex: 0 0 auto; position: relative; background: var(--surface-2); border: 0; padding: 0; overflow: hidden; border-radius: 8px; touch-action: manipulation; box-shadow: 0 6px 18px rgba(0, 0, 0, .45); }
.cover img { width: 100%; height: 100%; object-fit: cover; display: block; }
.cover .fake { position: absolute; inset: 0; display: flex; flex-direction: column; background: var(--surface-2); }
.cover .fake span { height: 18%; flex: 0 0 auto; }
.cover .fake b { flex: 1; color: var(--text); font-size: 10px; line-height: 1.2; padding: 6px; display: flex; align-items: center; justify-content: center; text-align: center; overflow: hidden; font-weight: 700; }

/* Carte « en cours » : la couverture floutée en fond, comme une affiche de jeu. */
.rail { display: flex; gap: 12px; overflow-x: auto; scroll-snap-type: x mandatory; scrollbar-width: none; margin: 0 -18px; padding: 0 18px 6px; }
.hero { position: relative; flex: 0 0 100%; scroll-snap-align: center; border-radius: 22px; overflow: hidden; background: var(--surface); min-height: 214px; border: 0; padding: 0; text-align: left; }
.rail .hero { flex-basis: calc(100% - 26px); }
.rail .hero:only-child { flex-basis: 100%; }
.hero-bg { position: absolute; inset: -40px; background-size: cover; background-position: center; filter: blur(34px) saturate(1.5); opacity: .85; transform: scale(1.1); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(180deg, rgba(6, 10, 22, .15) 0%, rgba(6, 10, 22, .82) 70%); }
.hero-body { position: relative; z-index: 1; display: flex; gap: 16px; padding: 18px; align-items: flex-end; min-height: 214px; }
.hero .cover { width: 106px; height: 159px; border-radius: 10px; box-shadow: 0 14px 30px rgba(0, 0, 0, .55); }
.hero-info { flex: 1; min-width: 0; }
.hero-kind { font-size: 13px; font-weight: 700; color: var(--text-2); }
.hero-title { font-size: 21px; font-weight: 800; line-height: 1.15; margin-top: 4px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }
.hero-author { color: var(--text-2); font-size: 15px; margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.progress { height: 6px; border-radius: 3px; background: rgba(255, 255, 255, .18); margin-top: 12px; overflow: hidden; }
.progress i { display: block; height: 100%; background: var(--blue-text); border-radius: 3px; }
.progress-label { display: block; font-size: 13px; color: var(--text-2); margin-top: 6px; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Rangées de vignettes. */
.tiles { display: flex; align-items: flex-start; gap: 12px; overflow-x: auto; scrollbar-width: none; margin: 0 -18px; padding: 0 18px 8px; }
.tiles::-webkit-scrollbar { display: none; }
.tile { flex: 0 0 auto; width: 112px; background: none; border: 0; padding: 0; text-align: left; display: flex; flex-direction: column; }
.tile .cover { display: block; width: 112px; height: 168px; border-radius: 12px; }
.tile .t { display: block; font-size: 14px; font-weight: 700; margin-top: 8px; line-height: 1.25; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.tile .a { display: block; font-size: 13px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px; }
.rank-badge { position: absolute; top: 6px; left: 6px; z-index: 1; min-width: 26px; height: 26px; border-radius: 13px; background: rgba(6, 10, 22, .8); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); color: #fff; font-size: 14px; font-weight: 800; display: flex; align-items: center; justify-content: center; padding: 0 7px; font-variant-numeric: tabular-nums; }

/* Classement par niveaux. */
.tier { margin-top: 14px; background: var(--surface); border-radius: 20px; padding: 14px; border: 1px solid var(--line); }
.tier-name { display: flex; align-items: center; gap: 10px; font-weight: 800; font-size: 17px; }
.tier-name .badge { width: 34px; height: 34px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex: 0 0 auto; }
.tier-name .badge svg { width: 20px; height: 20px; }
.tier-name .count { margin-left: auto; color: var(--text-3); font-weight: 700; font-variant-numeric: tabular-nums; font-size: 15px; }
.tier-books { min-height: 96px; display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
.tier-books:empty::after { content: "Glisse un livre ici"; color: var(--text-3); font-size: 15px; align-self: center; margin: 0 auto; }
.tier-books .cover { width: 72px; height: 108px; }
.sortable-ghost { opacity: .35; }
.sortable-chosen { transform: scale(1.06); }

/* Listes (vue « Tout voir »). */
.back { display: inline-flex; align-items: center; gap: 4px; background: none; border: 0; color: var(--blue-text); font-weight: 700; min-height: 44px; padding: 0; margin-top: 10px; }
.list { display: flex; flex-direction: column; gap: 10px; min-height: 56px; margin-top: 12px; }
.list:empty::after { content: attr(data-empty); color: var(--text-2); font-size: 15px; padding: 18px; border: 1px dashed var(--surface-3); border-radius: var(--radius); }
.row { display: flex; align-items: center; gap: 12px; background: var(--surface); padding: 10px; border-radius: var(--radius); border: 1px solid var(--line); }
.row .cover { width: 50px; height: 75px; box-shadow: none; }
.row .info { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 4px 0; }
.row .title { font-weight: 700; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.row .author { color: var(--text-2); font-size: 15px; display: block; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row .rank { width: 28px; text-align: center; font-weight: 800; font-variant-numeric: tabular-nums; color: var(--text-3); }
.handle { width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; background: none; border: 0; color: var(--text-3); touch-action: none; border-radius: 12px; }

/* Recherche. */
.search { display: flex; gap: 10px; margin-top: 14px; }
.search-field { flex: 1; min-width: 0; position: relative; }
.search-field svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--text-3); pointer-events: none; }
.search input { width: 100%; height: 52px; padding: 0 14px 0 44px; border: 1px solid var(--line); background: var(--surface-2); border-radius: 14px; font-size: 17px; }
.search input::placeholder { color: var(--text-3); }
.results { display: flex; flex-direction: column; gap: 10px; margin-top: 16px; }
.status { color: var(--text-2); padding: 14px 0; }
.field-label { display: block; font-weight: 700; margin: 22px 0 10px; font-size: 16px; }

/* Boutons. */
.btn { min-height: 50px; padding: 0 22px; border: 0; background: var(--blue); color: #fff; font-weight: 700; border-radius: 999px; }
.btn.ghost { background: var(--surface-2); color: var(--text); }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid rgba(255, 107, 129, .5); }
.btn.full { width: 100%; }
.btn:disabled { opacity: .5; }

/* Barre d'onglets translucide. */
.tabs { position: fixed; left: 12px; right: 12px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; background: rgba(23, 32, 57, .72); backdrop-filter: blur(22px) saturate(170%); -webkit-backdrop-filter: blur(22px) saturate(170%); border: 1px solid rgba(255, 255, 255, .1); border-radius: 26px; padding: 6px; z-index: 10; box-shadow: 0 12px 30px rgba(0, 0, 0, .45); }
.tabs button { flex: 1; min-height: 58px; background: none; border: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 700; color: var(--text-3); border-radius: 20px; }
.tabs button[aria-selected="true"] { color: #fff; background: rgba(255, 255, 255, .1); }
.tabs button[aria-selected="true"] svg { color: var(--blue-text); }
.tabs svg { width: 24px; height: 24px; }

/* Fiche d'un livre (feuille qui monte du bas). */
.sheet-back { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 20; display: flex; align-items: flex-end; }
.sheet { background: var(--surface); width: 100%; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding-bottom: calc(26px + env(safe-area-inset-bottom)); position: relative; }
.sheet .band { width: 40px; height: 5px; border-radius: 3px; background: var(--surface-3); margin: 10px auto 0; }
.sheet-head { display: flex; gap: 16px; padding-top: 16px; align-items: flex-start; }
.sheet-head .cover { width: 92px; height: 138px; border-radius: 10px; }
.sheet-head h3 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 800; }
.sheet-head p { margin: 4px 0 0; color: var(--text-2); font-size: 15px; }
.close { margin-left: auto; width: 40px; height: 40px; border: 0; background: var(--surface-2); color: var(--text); flex: 0 0 auto; border-radius: 50%; display: flex; align-items: center; justify-content: center; }
.close svg { width: 16px; height: 16px; }
.choices { display: flex; flex-wrap: wrap; gap: 8px; }
.choice { min-height: 44px; padding: 0 16px; border: 1.5px solid var(--surface-3); background: var(--surface-2); font-weight: 700; border-radius: 999px; }
.choice:disabled { opacity: .4; }
.choice[aria-pressed="true"] { background: var(--blue); border-color: var(--blue); color: #fff; }
.choice.tier-choice[aria-pressed="true"] { color: var(--bg); }
.stars { display: flex; gap: 4px; }
.stars button { width: 48px; height: 48px; background: none; border: 0; padding: 0; }
.stars svg { width: 34px; height: 34px; }
textarea, .num { width: 100%; border: 1px solid var(--line); background: var(--surface-2); padding: 12px 14px; border-radius: 14px; font-size: 17px; }
textarea { min-height: 100px; resize: vertical; }
.num { width: 110px; height: 48px; font-variant-numeric: tabular-nums; }
.pages-row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 26px; }

/* Statistiques. */
.stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 14px; }
.stat { background: var(--surface); padding: 16px; border-radius: 18px; border: 1px solid var(--line); }
.stat strong { display: block; font-size: 34px; line-height: 1.05; font-weight: 800; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.stat span { color: var(--text-2); font-size: 14px; font-weight: 600; }
.stat.big { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; }
.stat.big svg { width: 44px; height: 44px; flex: 0 0 auto; }
.bars { display: flex; flex-direction: column; gap: 10px; margin-top: 4px; background: var(--surface); border-radius: 18px; padding: 16px; border: 1px solid var(--line); }
.bar { display: grid; grid-template-columns: 112px 1fr 30px; align-items: center; gap: 10px; font-size: 15px; }
.bar .track { height: 10px; background: var(--surface-3); border-radius: 5px; overflow: hidden; }
.bar .fill { height: 100%; border-radius: 5px; }
.bar .n { text-align: right; font-variant-numeric: tabular-nums; font-weight: 800; }
.bar .lbl { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }

/* Réglages des niveaux. */
.tier-edit { display: flex; align-items: center; gap: 8px; background: var(--surface-2); padding: 8px 8px 8px 12px; border-radius: 14px; }
.tier-edit input { flex: 1; min-width: 0; height: 44px; border: 1px solid var(--line); background: var(--surface); padding: 0 12px; border-radius: 10px; }
.swatches { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.swatch { width: 44px; height: 44px; border: 3px solid transparent; padding: 0; border-radius: 50%; }
.swatch[aria-pressed="true"] { border-color: #fff; }
.cover-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); gap: 12px; margin-top: 12px; }
.cover.big { width: 100%; height: auto; aspect-ratio: 2 / 3; }
.photo-choice { display: inline-flex; align-items: center; cursor: pointer; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(100px + env(safe-area-inset-bottom)); background: #fff; color: var(--bg); padding: 12px 18px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; border-radius: 999px; box-shadow: 0 10px 30px rgba(0, 0, 0, .5); }

/* Retour visuel immédiat quand on touche. */
.cover, .choice, .btn, .tabs button, .row .info, .handle, .close, .swatch, .stars button, .tile, .hero, .see-all, .back { transition: opacity .12s ease-out, transform .14s ease-out, background-color .14s ease-out; }
.cover:active, .row .info:active, .handle:active, .close:active, .see-all:active, .back:active { opacity: .6; }
.choice:active, .btn:active, .swatch:active, .stars button:active, .tile:active, .hero:active, .tabs button:active { transform: scale(.96); }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="accueil" aria-selected="true">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>
    Accueil
  </button>
  <button role="tab" data-tab="classement" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M7 3h10v5a5 5 0 0 1-10 0z"/><path d="M7 5H4v2a3 3 0 0 0 3 3M17 5h3v2a3 3 0 0 1-3 3M12 13v4M8 21h8M9 17h6v4H9z"/></svg>
    Classement
  </button>
  <button role="tab" data-tab="ajouter" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>
    Ajouter
  </button>
  <button role="tab" data-tab="stats" aria-selected="false">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M5 20V12M12 20V5M19 20v-6"/></svg>
    Stats
  </button>
</nav>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Sortable/1.15.2/Sortable.min.js"></script>
<script>
'use strict';

// ---------- Données (gardées dans ce téléphone) ----------

const STORE_KEY = 'bibliotheque-danais-v1';
const COLORS = ['#E8B84A', '#F06A8A', '#3CC48A', '#4C8DFF', '#A585FF', '#8E98AE', '#D08A57', '#DCE3F0'];
const LISTS = {
  reading: { name: 'En cours de lecture', color: '#3CC48A', empty: 'Aucun livre en cours. Choisis-en un dans ta pile !' },
  pile: { name: 'Ma pile', color: '#4C8DFF', empty: 'Ta pile est vide. Ajoute les livres que tu as et que tu vas lire.' },
  wish: { name: 'Mes envies', color: '#A585FF', empty: 'Aucune envie pour l’instant. Ajoute les livres que tu aimerais lire.' },
};

function defaultState() {
  const tiers = [
    { id: 't1', name: 'Coup de cœur', color: '#E8B84A' },
    { id: 't2', name: 'Adoré', color: '#F06A8A' },
    { id: 't3', name: 'Bien', color: '#3CC48A' },
    { id: 't4', name: 'Moyen', color: '#4C8DFF' },
    { id: 't5', name: 'Pas aimé', color: '#8E98AE' },
  ];
  const order = { reading: [], pile: [], wish: [], unranked: [] };
  tiers.forEach((t) => (order['tier:' + t.id] = []));
  return { version: 1, tiers, books: {}, order };
}

// Couleurs des anciennes versions de l'app, remplacées par celles du nouveau style.
const OLD_COLORS = {
  '#EE6A24': '#E8B84A', '#E8B84A': '#E8B84A',
  '#D2335B': '#F06A8A',
  '#1F9A5B': '#3CC48A', '#16804A': '#3CC48A',
  '#2D5DA8': '#4C8DFF',
  '#7A4C93': '#A585FF',
  '#8A8A86': '#8E98AE', '#6F6E69': '#8E98AE',
  '#C99A1A': '#D08A57', '#8F6A0C': '#D08A57',
  '#1A1A1A': '#DCE3F0',
};

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = JSON.parse(raw);
      data.tiers.forEach((t) => (t.color = OLD_COLORS[t.color] || t.color));
      return data;
    }
  } catch (e) {}
  return defaultState();
}

let state = load();
let ui = { tab: 'accueil', sub: null, query: '', results: null, searching: false, error: '' };

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Impossible d’enregistrer sur ce téléphone.');
  }
}

// Où se trouve un livre : 'reading', 'pile', 'wish', 'unranked' ou 'tier:<id>'.
function placeOf(id) {
  return Object.keys(state.order).find((k) => state.order[k].includes(id)) || null;
}

function moveBook(id, to, index) {
  const from = placeOf(id);
  if (from) state.order[from] = state.order[from].filter((x) => x !== id);
  if (!state.order[to]) state.order[to] = [];
  const list = state.order[to];
  list.splice(index == null ? list.length : index, 0, id);
  const book = state.books[id];
  const wasRead = from && (from.startsWith('tier:') || from === 'unranked');
  const isRead = to.startsWith('tier:') || to === 'unranked';
  if (isRead && !wasRead) book.finishedAt = Date.now();
  if (!isRead) book.finishedAt = null;
  if (to === 'reading' && !book.startedAt) book.startedAt = Date.now();
  save();
}

function addBook(data, to) {
  const existing = Object.values(state.books).find((b) => data.googleId && b.googleId === data.googleId);
  if (existing) {
    toast('Ce livre est déjà dans ta bibliothèque.');
    openSheet(existing.id);
    return;
  }
  const id = 'b' + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  state.books[id] = {
    id,
    title: data.title,
    authors: data.authors || '',
    cover: data.cover || '',
    pages: data.pages || 0,
    year: data.year || '',
    googleId: data.googleId || '',
    isbn: data.isbn || '',
    rating: 0,
    review: '',
    currentPage: 0,
    addedAt: Date.now(),
    startedAt: null,
    finishedAt: null,
  };
  moveBook(id, to);
  if (!state.books[id].cover) repairCover(id);
  if (!state.books[id].pages) fillPages(id);
  toast(`« ${data.title} » ajouté à ${placeName(to)}.`);
}

function removeBook(id) {
  const from = placeOf(id);
  if (from) state.order[from] = state.order[from].filter((x) => x !== id);
  delete state.books[id];
  save();
}

function placeName(key) {
  if (LISTS[key]) return LISTS[key].name.toLowerCase();
  if (key === 'unranked') return 'tes livres lus';
  const tier = state.tiers.find((t) => 'tier:' + t.id === key);
  return tier ? `« ${tier.name} »` : '';
}

// ---------- Petits outils ----------

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

function coverHtml(book, color) {
  const label = esc(book.title);
  if (book.cover) {
    return `<img src="${esc(book.cover)}" alt="" loading="lazy" onerror="coverFailed(this)" onload="if (this.naturalWidth < 20 && this.src.includes('amazon')) coverFailed(this)" data-title="${label}" data-color="${esc(color || '#E8B84A')}" data-cover-for="${esc(book.id || '')}">`;
  }
  return `<div class="fake" aria-hidden="true"><span style="background:${esc(color || '#E8B84A')}"></span><b>${label}</b><span style="background:${esc(color || '#E8B84A')}"></span></div>`;
}

// L'image ne charge pas : mini couverture à bandes en attendant, et on cherche une vraie photo.
function coverFailed(img) {
  const id = img.dataset.coverFor;
  img.replaceWith(fakeCover(img));
  if (id && state.books[id]) {
    // On garde la couverture enregistrée (le réseau peut juste être lent) et on en cherche une qui marche.
    if (!repairing.has(id)) repairing.set(id, { tried: new Set(), list: null });
    repairing.get(id).tried.add(state.books[id].cover);
    repairCover(id, true);
    return;
  }
  // Résultat de recherche : on lui cherche une autre couverture.
  const r = (ui.results || []).find((x) => esc(x.title) === esc(img.dataset.title) && x.cover);
  if (r && !r.retried) {
    r.retried = true;
    r.cover = '';
    fillMissingCovers(ui.results);
  }
}

// Couverture de remplacement : une mini couverture à bandes.
function fakeCover(img) {
  const div = document.createElement('div');
  div.className = 'fake';
  div.setAttribute('aria-hidden', 'true');
  const c = img.dataset.color;
  div.innerHTML = `<span style="background:${c}"></span><b>${img.dataset.title}</b><span style="background:${c}"></span>`;
  return div;
}

let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2000);
}

const starSvg = (on) =>
  `<svg viewBox="0 0 24 24"><path d="M12 2.8l2.8 5.8 6.3.9-4.6 4.4 1.1 6.3L12 17.2 6.4 20.2l1.1-6.3L2.9 9.5l6.3-.9z" fill="${on ? '#E8B84A' : 'none'}" stroke="${on ? '#E8B84A' : 'currentColor'}" stroke-width="1.8" stroke-linejoin="round"/></svg>`;

const handleSvg = `<svg width="22" height="22" viewBox="0 0 22 22" fill="currentColor" aria-hidden="true"><rect x="3" y="5" width="16" height="2.4"/><rect x="3" y="10" width="16" height="2.4"/><rect x="3" y="15" width="16" height="2.4"/></svg>`;

const app = document.getElementById('app');
let sortables = [];

// Texte foncé ou blanc selon la couleur de fond (pour rester lisible).
function onColor(hex) {
  const n = parseInt(hex.slice(1), 16);
  const lum = [(n >> 16) & 255, (n >> 8) & 255, n & 255]
    .map((v) => v / 255)
    .map((v) => (v <= 0.03928 ? v / 12.92 : ((v + 0.055) / 1.055) ** 2.4));
  return 0.2126 * lum[0] + 0.7152 * lum[1] + 0.0722 * lum[2] > 0.25 ? '#060A16' : '#FFFFFF';
}

const trophySvg = (color) =>
  `<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3h10v2h3v3a4 4 0 0 1-4 4h-.3A5 5 0 0 1 13 14.9V18h3v3H8v-3h3v-3.1A5 5 0 0 1 8.3 12H8a4 4 0 0 1-4-4V5h3zm0 4H6v1a2 2 0 0 0 1.2 1.8A5 5 0 0 1 7 8.8zm10 0v1.8c0 .3 0 .7-.2 1A2 2 0 0 0 18 8V7z" fill="${color}"/></svg>`;

const chevron = `<svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M10 3L5 8l5 5"/></svg>`;

function readIds() {
  return [...state.tiers.flatMap((t) => state.order['tier:' + t.id] || []), ...(state.order.unranked || [])];
}

function render() {
  sortables.forEach((s) => s.destroy());

document.addEventListener('click', (e) => {
  const go = e.target.closest('[data-tab-go]');
  if (go) {
    ui.tab = go.dataset.tabGo;
    render();
    return window.scrollTo(0, 0);
  }
  const see = e.target.closest('[data-see]');
  if (see) {
    ui.sub = see.dataset.see;
    render();
    return window.scrollTo(0, 0);
  }
  if (e.target.closest('[data-back]')) {
    ui.sub = null;
    render();
    return window.scrollTo(0, 0);
  }
  const tab = e.target.closest('.tabs button');
  if (tab) {
    ui.sub = null;
    ui.tab = tab.dataset.tab;
    render();
    window.scrollTo(0, 0);
    if (ui.tab === 'ajouter' && !ui.results) setTimeout(() => document.getElementById('q')?.focus(), 50);
    return;
  }
  const book = e.target.closest('[data-book]');
  if (book && !e.target.closest('.sheet')) return openSheet(book.dataset.book);
  const result = e.target.closest('[data-result]');
  if (result) return openAddSheet(ui.results[Number(result.dataset.result)]);
  const action = e.target.closest('[data-action]');
  if (!action) return;
  const a = action.dataset.action;
  if (a === 'edit-tiers') openTierEditor();
  else if (a === 'manual') openManualSheet();
  else if (a === 'export') exportBackup();
  else if (a === 'import') document.getElementById('import-file').click();
});

// ---------- Recherche de livres ----------

async function search(q) {
  q = q.trim();
  ui.query = q;
  if (!q) return;
  ui.searching = true;
  ui.error = '';
  ui.results = null;
  render();
  const token = (ui.token = {});
  // Deux catalogues en même temps : Apple Books (très complet en français) et Open Library.
  const apple = searchApple(q).catch(() => null);
  const ol = searchOpenLibrary(q).catch(() => null);
  const first = await apple;
  if (token !== ui.token) return;
  if (first && first.length) {
    ui.results = first;
    ui.searching = false;
    render();
  }
  const more = await ol;
  if (token !== ui.token) return;
  if (!first && !more) {
    ui.results = null;
    ui.error = 'La recherche ne marche pas : vérifie ta connexion internet, puis réessaie.';
  } else {
    ui.results = mergeResults(first || [], more || []);
    ui.results.sort((a, b) => (b.cover ? 1 : 0) - (a.cover ? 1 : 0));
  }
  ui.searching = false;
  render();
  fillMissingCovers(ui.results);
}

// Résultats sans couverture : on en cherche une (les 8 premiers).
async function fillMissingCovers(results) {
  for (const r of (results || []).filter((x) => !x.cover).slice(0, 8)) {
    const [first] = await coverCandidates(r.title, r.authors, r.isbn);
    if (first && ui.results === results) {
      r.cover = first;
      render();
    }
  }
}

// « La Femme de ménage » et « la femme de menage » sont le même livre.
const norm = (t) =>
  String(t || '')
    .toLowerCase()
    .normalize('NFD')
    .replace(/[\u0300-\u036f]/g, '')
    .replace(/[^a-z0-9]+/g, ' ')
    .trim();

function mergeResults(a, b) {
  const seen = new Set(a.map((r) => norm(r.title) + '|' + norm(r.authors.split(',')[0])));
  return [...a, ...b.filter((r) => !seen.has(norm(r.title) + '|' + norm(r.authors.split(',')[0])))];
}

// Apple Books répond en « JSONP » : on charge la réponse comme un petit script.
let jsonpCount = 0;
function jsonp(url, timeout = 9000) {
  return new Promise((resolve, reject) => {
    const name = 'cbLivres' + ++jsonpCount;
    const script = document.createElement('script');
    const done = (fn, arg) => {
      clearTimeout(timer);
      delete window[name];
      script.remove();
      fn(arg);
    };
    const timer = setTimeout(() => done(reject, new Error('délai dépassé')), timeout);
    window[name] = (data) => done(resolve, data);
    script.onerror = () => done(reject, new Error('réseau'));
    script.src = url + (url.includes('?') ? '&' : '?') + 'callback=' + name;
    document.head.appendChild(script);
  });
}

async function searchApple(q, limit = 25) {
  const data = await jsonp(
    `https://itunes.apple.com/search?term=${encodeURIComponent(q)}&media=ebook&entity=ebook&country=fr&lang=fr_fr&limit=${limit}`,
  );
  return (data.results || []).map((r) => {
    const art = r.artworkUrl100 || '';
    return {
      googleId: 'ap:' + r.trackId,
      // « (Enhanced Edition) » et autres mentions de version numérique retirées.
      title: (r.trackName || '').replace(/\s*\((enhanced|french|édition|edition)[^)]*\)\s*$/i, ''),
      authors: r.artistName || '',
      pages: 0,
      year: (r.releaseDate || '').slice(0, 4),
      // Le numéro ISBN est souvent dans le nom de l'image : il sert à trouver le nombre de pages.
      isbn: (art.match(/97[89]\d{10}/) || [''])[0],
      // Couverture en bonne taille (l'adresse accepte la taille voulue).
      cover: art.replace('100x100bb', '400x600bb'),
    };
  });
}

async function searchOpenLibrary(q) {
  const data = await (await fetch(`https://openlibrary.org/search.json?q=${encodeURIComponent(q)}&limit=20&fields=${OL_FIELDS}`)).json();
  return (data.docs || []).map((d) => ({
    googleId: 'ol:' + d.key,
    title: d.title,
    authors: (d.author_name || []).join(', '),
    pages: d.number_of_pages_median || 0,
    year: d.first_publish_year ? String(d.first_publish_year) : '',
    isbn: d.isbn?.[0] || '',
    cover: d.cover_i ? olCover(d.cover_i) : isbnCover(d.isbn?.[0]),
  }));
}

const OL_FIELDS = 'key,title,author_name,number_of_pages_median,first_publish_year,cover_i,isbn';
const olCover = (coverId) => `https://covers.openlibrary.org/b/id/${coverId}-M.jpg`;
// « default=false » : pas d'image grise si la couverture n'existe pas (l'app cherche alors ailleurs).
// 9782070612758 -> 2070612759 (format utilisé par Amazon).
function toIsbn10(isbn) {
  const d = String(isbn).replace(/[^0-9X]/gi, '');
  if (d.length === 10) return d;
  if (d.length !== 13 || !d.startsWith('978')) return '';
  const core = d.slice(3, 12);
  const sum = [...core].reduce((n, c, i) => n + Number(c) * (10 - i), 0);
  const check = (11 - (sum % 11)) % 11;
  return core + (check === 10 ? 'X' : String(check));
}
const isbnCover = (isbn) => (isbn ? `https://covers.openlibrary.org/b/isbn/${encodeURIComponent(isbn)}-M.jpg?default=false` : '');

// ---------- Trouver la vraie couverture ----------

// Toutes les couvertures connues pour ce livre (plusieurs éditions), la plus probable en premier.
async function coverCandidates(title, authors, isbn) {
  const found = [];
  const add = (url) => url && !found.includes(url) && found.push(url);
  const author = (authors || '').split(',')[0].trim();
  // Apple Books : les couvertures des éditions dont le titre correspond.
  try {
    const t = norm(title);
    const apple = await searchApple(`${title} ${author}`.trim(), 15);
    apple
      .filter((r) => norm(r.title).includes(t) || t.includes(norm(r.title)))
      .forEach((r) => add(r.cover));
  } catch (e) {}
  if (isbn) {
    add(isbnCover(isbn));
    const isbn10 = toIsbn10(isbn);
    if (isbn10) add(`https://images-na.ssl-images-amazon.com/images/P/${isbn10}.01.LZZZZZZZ.jpg`);
  }
  try {
    const ol = await (
      await fetch(`https://openlibrary.org/search.json?title=${encodeURIComponent(title)}${author ? '&author=' + encodeURIComponent(author) : ''}&limit=30&fields=cover_i`)
    ).json();
    (ol.docs || []).forEach((d) => d.cover_i && add(olCover(d.cover_i)));
  } catch (e) {}
  return found;
}

// Cherche une couverture pour un livre qui n'en a pas (une seule fois par livre et par ouverture de l'app).
const repairing = new Map(); // livre -> couvertures déjà essayées
async function repairCover(id, replace = false) {
  const b = state.books[id];
  if (!b || (b.cover && !replace)) return;
  if (!repairing.has(id)) repairing.set(id, { tried: new Set(), list: null });
  const job = repairing.get(id);
  if (job.busy) return;
  job.busy = true;
  if (!job.list) job.list = await coverCandidates(b.title, b.authors, b.isbn);
  // On essaie chaque couverture possible et on garde la première qui s'affiche vraiment.
  for (const url of job.list) {
    if (job.tried.has(url)) continue;
    job.tried.add(url);
    if (await imageWorks(url)) {
      if (state.books[id]) {
        state.books[id].cover = url;
        save();
        render();
      }
      break;
    }
  }
  job.busy = false;
}

function imageWorks(url) {
  return new Promise((resolve) => {
    const img = new Image();
    const timer = setTimeout(() => resolve(false), 8000);
    img.onload = () => {
      clearTimeout(timer);
      resolve(img.naturalWidth >= 20 || !url.includes('amazon'));
    };
    img.onerror = () => {
      clearTimeout(timer);
      resolve(false);
    };
    img.src = url;
  });
}

async function fillPages(id) {
  const b = state.books[id];
  if (!b) return;
  const author = (b.authors || '').split(',')[0].trim();
  const url = b.isbn
    ? `https://openlibrary.org/search.json?isbn=${encodeURIComponent(b.isbn)}&fields=number_of_pages_median`
    : `https://openlibrary.org/search.json?title=${encodeURIComponent(b.title)}${author ? '&author=' + encodeURIComponent(author) : ''}&limit=1&fields=number_of_pages_median`;
  try {
    const data = await (await fetch(url)).json();
    const pages = data.docs?.[0]?.number_of_pages_median;
    if (pages && state.books[id] && !state.books[id].pages) {
      state.books[id].pages = pages;
      save();
      render();
    }
  } catch (e) {}
}

// Une photo prise avec le téléphone, réduite pour ne pas remplir la mémoire.
function photoToDataUrl(file) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, 420 / img.height);
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(img.width * scale);
      canvas.height = Math.round(img.height * scale);
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      URL.revokeObjectURL(img.src);
      resolve(canvas.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

// ---------- Feuilles (fiches) ----------

function showSheet(color, inner) {
  closeSheet();
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="band" style="background:${esc(color)}"></div><div class="wrap">${inner}</div></div>`;
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.closest('.close')) closeSheet();
  });
  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  return back;
}

function closeSheet() {
  document.querySelector('.sheet-back')?.remove();
  document.body.style.overflow = '';
}

const closeBtn = `<button class="close" aria-label="Fermer"><svg width="22" height="22" viewBox="0 0 22 22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 4l14 14M18 4L4 18"/></svg></button>`;

function sheetHead(b, color) {
  return `<div class="sheet-head">
    <div class="cover">${coverHtml(b, color)}</div>
    <div style="min-width:0"><h3>${esc(b.title)}</h3><p>${esc(b.authors)}${b.year ? ' · ' + esc(b.year) : ''}</p>${b.pages ? `<p>${b.pages} pages</p>` : ''}</div>
    ${closeBtn}
  </div>`;
}

// Choisir où ranger un livre trouvé.
function openAddSheet(r) {
  const back = showSheet(
    '#E8B84A',
    `${sheetHead(r, '#E8B84A')}
    <span class="field-label">Où le ranger ?</span>
    <div class="choices">
      <button class="choice" data-to="reading">Je le lis en ce moment</button>
      <button class="choice" data-to="pile">Je l’ai, je vais le lire</button>
      <button class="choice" data-to="wish">J’aimerais le lire</button>
    </div>
    <span class="field-label">Déjà lu ? Classe-le :</span>
    <div class="choices">${state.tiers
      .map((t) => `<button class="choice tier-choice" data-to="tier:${t.id}" style="border-color:${esc(t.color)}">${esc(t.name)}</button>`)
      .join('')}</div>`,
  );
  back.addEventListener('click', (e) => {
    const c = e.target.closest('[data-to]');
    if (!c) return;
    addBook(r, c.dataset.to);
    closeSheet();
    render();
  });
}

function openManualSheet() {
  const back = showSheet(
    '#6F6E69',
    `<div class="sheet-head"><div style="flex:1"><h3>Ajouter à la main</h3></div>${closeBtn}</div>
    <label class="field-label" for="m-title">Titre</label><input id="m-title" class="num" style="width:100%">
    <label class="field-label" for="m-author">Auteur (facultatif)</label><input id="m-author" class="num" style="width:100%">
    <label class="field-label" for="m-pages">Nombre de pages (facultatif)</label><input id="m-pages" class="num" type="number" inputmode="numeric" min="0">
    <div class="actions"><button class="btn full" data-action-sheet="next">Continuer</button></div>`,
  );
  back.querySelector('#m-title').focus();
  back.addEventListener('click', (e) => {
    if (!e.target.closest('[data-action-sheet="next"]')) return;
    const title = back.querySelector('#m-title').value.trim();
    if (!title) return toast('Écris au moins le titre.');
    openAddSheet({
      title,
      authors: back.querySelector('#m-author').value.trim(),
      pages: parseInt(back.querySelector('#m-pages').value, 10) || 0,
    });
  });
}

// Fiche d'un livre de la bibliothèque.
function openSheet(id) {
  const b = state.books[id];
  if (!b) return;
  const place = placeOf(id);
  const isRead = place && (place.startsWith('tier:') || place === 'unranked');
  const tier = state.tiers.find((t) => 'tier:' + t.id === place);
  const color = tier?.color || LISTS[place]?.color || '#1A1A1A';
  let inner = sheetHead(b, color);

  inner += `<span class="field-label">Où il est</span><div class="choices">
    ${['reading', 'pile', 'wish'].map((k) => `<button class="choice" data-to="${k}" aria-pressed="${place === k}">${LISTS[k].name}</button>`).join('')}
    <button class="choice" data-to="read" aria-pressed="${!!isRead}">Lu</button>
  </div>`;

  const siblings = state.order[place] || [];
  if (siblings.length > 1 && place !== 'reading') {
    const pos = siblings.indexOf(id);
    inner += `<span class="field-label">Sa place ${place === 'pile' ? 'dans ma pile' : 'dans ce niveau'} : ${pos + 1} sur ${siblings.length}</span>
      <div class="choices">
        <button class="choice" data-shift="-1" ${pos === 0 ? 'disabled' : ''}>Avancer</button>
        <button class="choice" data-shift="1" ${pos === siblings.length - 1 ? 'disabled' : ''}>Reculer</button>
      </div>`;
  }

  if (place === 'reading') {
    inner += `<label class="field-label" for="cur">Où j’en suis</label>
      <div class="pages-row"><span>Page</span><input id="cur" class="num" type="number" inputmode="numeric" min="0" value="${b.currentPage || 0}">
      <span>sur</span><input id="tot" class="num" type="number" inputmode="numeric" min="0" value="${b.pages || ''}" placeholder="?"></div>`;
  }

  if (isRead) {
    inner += `<span class="field-label">Mon niveau</span><div class="choices">${state.tiers
      .map(
        (t) =>
          `<button class="choice tier-choice" data-to="tier:${t.id}" aria-pressed="${place === 'tier:' + t.id}" style="border-color:${esc(t.color)};${place === 'tier:' + t.id ? 'background:' + esc(t.color) + ';color:' + onColor(t.color) : ''}">${esc(t.name)}</button>`,
      )
      .join('')}</div>
      <span class="field-label">Ma note</span>
      <div class="stars" role="group" aria-label="Note sur 5">${[1, 2, 3, 4, 5]
        .map((n) => `<button data-star="${n}" aria-label="${n} sur 5" aria-pressed="${b.rating >= n}">${starSvg(b.rating >= n)}</button>`)
        .join('')}</div>
      <label class="field-label" for="review">Mon avis</label>
      <textarea id="review" placeholder="Ce que j’en ai pensé…">${esc(b.review)}</textarea>`;
  }

  inner += `<span class="field-label">La couverture</span>
    <div class="choices">
      <button class="choice" data-covers>Choisir une autre couverture</button>
      <label class="choice photo-choice">Prendre une photo du livre<input type="file" accept="image/*" capture="environment" data-photo hidden></label>
    </div>`;

  inner += `<div class="actions">
    ${place === 'reading' ? `<button class="btn full" data-to="read">J’ai fini ce livre !</button>` : ''}
    <button class="btn danger full" data-remove>Retirer de ma bibliothèque</button>
  </div>`;

  const back = showSheet(color, inner);

  const cur = back.querySelector('#cur');
  const tot = back.querySelector('#tot');
  const saveProgress = () => {
    b.pages = Math.max(0, parseInt(tot.value, 10) || 0);
    b.currentPage = Math.max(0, Math.min(b.pages || Infinity, parseInt(cur.value, 10) || 0));
    save();
    render();
  };
  cur?.addEventListener('change', saveProgress);
  tot?.addEventListener('change', saveProgress);
  back.querySelector('[data-photo]').addEventListener('change', async (e) => {
    const f = e.target.files[0];
    if (!f) return;
    try {
      b.cover = await photoToDataUrl(f);
      save();
      render();
      openSheet(id);
      toast('Photo enregistrée !');
    } catch (err) {
      toast('Impossible de lire cette photo.');
    }
  });
  back.querySelector('#review')?.addEventListener('input', (e) => {
    b.review = e.target.value;
    save();
  });

  let confirmRemove = false;
  back.addEventListener('click', (e) => {
    if (e.target.closest('[data-covers]')) return openCoverPicker(id);
    const shift = e.target.closest('[data-shift]');
    if (shift) {
      const list = state.order[place];
      const i = list.indexOf(id);
      const j = i + Number(shift.dataset.shift);
      if (j < 0 || j >= list.length) return;
      [list[i], list[j]] = [list[j], list[i]];
      save();
      render();
      return openSheet(id);
    }
    const star = e.target.closest('[data-star]');
    if (star) {
      const n = Number(star.dataset.star);
      b.rating = b.rating === n ? 0 : n;
      save();
      return openSheet(id);
    }
    const to = e.target.closest('[data-to]');
    if (to) {
      let dest = to.dataset.to;
      // « Lu » : il faut choisir un niveau, on le met d'abord dans « À classer ».
      if (dest === 'read') {
        if (isRead) return;
        dest = 'unranked';
        toast('Bravo ! Choisis maintenant son niveau.');
      }
      if (dest !== place) moveBook(id, dest);
      render();
      return openSheet(id);
    }
    const rm = e.target.closest('[data-remove]');
    if (rm) {
      if (!confirmRemove) {
        confirmRemove = true;
        rm.textContent = 'Appuie encore pour confirmer';
        return;
      }
      removeBook(id);
      closeSheet();
      render();
      toast('Livre retiré.');
    }
  });
}

// Choisir parmi les couvertures des différentes éditions.
async function openCoverPicker(id) {
  const b = state.books[id];
  const back = showSheet(
    '#E8B84A',
    `<div class="sheet-head"><div style="flex:1"><h3>Choisis la couverture</h3><p>${esc(b.title)}</p></div>${closeBtn}</div>
    <p class="status" id="cover-status">Je cherche les couvertures…</p>
    <div class="cover-grid" id="cover-grid"></div>
    <div class="actions"><button class="btn ghost full" data-back>Retour à la fiche</button></div>`,
  );
  back.addEventListener('click', (e) => {
    if (e.target.closest('[data-back]')) return openSheet(id);
    const pick = e.target.closest('[data-pick]');
    if (pick) {
      b.cover = pick.dataset.pick;
      save();
      render();
      openSheet(id);
      toast('Couverture changée !');
    }
  });
  const urls = await coverCandidates(b.title, b.authors, b.isbn);
  if (!document.body.contains(back)) return;
  back.querySelector('#cover-status').textContent = urls.length
    ? 'Touche la bonne couverture.'
    : 'Aucune couverture trouvée. Tu peux prendre ton livre en photo depuis sa fiche.';
  back.querySelector('#cover-grid').innerHTML = urls
    .map((u) => `<button class="cover big" data-pick="${esc(u)}" aria-label="Choisir cette couverture"><img src="${esc(u)}" alt="" loading="lazy" onerror="this.parentNode.remove()"></button>`)
    .join('');
}

// ---------- Modifier les niveaux ----------

function openTierEditor() {
  const back = showSheet(
    '#E8B84A',
    `<div class="sheet-head"><div style="flex:1"><h3>Mes niveaux</h3><p>Renomme, change la couleur, ajoute ou retire un niveau.</p></div>${closeBtn}</div>
    <div class="list" style="margin-top:16px">${state.tiers
      .map(
        (t, i) => `<div>
        <div class="tier-edit" style="border-left:8px solid ${esc(t.color)}">
          <input value="${esc(t.name)}" data-rename="${t.id}" aria-label="Nom du niveau ${i + 1}">
          <button class="handle" data-up="${t.id}" aria-label="Monter" ${i === 0 ? 'disabled' : ''}><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M4 13l6-6 6 6"/></svg></button>
          <button class="handle" data-del="${t.id}" aria-label="Supprimer ${esc(t.name)}"><svg width="20" height="20" viewBox="0 0 20 20" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M4 4l12 12M16 4L4 16"/></svg></button>
        </div>
        <div class="swatches">${COLORS.map((c) => `<button class="swatch" data-color="${c}" data-tier="${t.id}" style="background:${c}" aria-label="Couleur" aria-pressed="${c === t.color}"></button>`).join('')}</div>
      </div>`,
      )
      .join('')}</div>
    <div class="actions"><button class="btn full" data-add-tier>Ajouter un niveau</button></div>`,
  );
  back.addEventListener('input', (e) => {
    const t = state.tiers.find((x) => x.id === e.target.dataset.rename);
    if (t) {
      t.name = e.target.value || 'Sans nom';
      save();
      render();
    }
  });
  back.addEventListener('click', (e) => {
    const sw = e.target.closest('[data-color]');
    const up = e.target.closest('[data-up]');
    const del = e.target.closest('[data-del]');
    if (sw) {
      state.tiers.find((x) => x.id === sw.dataset.tier).color = sw.dataset.color;
    } else if (up) {
      const i = state.tiers.findIndex((x) => x.id === up.dataset.up);
      [state.tiers[i - 1], state.tiers[i]] = [state.tiers[i], state.tiers[i - 1]];
    } else if (del) {
      if (state.tiers.length <= 1) return toast('Il faut garder au moins un niveau.');
      const key = 'tier:' + del.dataset.del;
      // Les livres de ce niveau passent dans « À classer ».
      state.order.unranked = [...(state.order.unranked || []), ...(state.order[key] || [])];
      delete state.order[key];
      state.tiers = state.tiers.filter((x) => x.id !== del.dataset.del);
    } else if (e.target.closest('[data-add-tier]')) {
      const id = 't' + Date.now().toString(36);
      state.tiers.push({ id, name: 'Nouveau niveau', color: COLORS[state.tiers.length % COLORS.length] });
      state.order['tier:' + id] = [];
    } else return;
    save();
    render();
    openTierEditor();
  });
}

// ---------- Sauvegarde ----------

function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `bibliotheque-danais-${new Date().toISOString().slice(0, 10)}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Sauvegarde créée. Range le fichier dans « Fichiers ».');
}

function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!data.tiers || !data.books || !data.order) throw new Error('format');
      state = data;
      save();
      render();
      toast('Sauvegarde récupérée !');
    } catch (err) {
      toast('Ce fichier n’est pas une sauvegarde de la bibliothèque.');
    }
  };
  reader.readAsText(f);
}

render();
Object.values(state.books)
  .filter((b) => !b.cover)
  .forEach((b) => repairCover(b.id));
