<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habilitations">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Habilitations</title>
<style>
/* Un tableau de bord d'atelier : fond acier clair, fiches blanches, et les niveaux I · L · U
   dessinés comme sur la feuille de polyvalence (un trait, deux côtés, trois côtés d'un carré). */
:root {
  --bg: #F1F4F8;
  --card: #FFFFFF;
  --ink: #16202C;
  --ink-2: #4E5B6B;
  --ink-3: #626E7E;
  --line: rgba(22, 32, 44, .1);
  --accent: #1D5BD8;
  --accent-soft: #E6EEFC;
  --danger: #C2321F;
  --danger-soft: #FCEBE8;
  --ok: #17803D;
  --ok-soft: #E5F4EA;
  --warn: #B45309;
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
::selection { background: var(--accent); color: #fff; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
input, textarea { caret-color: var(--accent); }

#app { max-width: 1080px; margin: 0 auto; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1.page { font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin: 22px 0 4px; }
.sub { color: var(--ink-2); font-size: 15px; margin: 0; }
.section-title { font-size: 19px; font-weight: 800; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title small { color: var(--ink-3); font-weight: 700; font-size: 15px; }

/* Les niveaux I, L, U. */
.lvl { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto; }
.lvl svg { width: 18px; height: 18px; }
.lvl.letter { font-weight: 900; font-size: 11px; color: #fff; letter-spacing: -.02em; }
.lvl-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 12px; font-size: 16px; flex: 0 0 auto; }
.lvl-tag .lvl { background: transparent !important; }
.lvl-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 10px; padding: 3px 10px 3px 3px; font-weight: 700; font-size: 14px; max-width: 100%; }
.pchip .lvl { width: 24px; height: 24px; border-radius: 7px; }
.pchip .lvl svg { width: 15px; height: 15px; }
.pchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Avatars. */
.av { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #fff; flex: 0 0 auto; position: relative; }
.av.small { width: 34px; height: 34px; border-radius: 11px; font-size: 14px; }
.av.big { width: 64px; height: 64px; border-radius: 20px; font-size: 26px; }
.av.absent { filter: grayscale(1); opacity: .45; }

/* Cartes. */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(22, 32, 44, .04); }
button.card { text-align: left; width: 100%; padding: 14px; display: flex; gap: 12px; align-items: center; }
.card-title { font-weight: 800; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.card-meta { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.card .grow { flex: 1; min-width: 0; }
.chevron { color: var(--ink-3); width: 18px; height: 18px; flex: 0 0 auto; }
.lvls-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.face-row { display: flex; margin-top: 10px; }
.face-row .av { box-shadow: 0 0 0 2px var(--card); }
.face-row { gap: 4px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.badge.red { background: var(--danger-soft); color: var(--danger); }
.badge.green { background: var(--ok-soft); color: var(--ok); }
.badge.grey { background: var(--bg); color: var(--ink-2); }

/* Recherche et filtres. */
.search { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 42px; font-size: 17px; }
.search-wrap { position: relative; margin-top: 14px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* Aujourd'hui. */
.date-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.date-input { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 16px; }
.people-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
.pick { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; min-height: 96px; }
.pick > span:not(.av) { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.pick[aria-pressed="true"] { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.pick[aria-pressed="true"] .av { filter: grayscale(1); opacity: .5; }
.teams { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 480px), 1fr)); gap: 12px; }
.team-card { padding: 14px; }
.other-teams { margin-top: 14px; }
.other-teams summary { list-style: none; cursor: pointer; background: var(--card); border: 1.5px solid var(--line); border-radius: 15px; padding: 12px 16px; display: flex; align-items: center; gap: 12px; min-height: 52px; }
.ot-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
.ot-text b { font-size: 16px; }
.other-teams summary::-webkit-details-marker { display: none; }
.other-teams summary::after { content: ''; flex: 0 0 auto; width: 10px; height: 10px; border-right: 2.5px solid var(--ink-2); border-bottom: 2.5px solid var(--ink-2); transform: translateY(-3px) rotate(45deg); transition: transform .2s cubic-bezier(.2, .8, .2, 1); }
.other-teams[open] summary::after { transform: translateY(2px) rotate(-135deg); }
.ot-text small { color: var(--ink-2); font-weight: 600; font-size: 13px; }
.team-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
.team-head h3 { margin: 0; font-size: 19px; font-weight: 800; }
.team-head small { margin-left: auto; color: var(--ink-2); font-weight: 700; font-size: 14px; }
@media (max-width: 520px) { .team-head small { margin-left: 0; flex-basis: 100%; } }
.members { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 250px), 1fr)); gap: 6px; }
.team-boss { margin-bottom: 8px; padding-bottom: 8px; border-bottom: 1px dashed var(--line); }
.team-boss .mrow { background: var(--accent-soft); border-color: transparent; }
.mrow[hidden] { display: none; }
.mrow { display: grid; grid-template-columns: 34px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 52px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 12px; background: var(--card); text-align: left; width: 100%; }
.mrow-text { min-width: 0; display: flex; flex-direction: column; }
.mrow-text b, .mrow-text small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.mrow-text b { font-size: 15px; }
.mrow-text small { font-size: 12px; color: var(--ink-2); font-weight: 600; }
.mrow-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }
.mrow-tags .abs-type { max-width: 8.5rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 0 0 auto; }
.mrow.is-absent { background: var(--danger-soft); border-color: rgba(194, 50, 31, .35); }
.mrow.is-absent b { color: var(--danger); }
.pick-post { font-size: 12px; color: var(--ink-2); font-weight: 600; margin-top: -4px; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.absent-card { padding: 14px; }
.absent-head { display: flex; align-items: center; gap: 12px; }
.replace { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.replace-row { display: flex; gap: 10px; align-items: flex-start; }
.replace-poste { width: 120px; flex: 0 0 auto; font-weight: 700; font-size: 15px; padding-top: 6px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: flex-start; }
.cands { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.cand { text-align: left; display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 999px; padding: 3px 10px 3px 3px; font-weight: 700; font-size: 14px; border: 0; }
.cand .lvl { width: 24px; height: 24px; border-radius: 999px; }
.cand .lvl svg { width: 15px; height: 15px; }
/* « Qui peut remplacer » dans la fiche d'une personne. */
.rp-block { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.rp-block + .rp-block { margin-top: 10px; }
.rp-block[hidden] { display: none; }
.rp-head { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
.rp-head b { font-size: 16px; }
.rp-head small { margin-left: auto; color: var(--ink-2); font-weight: 600; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; }
.rp-head small .lvl-tag { font-size: 13px; padding: 2px 8px 2px 2px; }
.rp-group + .rp-group { margin-top: 10px; }
.rp-title { display: block; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .04em; color: var(--ink-3); margin-bottom: 6px; }
.rp-title.same { color: var(--accent); }
.rp-none { color: var(--ink-2); font-size: 14px; }
.cand small { color: var(--ink-2); font-size: 12px; font-weight: 700; }
.cand.same { background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); color: #123E9C; }
.legend-same { display: inline-block; width: 12px; height: 12px; border-radius: 4px; background: var(--accent-soft); box-shadow: inset 0 0 0 1.5px var(--accent); vertical-align: -1px; }
.nobody { color: var(--danger); font-weight: 800; font-size: 14px; padding-top: 6px; }

/* Fiche (feuille qui monte du bas, panneau centré sur ordinateur). */
.sheet-back { position: fixed; inset: 0; background: rgba(22, 32, 44, .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 0 max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); animation: rise .28s cubic-bezier(.16, 1, .3, 1); }
@media (min-width: 760px) { .sheet-back { align-items: center; } .sheet { border-radius: 26px; max-height: 86%; } }
@keyframes rise { from { transform: translateY(32px); opacity: .5; } }
.band { width: 40px; height: 5px; border-radius: 3px; background: rgba(22, 32, 44, .18); margin: 10px auto 0; }
.sheet-head { display: flex; gap: 14px; align-items: center; padding-top: 14px; }
.sheet-head h2 { margin: 0; font-size: 23px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
.sheet-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 15px; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(22, 32, 44, .08); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-left: auto; padding: 0; align-self: flex-start; }
.close svg { width: 16px; height: 16px; }
.label { display: block; font-weight: 800; font-size: 15px; margin: 20px 0 8px; color: var(--ink); }
.field { width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); padding: 10px 14px; font-size: 17px; }
.field::placeholder, .search::placeholder { color: var(--ink-3); }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

/* Une habilitation dans la fiche : poste + sélecteur de niveau. */
.skill { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 14px; }
.skill + .skill { margin-top: 8px; }
.skill-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.skill-name small { display: block; color: var(--ink-3); font-weight: 600; font-size: 13px; }
.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 2px; flex: 0 0 auto; }
.seg button { min-width: 44px; height: 40px; border: 0; background: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 6px; font-weight: 800; font-size: 14px; color: var(--ink-3); }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(22, 32, 44, .18); }
.seg button.none[aria-pressed="true"] { color: var(--ink); }
.seg button:not([aria-pressed="true"]) svg { opacity: .35; }

/* Boutons. */
.btn { min-height: 52px; width: 100%; border: 0; border-radius: 15px; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; }
.btn svg { width: 20px; height: 20px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 700; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid rgba(194, 50, 31, .35); font-weight: 700; }
.btn.small { width: auto; min-height: 44px; font-size: 15px; border-radius: 12px; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.empty { background: var(--card); border: 1.5px dashed rgba(22, 32, 44, .2); border-radius: var(--radius); padding: 22px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; width: auto; }

/* Réglages. */
.set-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 12px; }
.set-row + .set-row { margin-top: 8px; }
.set-row input { flex: 1; min-width: 0; height: 42px; border: 0; background: none; font-size: 16px; font-weight: 700; }
.icon-btn { width: 42px; height: 42px; border-radius: 11px; border: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); flex: 0 0 auto; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: .35; }
.level-edit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.level-edit + .level-edit { margin-top: 10px; }
.level-edit .top { display: flex; gap: 10px; align-items: center; }
.level-edit input.letter { width: 56px; height: 44px; text-align: center; font-weight: 900; font-size: 18px; border-radius: 10px; border: 1.5px solid var(--line); text-transform: uppercase; }
.level-edit textarea { width: 100%; margin-top: 8px; min-height: 60px; border-radius: 10px; border: 1.5px solid var(--line); padding: 8px 10px; font-size: 15px; resize: vertical; }
.hint { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }

/* Barre d'onglets : en bas sur téléphone, en haut sur ordinateur. */
.tabs { position: fixed; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; background: rgba(255, 255, 255, .86); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--line); border-radius: 24px; padding: 6px; z-index: 10; box-shadow: 0 10px 30px -12px rgba(22, 32, 44, .35); max-width: 640px; margin: 0 auto; }
.tabs button { flex: 1; min-width: 0; min-height: 56px; border: 0; background: none; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.tabs svg { width: 23px; height: 23px; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 900px) {
  .tabs { top: 14px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: 680px; }
  .tabs button { flex-direction: row; gap: 8px; font-size: 14px; min-height: 46px; }
  .tabs svg { width: 20px; height: 20px; }
  #app { padding-top: 76px; padding-bottom: 40px; }
}
/* Absences venant du planning Excel, et échéances. */
.abs-type { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; }
.pick .abs-type { margin-top: -2px; }
.ech-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.ech-row + .ech-row { margin-top: 8px; }
.ech-row .grow { flex: 1; min-width: 0; }
.ech-date { font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ech-date.red { background: var(--danger-soft); color: var(--danger); }
.ech-date.orange { background: #FDF0DC; color: var(--warn); }
.ech-date.green { background: var(--ok-soft); color: var(--ok); }
.ech-date.none { background: var(--bg); color: var(--ink-3); }
.ech-wrap { display: inline-flex; flex-direction: column; align-items: flex-end; gap: 2px; flex: 0 0 auto; }
.ech-got { font-size: 12px; font-weight: 600; color: var(--ink-3); white-space: nowrap; }
.ech-edit { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; }
.ech-edit + .ech-edit { margin-top: 8px; }
.ech-edit .grow { flex: 1; min-width: 0; font-weight: 700; }
.ech-edit input { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); padding: 0 8px; font-size: 15px; background: var(--card); }
.link-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.link-card + .link-card { margin-top: 10px; }
.link-card b { display: block; font-size: 16px; }
.link-state { font-size: 14px; color: var(--ink-2); margin: 4px 0 10px; }
.link-state.ok { color: var(--ok); font-weight: 700; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 14px; padding: 10px 12px; margin-top: 14px; font-weight: 700; font-size: 15px; }
.banner .btn { width: auto; min-height: 40px; font-size: 14px; margin-left: auto; }
/* Recherche d'une personne, en haut de chaque page. */
.finder { position: sticky; top: 0; z-index: 8; padding: calc(10px + env(safe-area-inset-top)) 0 6px; margin-top: calc(-1 * env(safe-area-inset-top)); background: linear-gradient(var(--bg) 80%, rgba(241, 244, 248, 0)); }
.finder .search-wrap { margin-top: 0; flex: 1; min-width: 0; }
.finder { display: flex; align-items: center; gap: 8px; }
.reload-btn { flex: 0 0 auto; width: 52px; height: 52px; border-radius: 16px; border: 1px solid var(--line); background: var(--card); color: var(--ink); display: flex; align-items: center; justify-content: center; padding: 0; }
.reload-btn svg { width: 24px; height: 24px; }
.reload-btn:active { transform: scale(.94); }
.finder-results { position: absolute; left: 0; right: 0; top: 100%; background: var(--card); border: 1px solid var(--line); border-radius: 16px; box-shadow: 0 16px 40px -12px rgba(22, 32, 44, .35); max-height: 60vh; overflow-y: auto; padding: 6px; }
.finder-results button { width: 100%; display: flex; align-items: center; gap: 10px; padding: 8px; border: 0; background: none; border-radius: 12px; text-align: left; min-height: 52px; }
.finder-results button:hover, .finder-results button:focus-visible { background: var(--bg); }
.finder-results .grow { flex: 1; min-width: 0; }
.finder-results small { display: block; color: var(--ink-2); font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
@media (min-width: 900px) { .finder { top: 0; padding-top: 72px; margin-top: -72px; background: var(--bg); box-shadow: 0 1px 0 var(--line); } }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45); }

.mrow, .btn, .chip, .pick, button.card, .seg button, .tabs button, .icon-btn, .close, .cand { transition: transform .14s cubic-bezier(.2, .8, .2, 1), background-color .15s ease-out, opacity .12s ease-out; }
.mrow:active, .btn:active, .chip:active, .pick:active, button.card:active, .seg button:active, .tabs button:active, .icon-btn:active { transform: scale(.97); }
@media (hover: hover) { button.card:hover, .pick:hover { border-color: rgba(22, 32, 44, .25); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="jour" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 15l2 2 4-4"/></svg>Aujourd’hui</button>
  <button role="tab" data-tab="equipe" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>Équipe</button>
  <button role="tab" data-tab="postes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Postes</button>
  <button role="tab" data-tab="echeances" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Échéances</button>
  <button role="tab" data-tab="reglages" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Réglages</button>
</nav>
<script>
'use strict';

// ---------- Données (gardées dans cet appareil) ----------

const STORE_KEY = 'habilitations-v1';
const ROLE_COLORS = ['#1D5BD8', '#B45309', '#0F766E', '#7C3AED', '#BE185D', '#4B5563', '#0369A1', '#A16207'];
const LEVEL_COLORS = ['#D97706', '#1D5BD8', '#17803D', '#7C3AED', '#BE185D', '#0F766E'];

// Sous I : pas encore opérationnels, donc jamais proposés comme remplaçants.
const LOW_LEVELS = [
  { id: 'AI', letter: 'AI', name: 'À initier', shape: 'letter', color: '#6B7280', desc: 'Pas encore formé : la formation est à prévoir.', replace: false },
  { id: 'EF', letter: 'EF', name: 'En formation', shape: 'letter', color: '#0E7490', desc: 'En cours de formation sur le poste.', replace: false },
];

function defaultState() {
  return {
    version: 1,
    roles: [
      { id: 'r1', name: 'Opérateur', color: '#1D5BD8' },
      { id: 'r2', name: 'Alternant', color: '#B45309' },
      { id: 'r3', name: 'Technicien', color: '#0F766E' },
      { id: 'r4', name: 'Manageur', color: '#7C3AED' },
    ],
    // Du plus bas au plus haut : l'ordre sert à proposer les meilleurs remplaçants d'abord.
    levels: [
      ...LOW_LEVELS,
      { id: 'I', letter: 'I', label: 'Initié', shape: 'I', color: '#D97706', desc: 'Initié : connaissance de base. Opérationnel, mais peut avoir besoin d’aide.' },
      { id: 'L', letter: 'L', label: 'Utilisateur', shape: 'L', color: '#1D5BD8', desc: 'Utilisateur : poste maîtrisé.' },
      { id: 'U', letter: 'U', label: 'Formateur', shape: 'U', color: '#17803D', desc: 'Formateur : poste maîtrisé, et sait former et transmettre.' },
    ],
    postes: [],
    people: [],
    absences: {},
    // Habilitations à date (microbio, ZEC, CACES…) : chaque personne a une date d'échéance.
    echeances: [],
    // Absences lues dans le planning Excel : { jour: { personne: { type, note } } }.
    absImport: {},
    shifts: {},
    locs: {},
    links: {},
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) {
      const data = { ...defaultState(), ...JSON.parse(raw) };
      // Anciennes versions : on ajoute « À initier » et « En formation » sous I.
      const missing = LOW_LEVELS.filter((l) => !data.levels.some((x) => x.id === l.id));
      if (missing.length) data.levels = [...missing, ...data.levels];
      const fresh = defaultState().levels;
      data.levels.forEach((l) => {
        const d = fresh.find((x) => x.id === l.id && x.label);
        if (d && !l.label) Object.assign(l, { label: d.label, desc: d.desc });
      });
      return data;
    }
  } catch (e) {}
  return defaultState();
}

let state = load();
let ui = { tab: 'jour', day: iso(new Date()), query: '', roleFilter: 'all' };

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Impossible d’enregistrer sur cet appareil.');
  }
}

const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const person = (id) => state.people.find((p) => p.id === id);
const poste = (id) => state.postes.find((p) => p.id === id);
const role = (id) => state.roles.find((r) => r.id === id);
const level = (id) => state.levels.find((l) => l.id === id);
const rank = (id) => state.levels.findIndex((l) => l.id === id);
const byName = (a, b) => a.name.localeCompare(b.name, 'fr');

// ---------- Petits outils ----------

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const parseIso = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = (name) =>
  String(name || '?')
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w.charAt(0).toUpperCase())
    .join('');

let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

const icons = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg viewBox="0 0 22 22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l14 14M18 4L4 18"/></svg>',
  chevron: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>',
  up: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l6-6 6 6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>',
};

// Le dessin du niveau : I = un côté, L = deux côtés, U = trois côtés d'un carré.
function levelSvg(lv, color) {
  const c = color || lv.color;
  const paths = { I: 'M5 3v14', L: 'M5 3v14h10', U: 'M5 3v14h10V3' };
  return `<svg viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[lv.shape]}"/></svg>`;
}

function lvlHtml(id) {
  const lv = level(id);
  if (!lv) return '';
  if (lv.shape && lv.shape !== 'letter') return `<span class="lvl" style="background:${lv.color}1A" title="${esc(lv.letter)} : ${esc(lv.desc)}" aria-label="Niveau ${esc(lv.letter)}">${levelSvg(lv)}</span>`;
  return `<span class="lvl letter" style="background:${lv.color}" title="${esc(lv.letter)} : ${esc(lv.desc)}" aria-label="Niveau ${esc(lv.letter)}">${esc(lv.letter)}</span>`;
}

function avHtml(p, cls = '') {
  const r = role(p.role);
  return `<span class="av ${cls}" style="background:${r?.color || '#4B5563'}" aria-hidden="true">${esc(initials(p.name))}</span>`;
}

// Les noms du planning qui ne correspondent à personne du fichier d'habilitations ne sont pas affichés
// (sauf les homonymes, signalés pour qu'on ajoute l'initiale du prénom).
const shown = (p) => p && !(p.planOnly && !p.ambiguous);
const absentOn = (day) => new Set(Object.keys(state.absImport?.[day] || {}).filter((id) => shown(person(id))));
const absInfo = (day, id) => state.absImport?.[day]?.[id] || null;
// Quarts de travail écrits dans le planning : la personne est là.
const SHIFT_CODES = { qm: 'Quart matin', qam: 'Quart après-midi', qn: 'Quart nuit', qj: 'Quart de jour' };
const shiftOf = (day, id) => state.shifts?.[day]?.[id] || '';
const dayHasShifts = (day) => Object.keys(state.shifts?.[day] || {}).length > 0;
// Travaille ce jour-là : un quart, ou « DPP » écrit dans le planning.
const working = (day, id) => !!(shiftOf(day, id) || state.locs?.[day]?.[id]);
// Couleur de chaque quart : vert le matin, orange l'après-midi, violet la nuit.
const SHIFT_COLORS = { 'Quart matin': '#2E7D4F', 'Quart après-midi': '#C2570C', 'Quart nuit': '#6B3FBF', 'Quart de jour': '#1D4ED8' };
const shiftColor = (label) => SHIFT_COLORS[label] || 'var(--ok)';
const shortShift = (label) => (Object.entries(SHIFT_CODES).find(([, v]) => v === label)?.[0] || '').toUpperCase() || label;

// DPP = l'endroit où travaille la personne : le bâtiment AI.
const DPP_RE = /\bdpp\b|batiment ai|\bbat ai\b/;
const DPP_POSTE_RE = /\bdpp\b|batiment ai|\bbat ai\b|^ai$/;
const isDpp = (p, day) => state.locs?.[day]?.[p.id] === 'DPP' || DPP_RE.test(norm(p.post)) || DPP_RE.test(norm(p.team));
// Le meilleur niveau opérationnel de la personne sur les postes du DPP / bâtiment AI ('' = pas habilitée).
function dppLevel(p) {
  let best = '';
  for (const po of state.postes.filter((x) => DPP_POSTE_RE.test(norm(x.name)))) {
    const lv = p.skills?.[po.id];
    if (lv && level(lv) && level(lv).replace !== false && (!best || rank(lv) > rank(best))) best = lv;
  }
  return best;
}

// Est-ce que la personne est là ce jour-là ?
function presence(day, p) {
  const a = absInfo(day, p.id);
  if (a) return { here: false, text: 'Absent · ' + absText(a), color: absColor(a.type) };
  const sh = shiftOf(day, p.id);
  if (sh) return { here: true, text: 'Là · ' + sh + (isDpp(p, day) ? ' · DPP (bât. AI)' : ''), color: shiftColor(sh) };
  if (state.locs?.[day]?.[p.id] === 'DPP') return { here: true, text: 'Là · DPP (bât. AI)', color: 'var(--ok)' };
  if (dayHasShifts(day)) return { here: false, text: 'Pas de quart ce jour-là', color: '#6B7280' };
  if (state.links.plan || Object.keys(state.absImport || {}).length) return { here: true, text: 'Là', color: 'var(--ok)' };
  return { here: null, text: 'Pas de planning', color: '#6B7280' };
}
const presenceBadge = (day, p) => {
  const pr = presence(day, p);
  return `<span class="abs-type" style="background:${pr.color}">${esc(pr.text)}</span>`;
};
const ABS_COLORS = { conge: '#0E7490', 'conge annuel': '#0E7490', rtt: '#BE185D', arret: '#C2321F', absence: '#0A84C6', formation: '#854D0E', autre: '#4B5563' };
const absColor = (type) => ABS_COLORS[norm(type).replace(/s$/, '')] || ABS_COLORS[Object.keys(ABS_COLORS).find((k) => norm(type).startsWith(norm(k)))] || '#4B5563';
const absBadge = (info) => (info ? `<span class="abs-type" style="background:${absColor(info.type)}">${esc(info.type)}</span>` : '');
const ABS_SHORT = { 'conge annuel': 'CA', conge: 'CA', rtt: 'RTT', absence: 'ABS', arret: 'Arrêt', formation: 'For' };
const absShort = (info) => (info ? `<span class="abs-type" style="background:${absColor(info.type)}" title="${esc(absText(info))}">${esc(info.raw || ABS_SHORT[norm(info.type)] || info.type)}</span>` : '');
// « RTT », « CA (Congé annuel) », « Visite médicale »… : le texte de l'Excel d'abord.
const absText = (info) => (info.raw && norm(info.raw) !== norm(info.type) ? `${info.raw} (${info.type})` : info.raw || info.type);
const norm = (t) => String(t ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

// Qui peut tenir ce poste (en dehors de certaines personnes), les plus habiles d'abord.
function candidates(posteId, exclude, day = ui.day) {
  const shifts = dayHasShifts(day);
  return state.people
    .filter((p) => !exclude.has(p.id) && p.skills?.[posteId] && level(p.skills[posteId]) && level(p.skills[posteId]).replace !== false)
    .filter((p) => !shifts || working(day, p.id))
    .sort((a, b) => rank(b.skills[posteId]) - rank(a.skills[posteId]) || shiftRank(a, day) - shiftRank(b, day) || byName(a, b));
}

// ---------- Recherche d'une personne (sur chaque page) ----------

// Postes : on filtre les postes. Échéances : on montre celles d'une personne. Ailleurs : on cherche une personne.
const FINDER_MODE = { postes: ['posteQuery', 'Rechercher un poste'], echeances: ['echQuery', 'Échéances d’une personne (nom, prénom…)'] };
function finderHtml() {
  if (!state.people.some((p) => !p.planOnly)) return '';
  const mode = FINDER_MODE[ui.tab];
  const label = mode ? mode[1] : 'Rechercher une personne';
  return `<div class="finder" role="search"><div class="search-wrap">${icons.search}<input class="search" id="finder" type="search" placeholder="${label}" value="${esc(mode ? ui[mode[0]] || '' : '')}" autocomplete="off" aria-label="${label}"${mode ? ' aria-controls="page"' : ' aria-controls="finder-results"'}></div><button class="reload-btn" data-action="reload-page" aria-label="Rafraîchir la page" title="Rafraîchir"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg></button><div class="finder-results" id="finder-results" hidden></div></div>`;
}

// Redessine la page sous la barre de recherche, sans toucher au champ (le clavier reste ouvert).
function renderPage() {
  const page = document.getElementById('page');
  if (!page) return render();
  page.innerHTML = SCREENS[ui.tab]();
  bind();
}

function finderMatches(q) {
  const t = norm(q);
  if (!t) return [];
  const words = t.split(' ');
  return state.people
    .filter((p) => !p.planOnly)
    .map((p) => {
      const hay = norm([p.name, p.visa, p.team, p.post, role(p.role)?.name].filter(Boolean).join(' '));
      return { p, ok: words.every((w) => hay.includes(w)), first: norm(p.name).split(' ').some((w) => w.startsWith(words[0])) };
    })
    .filter((x) => x.ok)
    .sort((a, b) => b.first - a.first || byName(a.p, b.p))
    .slice(0, 12)
    .map((x) => x.p);
}

function showFinder(input) {
  const box = document.getElementById('finder-results');
  if (!box) return;
  const q = input.value.trim();
  if (!q) {
    box.hidden = true;
    return;
  }
  const hits = finderMatches(q);
  const today = absentOn(iso(new Date()));
  box.hidden = false;
  box.innerHTML = hits.length
    ? hits
        .map((p) => {
          const n = Object.keys(p.skills || {}).filter((k) => poste(k) && level(p.skills[k])).length;
          return `<button data-person="${p.id}">${avHtml(p, 'small' + (today.has(p.id) ? ' absent' : ''))}<span class="grow"><b>${esc(p.name)}</b><small>${esc([role(p.role)?.name, p.team, p.post, n + ' poste' + (n > 1 ? 's' : '')].filter(Boolean).join(' · '))}</small></span>${presenceBadge(iso(new Date()), p)}</button>`;
        })
        .join('')
    : `<p class="hint" style="padding:8px">Personne ne s’appelle « ${esc(q)} ».</p>`;
}

document.addEventListener('input', (e) => {
  if (e.target.id !== 'finder') return;
  const mode = FINDER_MODE[ui.tab];
  if (mode) {
    ui[mode[0]] = e.target.value;
    return renderPage();
  }
  showFinder(e.target);
});
document.addEventListener('keydown', (e) => {
  if (e.target.id !== 'finder') return;
  if (FINDER_MODE[ui.tab]) {
    if (e.key === 'Escape') {
      e.target.value = '';
      ui[FINDER_MODE[ui.tab][0]] = '';
      renderPage();
    }
    return;
  }
  if (e.key === 'Escape') {
    e.target.value = '';
    showFinder(e.target);
  }
  if (e.key === 'Enter') document.querySelector('#finder-results button')?.click();
});
document.addEventListener('click', (e) => {
  const box = document.getElementById('finder-results');
  if (box && !box.hidden && !e.target.closest('.finder')) box.hidden = true;
  if (e.target.closest('#finder-results [data-person]')) {
    const input = document.getElementById('finder');
    if (input) input.value = '';
    if (box) box.hidden = true;
  }
});

// ---------- Écrans ----------

const app = document.getElementById('app');

const SCREENS = {
  jour: () => renderToday(),
  equipe: () => renderTeam(),
  postes: () => renderPostes(),
  echeances: () => renderEcheances(),
  reglages: () => renderSettings(),
};

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  app.innerHTML = finderHtml() + `<div id="page">${SCREENS[ui.tab]()}</div>`;
  bind();
}

function firstSteps() {
  if (!state.postes.length)
    return `<div class="empty"><b>L’appli est vide sur cet appareil</b>Charge tes fichiers Excel (Réglages › Fichiers Excel raccordés), ou essaie d’abord avec l’exemple : 29 personnes inventées, leurs habilitations et le planning de l’année.<br><button class="btn" data-action="demo">Charger l’exemple</button><br><button class="btn ghost" data-tab-go="reglages" style="margin-top:8px">Raccorder mes fichiers Excel</button></div>`;
  if (!state.people.length)
    return `<div class="empty"><b>Pas encore d’équipe</b>L’équipe vient de ton fichier Excel d’habilitations.<br><button class="btn" data-tab-go="reglages">Raccorder mon fichier</button></div>`;
  return '';
}

// Aujourd'hui : on coche les absents, l'appli propose des remplaçants pour chacun de leurs postes.
// Regrouper par équipe (colonne « équipe » du fichier ou « EQ A » du planning).
function teamsOf(people) {
  const map = new Map();
  for (const p of people) {
    const t = p.team || 'Sans équipe';
    if (!map.has(t)) map.set(t, []);
    map.get(t).push(p);
  }
  return [...map.entries()].sort((a, b) => (a[0] === 'Sans équipe') - (b[0] === 'Sans équipe') || a[0].localeCompare(b[0], 'fr'));
}
// Ordre des quarts : matin, après-midi, nuit, journée ; puis sans quart ; les absents à la fin.
const SHIFT_ORDER = ['Quart matin', 'Quart après-midi', 'Quart nuit', 'Quart de jour'];
function shiftRank(p, day) {
  if (absInfo(day, p.id)) return 9;
  const i = SHIFT_ORDER.indexOf(shiftOf(day, p.id));
  return i >= 0 ? i : working(day, p.id) ? 4 : 5;
}

// Le manageur (ou le chef) en haut, puis les chefs de ligne, puis les autres.
// Dans le fichier, le code d'équipe est souvent le VISA du manageur (équipe « NTD » = VISA « NTD_BL »),
// et la colonne « animateur » donne le VISA de l'animateur.
const visaCode = (p) => norm(p.visa).split(' ')[0] || '';
function bossRank(p) {
  const r = norm(role(p.role)?.name);
  const post = norm(p.post);
  if (/manag|chef d equipe|responsable/.test(r) || post === 'chef' || /^(manag|chef d equipe)/.test(post)) return 0;
  if (p.team && visaCode(p) && visaCode(p) === norm(p.team)) return 0;
  if (post === 'cdl' || /chef de ligne/.test(post) || /animat/.test(r)) return 1;
  if (visaCode(p) && state.people.some((x) => x.team === p.team && norm(x.anim) === visaCode(p))) return 1;
  return 2;
}
// Ce qu'on écrit sous le nom, si le poste ne le dit pas déjà (« Chef », « CDL »).
const bossLabel = (p) => {
  const post = norm(p.post);
  if (bossRank(p) === 0) return post === 'chef' || /manag/.test(post) ? '' : 'Manageur';
  if (bossRank(p) === 1) return post === 'cdl' || /chef de ligne/.test(post) ? '' : 'Animateur';
  return '';
};
// Le quart de l'équipe ce jour-là : celui que la plupart de ses membres font.
function teamShift(members, day) {
  const count = {};
  members.forEach((p) => {
    const sh = shiftOf(day, p.id);
    if (sh) count[sh] = (count[sh] || 0) + 1;
  });
  return Object.entries(count).sort((a, b) => b[1] - a[1])[0]?.[0] || '';
}

// Une ligne par personne : les noms longs sont coupés proprement au lieu de déformer les cases.
function personRow(p, day, absent, attr = 'data-absent') {
  return `<button class="mrow${absent.has(p.id) ? ' is-absent' : ''}" ${attr}="${p.id}" title="${esc(p.name)}${p.post ? ' · ' + esc(p.post) : ''}">${avHtml(p, 'small' + (absent.has(p.id) ? ' absent' : ''))}<span class="mrow-text"><b>${esc(p.name)}</b>${p.post || bossLabel(p) ? `<small>${esc([bossLabel(p), p.post].filter(Boolean).join(' · '))}</small>` : ''}</span><span class="mrow-tags">${absShort(absInfo(day, p.id)) || (shiftOf(day, p.id) ? `<span class="abs-type" style="background:${shiftColor(shiftOf(day, p.id))}">${esc(shortShift(shiftOf(day, p.id)))}</span>` : '')}${isDpp(p, day) ? '<span class="abs-type" style="background:#374151" title="Bâtiment AI">DPP</span>' : ''}</span></button>`;
}

// Les personnes sans équipe : une liste à part, avec sa propre recherche.
function openNoTeam() {
  const day = ui.day;
  const absent = absentOn(day);
  const list = state.people.filter((p) => shown(p) && !p.team).sort((a, b) => shiftRank(a, day) - shiftRank(b, day) || byName(a, b));
  const back = showSheet(`<div class="sheet-head"><div style="min-width:0"><h2>Sans équipe</h2><p>${list.length} personne${list.length > 1 ? 's' : ''} sans équipe dans tes fichiers</p></div>${closeBtn}</div>
    <div class="search-wrap" style="margin-top:14px">${icons.search}<input class="search" id="nt-find" type="search" placeholder="Chercher dans cette liste" autocomplete="off" aria-label="Chercher une personne sans équipe"></div>
    <p class="hint" id="nt-none" hidden>Personne ne correspond.</p>
    <div class="members" id="nt-list" style="margin-top:12px">${list.map((p) => personRow(p, day, absent, 'data-go-person')).join('')}</div>`);
  back.querySelector('#nt-find').addEventListener('input', (e) => {
    const words = norm(e.target.value).split(' ').filter(Boolean);
    let n = 0;
    back.querySelectorAll('#nt-list .mrow').forEach((row) => {
      const ok = words.every((w) => norm(row.textContent + ' ' + row.title).includes(w));
      row.hidden = !ok;
      n += ok;
    });
    back.querySelector('#nt-none').hidden = n > 0;
  });
  back.addEventListener('click', (e) => {
    const el = e.target.closest('[data-go-person]');
    if (el) openPerson(el.dataset.goPerson);
  });
}

function renderToday() {
  const day = ui.day;
  const d = parseIso(day);
  const isToday = day === iso(new Date());
  let html = `<h1 class="page">${isToday ? 'Aujourd’hui' : esc(cap(d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })))}</h1>
    <p class="sub">Les absents du jour viennent de ton planning Excel. Touche une personne pour voir qui peut la remplacer.</p>
    <div class="date-row"><input type="date" class="date-input" id="day" value="${day}" aria-label="Choisir le jour">${isToday ? '' : '<button class="btn ghost small" data-action="today">Revenir à aujourd’hui</button>'}</div>
    ${linkBanner()}`;
  const steps = firstSteps();
  if (steps) return html + `<div style="margin-top:18px">${steps}</div>`;

  const absent = absentOn(day);
  const people = state.people.filter(shown);
  const tile = (p) => personRow(p, day, absent);
  const teamOrder = (members) => {
    const i = SHIFT_ORDER.indexOf(teamShift(members, day));
    return i >= 0 ? i : 9;
  };
  const noTeam = people.filter((p) => !p.team);
  const teamCard = ([team, members]) => {
    let html = '';
    const sorted = members.slice().sort((a, b) => shiftRank(a, day) - shiftRank(b, day) || bossRank(a) - bossRank(b) || byName(a, b));
    const bosses = sorted.filter((p) => bossRank(p) === 0);
    const others = sorted.filter((p) => bossRank(p) !== 0);
    const nAbs = members.filter((p) => absent.has(p.id)).length;
    const nDpp = members.filter((p) => !absent.has(p.id) && isDpp(p, day)).length;
    const sh = teamShift(members, day);
    const boss = members.find((p) => bossRank(p) === 0);
    html += `<section class="team-card card">
        <div class="team-head"><h3>${esc(team)}${boss && norm(team) === visaCode(boss) ? ` <span style="font-weight:600;color:var(--ink-2);font-size:15px">· ${esc(boss.name)}</span>` : ''}</h3>${sh ? `<span class="abs-type" style="background:${shiftColor(sh)}">${esc(sh)}</span>` : dayHasShifts(day) ? '<span class="abs-type" style="background:#6B7280">Pas de quart</span>' : ''}<small>${members.length - nAbs} présent${members.length - nAbs > 1 ? 's' : ''}${nAbs ? ` · ${nAbs} absent${nAbs > 1 ? 's' : ''}` : ''}${nDpp ? ` · ${nDpp} au DPP (bât. AI)` : ''}</small></div>
        ${bosses.length ? `<div class="members team-boss">${bosses.map(tile).join('')}</div>` : ''}
        <div class="members">${others.map(tile).join('')}</div>
      </section>`;
    return html;
  };
  // En haut : les équipes de quart (matin, après-midi, nuit). À part, repliées : les autres équipes.
  const teams = teamsOf(people.filter((p) => p.team)).sort((a, b) => teamOrder(a[1]) - teamOrder(b[1]));
  const onShift = dayHasShifts(day) ? teams.filter(([, m]) => SHIFT_ORDER.slice(0, 3).includes(teamShift(m, day))) : teams;
  const rest = teams.filter((t) => !onShift.includes(t));
  html += `<div class="section-title">${dayHasShifts(day) ? 'Les équipes de quart' : 'Les équipes ce jour-là'}<small>${absent.size ? absent.size + ' absent' + (absent.size > 1 ? 's' : '') : ''}</small></div>`;
  // Pas de quart ce jour-là : on dit pourquoi (planning pas encore lu, ou ce jour n'y est pas).
  if (!dayHasShifts(day)) {
    const sd = Object.keys(state.shifts || {}).filter((d) => Object.keys(state.shifts[d] || {}).length).sort();
    const f = (d) => parseIso(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'long', year: 'numeric' });
    html += `<p class="hint" style="margin:-4px 0 12px">${sd.length ? `Aucun quart (QM, QAM, QN) noté ce jour-là dans ton planning. Le planning lu a des quarts du ${f(sd[0])} au ${f(sd[sd.length - 1])}.` : 'Aucun quart dans le planning lu : rechoisis ton fichier de planning dans Réglages pour voir les équipes de quart.'}</p>`;
  }
  html += onShift.length ? `<div class="teams">${onShift.map(teamCard).join('')}</div>` : '<p class="hint">Aucune équipe en quart matin, après-midi ou nuit ce jour-là.</p>';
  if (rest.length) {
    const n = rest.reduce((k, [, m]) => k + m.length, 0);
    html += `<details class="other-teams"${ui.openRest ? ' open' : ''}><summary><span class="ot-text"><b>Autres équipes · ${rest.length} équipe${rest.length > 1 ? 's' : ''}, ${n} personne${n > 1 ? 's' : ''}</b><small>${esc(rest.map(([t]) => t).join(', '))} · pas en quart matin, après-midi ou nuit</small></span></summary><div class="teams" style="margin-top:12px">${rest.map(teamCard).join('')}</div></details>`;
  }
  if (noTeam.length) {
    const nAbs = noTeam.filter((p) => absent.has(p.id)).length;
    html += `<button class="btn ghost" data-action="no-team" style="margin-top:12px">Sans équipe · ${noTeam.length} personne${noTeam.length > 1 ? 's' : ''}${nAbs ? ` (${nAbs} absent${nAbs > 1 ? 's' : ''})` : ''}</button>`;
  }

  if (!absent.size) return html + `<p class="hint" style="margin-top:14px">${state.links.plan || Object.keys(state.absImport || {}).length ? 'Personne n’est absent ce jour-là dans le planning.' : 'Aucun planning raccordé : va dans Réglages pour choisir ton planning Excel.'}</p>`;

  // Postes que plus personne de présent ne sait tenir (le détail est dans la fiche de chaque absent).
  const uncovered = state.postes.filter((po) => state.people.some((p) => absent.has(p.id) && p.skills?.[po.id]) && !candidates(po.id, absent).length);
  if (uncovered.length) html += `<div class="summary"><span class="badge red">${uncovered.length} poste${uncovered.length > 1 ? 's' : ''} sans remplaçant : ${esc(uncovered.map((p) => p.name).join(', '))}</span></div>`;
  return html;
}

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function renderTeam() {
  const nb = state.people.filter((p) => !p.planOnly).length;
  let html = `<h1 class="page">Équipe</h1><p class="sub">${nb} personne${nb > 1 ? 's' : ''}</p>`;
  const steps = firstSteps();
  if (steps && !state.people.length) return html + `<div style="margin-top:18px">${steps}</div>`;
  html += `
    <div class="chips" role="group" aria-label="Filtrer par rôle">
      <button class="chip" data-role-filter="all" aria-pressed="${ui.roleFilter === 'all'}">Tous</button>
      ${state.roles.map((r) => `<button class="chip" data-role-filter="${r.id}" aria-pressed="${ui.roleFilter === r.id}"><span class="lvl" style="width:12px;height:12px;border-radius:4px;background:${r.color}"></span>${esc(r.name)}</button>`).join('')}
    </div>
    <div class="grid" style="margin-top:14px" id="people-list">${peopleCards()}</div>`;
  return html;
}

function peopleCards() {
  const q = ui.query.trim().toLowerCase();
  const today = iso(new Date());
  const all = state.people
    .filter((p) => (ui.roleFilter === 'all' || p.role === ui.roleFilter) && (!q || p.name.toLowerCase().includes(q)))
    .sort((a, b) => shiftRank(a, today) - shiftRank(b, today) || byName(a, b));
  const list = all.filter((p) => !p.planOnly);
  const planOnly = all.filter((p) => p.planOnly && p.ambiguous);
  if (!all.length) return `<p class="hint">Personne ne correspond.</p>`;
  const others = planOnly.length
    ? `<div style="grid-column:1/-1"><div class="section-title">À vérifier dans le planning<small>${planOnly.length}</small></div>
        <p class="hint" style="margin:-4px 0 8px">Plusieurs personnes portent ce nom dans le fichier d’habilitations : ajoute l’initiale du prénom dans le planning (ex. « MARTIN E. »).</p>
        <div class="lvls-row">${planOnly.map((p) => `<span class="pchip"${p.ambiguous ? ' style="background:var(--danger-soft);color:var(--danger)" title="Plusieurs personnes portent ce nom"' : ''}>${esc(p.name)}${p.ambiguous ? ' (' + p.ambiguous.length + ' possibles)' : ''}${p.post ? ' · ' + esc(p.post) : ''}</span>`).join('')}</div></div>`
    : '';
  return others + list
    .map((p) => {
      const skills = Object.keys(p.skills || {}).filter((k) => poste(k) && level(p.skills[k]));
      return `<button class="card" data-person="${p.id}">${avHtml(p)}<div class="grow"><div class="card-title">${esc(p.name)}</div>
        <div class="card-meta">${esc([role(p.role)?.name, p.team, p.post && norm(p.post) !== norm(role(p.role)?.name) ? p.post : '', skills.length + ' poste' + (skills.length > 1 ? 's' : '')].filter(Boolean).join(' · '))}</div>
        ${skills.length ? `<div class="lvls-row">${skills.sort((a, b) => rank(p.skills[b]) - rank(p.skills[a]) || poste(a).name.localeCompare(poste(b).name, 'fr')).map((k) => `<span class="pchip">${lvlHtml(p.skills[k])}<span>${esc(poste(k).name)}</span></span>`).join('')}</div>` : ''}
      </div>${icons.chevron}</button>`;
    })
    .join('');
}

function renderPostes() {
  let html = `<h1 class="page">Postes</h1><p class="sub">Les habilitations de l’atelier, et qui sait tenir chaque poste.</p>
`;
  if (!state.postes.length) return html + `<div style="margin-top:14px">${firstSteps()}</div>`;
  const absent = absentOn(iso(new Date()));
  const words = norm(ui.posteQuery).split(' ').filter(Boolean);
  const list = state.postes.filter((po) => words.every((w) => norm(po.name).includes(w)));
  if (words.length) html += `<p class="hint">${list.length ? `${list.length} poste${list.length > 1 ? 's' : ''} pour « ${esc(ui.posteQuery.trim())} »` : `Aucun poste ne s’appelle « ${esc(ui.posteQuery.trim())} ».`}</p>`;
  html += `<div class="grid" style="margin-top:14px">${list
    .map((po) => {
      const who = state.people.filter((p) => p.skills?.[po.id] && level(p.skills[po.id])).sort((a, b) => rank(b.skills[po.id]) - rank(a.skills[po.id]));
      const counts = state.levels.map((lv) => [lv, who.filter((p) => p.skills[po.id] === lv.id).length]).filter(([, n]) => n);
      const present = who.filter((p) => !absent.has(p.id)).length;
      return `<button class="card" data-poste="${po.id}" style="align-items:flex-start"><div class="grow">
        <div class="card-title">${esc(po.name)}</div>
        <div class="card-meta">${po.training ? 'Formation : ' + esc(po.training) + ' · ' : ''}${who.length} habilité${who.length > 1 ? 's' : ''}</div>
        ${counts.length ? `<div class="lvls-row">${counts.map(([lv, n]) => `<span class="lvl-chip">${lvlHtml(lv.id)}${n}</span>`).join('')}</div>` : '<div class="lvls-row"><span class="badge red">Personne n’est habilité</span></div>'}
        ${who.length ? `<div class="lvls-row">${who.map((p) => `<span class="pchip"${absent.has(p.id) ? ' style="opacity:.5" title="Absent aujourd’hui"' : ''}>${lvlHtml(p.skills[po.id])}<span>${esc(p.name)}${absent.has(p.id) ? ' (absent)' : ''}</span></span>`).join('')}</div>` : ''}
        ${who.length && !present ? '<div class="lvls-row"><span class="badge red">Aucun habilité présent aujourd’hui</span></div>' : ''}
      </div>${icons.chevron}</button>`;
    })
    .join('')}</div>`;
  return html;
}

// Réglages : rôles et niveaux modifiables (pour ajouter ce qui manque), et sauvegarde.
function renderSettings() {
  return `<h1 class="page">Réglages</h1><p class="sub">L’appli est en lecture seule : tout se change dans les fichiers Excel, pour éviter les erreurs.</p>
    <p class="hint">Version de l’appli : ${READER_VERSION}</p>
    <div class="section-title">Fichiers Excel raccordés</div>
    ${linksHtml()}
    ${wordsHtml()}
    <div class="actions" style="margin-top:12px"><button class="btn danger" data-action="wipe">Effacer toutes les données de cet appareil</button></div>

    <div class="section-title">Niveaux</div>
    ${state.levels.map((lv) => `<div class="skill"><span class="skill-name">${esc(lv.desc)}</span>${levelTag(lv.id)}</div>`).join('')}
