<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Habilitations">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F1F4F8">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<title>Habilitations</title>
<style>
/* Un tableau de bord d'atelier : fond acier clair, fiches blanches, et les niveaux I · L · U
   dessinés comme sur la feuille de polyvalence (un trait, deux côtés, trois côtés d'un carré). */
:root {
  --bg: #F1F4F8;
  --card: #FFFFFF;
  --ink: #16202C;
  --ink-2: #4E5B6B;
  --ink-3: #626E7E;
  --line: rgba(22, 32, 44, .1);
  --accent: #1D5BD8;
  --accent-soft: #E6EEFC;
  --danger: #C2321F;
  --danger-soft: #FCEBE8;
  --ok: #17803D;
  --ok-soft: #E5F4EA;
  --warn: #B45309;
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body { background: var(--bg); color: var(--ink); font: 17px/1.4 var(--font); -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%; }
::selection { background: var(--accent); color: #fff; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
input, textarea { caret-color: var(--accent); }

#app { max-width: 1080px; margin: 0 auto; padding: env(safe-area-inset-top) max(16px, env(safe-area-inset-right)) calc(104px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
h1.page { font-size: 30px; line-height: 1.1; font-weight: 800; letter-spacing: -.02em; margin: 22px 0 4px; }
.sub { color: var(--ink-2); font-size: 15px; margin: 0; }
.section-title { font-size: 19px; font-weight: 800; margin: 28px 0 10px; display: flex; align-items: center; gap: 8px; }
.section-title small { color: var(--ink-3); font-weight: 700; font-size: 15px; }

/* Les niveaux I, L, U. */
.lvl { display: inline-flex; align-items: center; justify-content: center; width: 28px; height: 28px; border-radius: 8px; flex: 0 0 auto; }
.lvl svg { width: 18px; height: 18px; }
.lvl.letter { font-weight: 900; font-size: 14px; color: #fff; }
.lvl-tag { display: inline-flex; align-items: center; gap: 6px; padding: 4px 12px 4px 4px; border-radius: 12px; font-size: 16px; flex: 0 0 auto; }
.lvl-tag .lvl { background: transparent !important; }
.lvl-chip { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; }
.pchip { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 10px; padding: 3px 10px 3px 3px; font-weight: 700; font-size: 14px; max-width: 100%; }
.pchip .lvl { width: 24px; height: 24px; border-radius: 7px; }
.pchip .lvl svg { width: 15px; height: 15px; }
.pchip span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* Avatars. */
.av { width: 44px; height: 44px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-weight: 800; font-size: 17px; color: #fff; flex: 0 0 auto; position: relative; }
.av.small { width: 34px; height: 34px; border-radius: 11px; font-size: 14px; }
.av.big { width: 64px; height: 64px; border-radius: 20px; font-size: 26px; }
.av.absent { filter: grayscale(1); opacity: .45; }

/* Cartes. */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 12px; }
.card { background: var(--card); border-radius: var(--radius); border: 1px solid var(--line); box-shadow: 0 1px 2px rgba(22, 32, 44, .04); }
button.card { text-align: left; width: 100%; padding: 14px; display: flex; gap: 12px; align-items: center; }
.card-title { font-weight: 800; font-size: 17px; line-height: 1.25; overflow-wrap: anywhere; }
.card-meta { color: var(--ink-2); font-size: 14px; margin-top: 2px; }
.card .grow { flex: 1; min-width: 0; }
.chevron { color: var(--ink-3); width: 18px; height: 18px; flex: 0 0 auto; }
.lvls-row { display: flex; gap: 4px; flex-wrap: wrap; margin-top: 8px; }
.face-row { display: flex; margin-top: 10px; }
.face-row .av { box-shadow: 0 0 0 2px var(--card); }
.face-row { gap: 4px; flex-wrap: wrap; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 800; padding: 3px 9px; border-radius: 999px; }
.badge.red { background: var(--danger-soft); color: var(--danger); }
.badge.green { background: var(--ok-soft); color: var(--ok); }
.badge.grey { background: var(--bg); color: var(--ink-2); }

/* Recherche et filtres. */
.search { width: 100%; height: 50px; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 0 14px 0 42px; font-size: 17px; }
.search-wrap { position: relative; margin-top: 14px; }
.search-wrap svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--ink-3); }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; margin: 12px -16px 0; padding: 0 16px 2px; }
.chips::-webkit-scrollbar { display: none; }
.chip { flex: 0 0 auto; min-height: 42px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: #fff; }

/* Aujourd'hui. */
.date-row { display: flex; gap: 10px; align-items: center; margin-top: 14px; flex-wrap: wrap; }
.date-input { height: 46px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); padding: 0 12px; font-size: 16px; }
.people-pick { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; margin-top: 12px; }
.pick { background: var(--card); border: 1.5px solid var(--line); border-radius: 16px; padding: 10px 6px 8px; display: flex; flex-direction: column; align-items: center; gap: 6px; font-weight: 700; font-size: 14px; min-height: 96px; }
.pick > span:not(.av) { max-width: 100%; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; text-align: center; line-height: 1.2; overflow-wrap: anywhere; }
.pick[aria-pressed="true"] { border-color: var(--danger); background: var(--danger-soft); color: var(--danger); }
.pick[aria-pressed="true"] .av { filter: grayscale(1); opacity: .5; }
.summary { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 14px; }
.absent-card { padding: 14px; }
.absent-head { display: flex; align-items: center; gap: 12px; }
.replace { margin-top: 12px; border-top: 1px solid var(--line); padding-top: 10px; display: flex; flex-direction: column; gap: 10px; }
.replace-row { display: flex; gap: 10px; align-items: flex-start; }
.replace-poste { width: 120px; flex: 0 0 auto; font-weight: 700; font-size: 15px; padding-top: 6px; overflow-wrap: anywhere; display: flex; gap: 6px; align-items: flex-start; }
.cands { display: flex; flex-wrap: wrap; gap: 6px; flex: 1; min-width: 0; }
.cand { display: inline-flex; align-items: center; gap: 6px; background: var(--bg); border-radius: 999px; padding: 3px 10px 3px 3px; font-weight: 700; font-size: 14px; border: 0; }
.cand .lvl { width: 24px; height: 24px; border-radius: 999px; }
.cand .lvl svg { width: 15px; height: 15px; }
.nobody { color: var(--danger); font-weight: 800; font-size: 14px; padding-top: 6px; }

/* Fiche (feuille qui monte du bas, panneau centré sur ordinateur). */
.sheet-back { position: fixed; inset: 0; background: rgba(22, 32, 44, .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--bg); width: 100%; max-width: 620px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 0 max(16px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); animation: rise .28s cubic-bezier(.16, 1, .3, 1); }
@media (min-width: 760px) { .sheet-back { align-items: center; } .sheet { border-radius: 26px; max-height: 86%; } }
@keyframes rise { from { transform: translateY(32px); opacity: .5; } }
.band { width: 40px; height: 5px; border-radius: 3px; background: rgba(22, 32, 44, .18); margin: 10px auto 0; }
.sheet-head { display: flex; gap: 14px; align-items: center; padding-top: 14px; }
.sheet-head h2 { margin: 0; font-size: 23px; line-height: 1.15; font-weight: 800; overflow-wrap: anywhere; }
.sheet-head p { margin: 3px 0 0; color: var(--ink-2); font-size: 15px; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(22, 32, 44, .08); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; margin-left: auto; padding: 0; align-self: flex-start; }
.close svg { width: 16px; height: 16px; }
.label { display: block; font-weight: 800; font-size: 15px; margin: 20px 0 8px; color: var(--ink); }
.field { width: 100%; min-height: 50px; border-radius: 14px; border: 1.5px solid var(--line); background: var(--card); padding: 10px 14px; font-size: 17px; }
.field::placeholder, .search::placeholder { color: var(--ink-3); }
.row-wrap { display: flex; flex-wrap: wrap; gap: 8px; }

/* Une habilitation dans la fiche : poste + sélecteur de niveau. */
.skill { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 10px 10px 14px; }
.skill + .skill { margin-top: 8px; }
.skill-name { flex: 1; min-width: 0; font-weight: 700; overflow-wrap: anywhere; }
.skill-name small { display: block; color: var(--ink-3); font-weight: 600; font-size: 13px; }
.seg { display: flex; background: var(--bg); border-radius: 12px; padding: 3px; gap: 2px; flex: 0 0 auto; }
.seg button { min-width: 44px; height: 40px; border: 0; background: none; border-radius: 9px; display: flex; align-items: center; justify-content: center; padding: 0 6px; font-weight: 800; font-size: 14px; color: var(--ink-3); }
.seg button svg { width: 18px; height: 18px; }
.seg button[aria-pressed="true"] { background: var(--card); box-shadow: 0 1px 4px rgba(22, 32, 44, .18); }
.seg button.none[aria-pressed="true"] { color: var(--ink); }
.seg button:not([aria-pressed="true"]) svg { opacity: .35; }

/* Boutons. */
.btn { min-height: 52px; width: 100%; border: 0; border-radius: 15px; background: var(--accent); color: #fff; font-weight: 800; font-size: 17px; display: inline-flex; align-items: center; justify-content: center; gap: 8px; padding: 0 20px; }
.btn svg { width: 20px; height: 20px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); font-weight: 700; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid rgba(194, 50, 31, .35); font-weight: 700; }
.btn.small { width: auto; min-height: 44px; font-size: 15px; border-radius: 12px; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }
.empty { background: var(--card); border: 1.5px dashed rgba(22, 32, 44, .2); border-radius: var(--radius); padding: 22px 18px; text-align: center; color: var(--ink-2); }
.empty b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }
.empty .btn { margin-top: 14px; width: auto; }

/* Réglages. */
.set-row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 12px; }
.set-row + .set-row { margin-top: 8px; }
.set-row input { flex: 1; min-width: 0; height: 42px; border: 0; background: none; font-size: 16px; font-weight: 700; }
.icon-btn { width: 42px; height: 42px; border-radius: 11px; border: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; padding: 0; color: var(--ink-2); flex: 0 0 auto; }
.icon-btn svg { width: 18px; height: 18px; }
.icon-btn:disabled { opacity: .35; }
.level-edit { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 12px; }
.level-edit + .level-edit { margin-top: 10px; }
.level-edit .top { display: flex; gap: 10px; align-items: center; }
.level-edit input.letter { width: 56px; height: 44px; text-align: center; font-weight: 900; font-size: 18px; border-radius: 10px; border: 1.5px solid var(--line); text-transform: uppercase; }
.level-edit textarea { width: 100%; margin-top: 8px; min-height: 60px; border-radius: 10px; border: 1.5px solid var(--line); padding: 8px 10px; font-size: 15px; resize: vertical; }
.hint { color: var(--ink-2); font-size: 14px; margin: 8px 0 0; }

/* Barre d'onglets : en bas sur téléphone, en haut sur ordinateur. */
.tabs { position: fixed; left: 8px; right: 8px; bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; background: rgba(255, 255, 255, .86); backdrop-filter: blur(20px) saturate(160%); -webkit-backdrop-filter: blur(20px) saturate(160%); border: 1px solid var(--line); border-radius: 24px; padding: 6px; z-index: 10; box-shadow: 0 10px 30px -12px rgba(22, 32, 44, .35); max-width: 640px; margin: 0 auto; }
.tabs button { flex: 1; min-width: 0; min-height: 56px; border: 0; background: none; border-radius: 18px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; font-weight: 800; color: var(--ink-3); }
.tabs svg { width: 23px; height: 23px; }
.tabs button[aria-selected="true"] { background: var(--accent-soft); color: var(--accent); }
@media (min-width: 900px) {
  .tabs { top: 14px; bottom: auto; left: 50%; right: auto; transform: translateX(-50%); width: 680px; }
  .tabs button { flex-direction: row; gap: 8px; font-size: 14px; min-height: 46px; }
  .tabs svg { width: 20px; height: 20px; }
  #app { padding-top: 76px; padding-bottom: 40px; }
}
/* Absences venant du planning Excel, et échéances. */
.abs-type { font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 999px; color: #fff; }
.pick .abs-type { margin-top: -2px; }
.ech-row { display: flex; align-items: center; gap: 12px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; }
.ech-row + .ech-row { margin-top: 8px; }
.ech-row .grow { flex: 1; min-width: 0; }
.ech-date { font-weight: 800; font-size: 14px; padding: 4px 10px; border-radius: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.ech-date.red { background: var(--danger-soft); color: var(--danger); }
.ech-date.orange { background: #FDF0DC; color: var(--warn); }
.ech-date.green { background: var(--ok-soft); color: var(--ok); }
.ech-date.none { background: var(--bg); color: var(--ink-3); }
.ech-edit { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 8px 8px 8px 14px; }
.ech-edit + .ech-edit { margin-top: 8px; }
.ech-edit .grow { flex: 1; min-width: 0; font-weight: 700; }
.ech-edit input { height: 42px; border-radius: 10px; border: 1.5px solid var(--line); padding: 0 8px; font-size: 15px; background: var(--card); }
.link-card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 14px; }
.link-card + .link-card { margin-top: 10px; }
.link-card b { display: block; font-size: 16px; }
.link-state { font-size: 14px; color: var(--ink-2); margin: 4px 0 10px; }
.link-state.ok { color: var(--ok); font-weight: 700; }
.banner { display: flex; align-items: center; gap: 10px; background: var(--accent-soft); color: var(--accent); border-radius: 14px; padding: 10px 12px; margin-top: 14px; font-weight: 700; font-size: 15px; }
.banner .btn { width: auto; min-height: 40px; font-size: 14px; margin-left: auto; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: var(--ink); color: #fff; padding: 12px 18px; border-radius: 999px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .45); }

.btn, .chip, .pick, button.card, .seg button, .tabs button, .icon-btn, .close, .cand { transition: transform .14s cubic-bezier(.2, .8, .2, 1), background-color .15s ease-out, opacity .12s ease-out; }
.btn:active, .chip:active, .pick:active, button.card:active, .seg button:active, .tabs button:active, .icon-btn:active { transform: scale(.97); }
@media (hover: hover) { button.card:hover, .pick:hover { border-color: rgba(22, 32, 44, .25); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; } }
</style>
</head>
<body>
<div id="app"></div>
<nav class="tabs" role="tablist" aria-label="Sections">
  <button role="tab" data-tab="jour" aria-selected="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17"/><path d="M9 15l2 2 4-4"/></svg>Aujourd’hui</button>
  <button role="tab" data-tab="equipe" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0"/><circle cx="17.5" cy="9" r="2.5"/><path d="M16 14.2a5 5 0 0 1 6 4.8"/></svg>Équipe</button>
  <button role="tab" data-tab="postes" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="2"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="2"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="2"/></svg>Postes</button>
  <button role="tab" data-tab="echeances" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2.5M9 2h6"/></svg>Échéances</button>
  <button role="tab" data-tab="reglages" aria-selected="false"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2.2"/><circle cx="10" cy="17" r="2.2"/></svg>Réglages</button>
</nav>
<script>
'use strict';

// ---------- Données (gardées dans cet appareil) ----------

const STORE_KEY = 'habilitations-v1';
const ROLE_COLORS = ['#1D5BD8', '#B45309', '#0F766E', '#7C3AED', '#BE185D', '#4B5563', '#0369A1', '#A16207'];
const LEVEL_COLORS = ['#D97706', '#1D5BD8', '#17803D', '#7C3AED', '#BE185D', '#0F766E'];

function defaultState() {
  return {
    version: 1,
    roles: [
      { id: 'r1', name: 'Opérateur', color: '#1D5BD8' },
      { id: 'r2', name: 'Alternant', color: '#B45309' },
      { id: 'r3', name: 'Technicien', color: '#0F766E' },
      { id: 'r4', name: 'Manageur', color: '#7C3AED' },
    ],
    // Du plus bas au plus haut : l'ordre sert à proposer les meilleurs remplaçants d'abord.
    levels: [
      { id: 'I', letter: 'I', shape: 'I', color: '#D97706', desc: 'Connaissance de base. Opérationnel, mais peut avoir besoin d’aide.' },
      { id: 'L', letter: 'L', shape: 'L', color: '#1D5BD8', desc: 'Poste maîtrisé.' },
      { id: 'U', letter: 'U', shape: 'U', color: '#17803D', desc: 'Poste maîtrisé, et sait former et transmettre.' },
    ],
    postes: [],
    people: [],
    absences: {},
    // Habilitations à date (microbio, ZEC, CACES…) : chaque personne a une date d'échéance.
    echeances: [],
    // Absences lues dans le planning Excel : { jour: { personne: { type, note } } }.
    absImport: {},
    links: {},
  };
}

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (raw) return { ...defaultState(), ...JSON.parse(raw) };
  } catch (e) {}
  return defaultState();
}

let state = load();
let ui = { tab: 'jour', day: iso(new Date()), query: '', roleFilter: 'all' };

function save() {
  try {
    localStorage.setItem(STORE_KEY, JSON.stringify(state));
  } catch (e) {
    toast('Impossible d’enregistrer sur cet appareil.');
  }
}

const uid = (p) => p + Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const person = (id) => state.people.find((p) => p.id === id);
const poste = (id) => state.postes.find((p) => p.id === id);
const role = (id) => state.roles.find((r) => r.id === id);
const level = (id) => state.levels.find((l) => l.id === id);
const rank = (id) => state.levels.findIndex((l) => l.id === id);
const byName = (a, b) => a.name.localeCompare(b.name, 'fr');

// ---------- Petits outils ----------

function iso(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
const parseIso = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const initials = (name) =>
  String(name || '?')
    .trim()
    .split(/\s+/)
    .slice(0, 2)
    .map((w) => w.charAt(0).toUpperCase())
    .join('');

let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

const icons = {
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  close: '<svg viewBox="0 0 22 22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l14 14M18 4L4 18"/></svg>',
  chevron: '<svg class="chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  search: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5l5 5"/></svg>',
  up: '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 13l6-6 6 6"/></svg>',
  trash: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  swap: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 4L3 8l4 4M3 8h14M17 20l4-4-4-4M21 16H7"/></svg>',
};

// Le dessin du niveau : I = un côté, L = deux côtés, U = trois côtés d'un carré.
function levelSvg(lv, color) {
  const c = color || lv.color;
  const paths = { I: 'M5 3v14', L: 'M5 3v14h10', U: 'M5 3v14h10V3' };
  return `<svg viewBox="0 0 20 20" fill="none" stroke="${c}" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="${paths[lv.shape]}"/></svg>`;
}

function lvlHtml(id) {
  const lv = level(id);
  if (!lv) return '';
  if (lv.shape && lv.shape !== 'letter') return `<span class="lvl" style="background:${lv.color}1A" title="${esc(lv.letter)} : ${esc(lv.desc)}" aria-label="Niveau ${esc(lv.letter)}">${levelSvg(lv)}</span>`;
  return `<span class="lvl letter" style="background:${lv.color}" title="${esc(lv.letter)} : ${esc(lv.desc)}" aria-label="Niveau ${esc(lv.letter)}">${esc(lv.letter)}</span>`;
}

function avHtml(p, cls = '') {
  const r = role(p.role);
  return `<span class="av ${cls}" style="background:${r?.color || '#4B5563'}" aria-hidden="true">${esc(initials(p.name))}</span>`;
}

const absentOn = (day) => new Set(Object.keys(state.absImport?.[day] || {}));
const absInfo = (day, id) => state.absImport?.[day]?.[id] || null;
const ABS_COLORS = { conge: '#3F8F1F', 'conge annuel': '#3F8F1F', rtt: '#7C3AED', arret: '#C2321F', absence: '#0A84C6', formation: '#B4581E', autre: '#4B5563' };
const absColor = (type) => ABS_COLORS[norm(type).replace(/s$/, '')] || ABS_COLORS[Object.keys(ABS_COLORS).find((k) => norm(type).startsWith(norm(k)))] || '#4B5563';
const absBadge = (info) => (info ? `<span class="abs-type" style="background:${absColor(info.type)}">${esc(info.type)}</span>` : '');
const norm = (t) => String(t ?? '').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();

// Qui peut tenir ce poste (en dehors de certaines personnes), les plus habiles d'abord.
function candidates(posteId, exclude) {
  return state.people
    .filter((p) => !exclude.has(p.id) && p.skills?.[posteId] && level(p.skills[posteId]))
    .sort((a, b) => rank(b.skills[posteId]) - rank(a.skills[posteId]) || byName(a, b));
}

// ---------- Écrans ----------

const app = document.getElementById('app');

function render() {
  document.querySelectorAll('.tabs button').forEach((b) => b.setAttribute('aria-selected', String(b.dataset.tab === ui.tab)));
  const screens = { jour: renderToday, equipe: renderTeam, postes: renderPostes, echeances: renderEcheances, reglages: renderSettings };
  app.innerHTML = screens[ui.tab]();
  bind();
}

function firstSteps() {
  if (!state.postes.length)
    return `<div class="empty"><b>L’appli est vide sur cet appareil</b>Charge tes fichiers Excel (Réglages › Fichiers Excel raccordés), ou essaie d’abord avec l’exemple : 29 personnes inventées, leurs habilitations et le planning de l’année.<br><button class="btn" data-action="demo">Charger l’exemple</button><br><button class="btn ghost" data-tab-go="reglages" style="margin-top:8px">Raccorder mes fichiers Excel</button></div>`;
  if (!state.people.length)
    return `<div class="empty"><b>Pas encore d’équipe</b>L’équipe vient de ton fichier Excel d’habilitations.<br><button class="btn" data-tab-go="reglages">Raccorder mon fichier</button></div>`;
  return '';
}

// Aujourd'hui : on coche les absents, l'appli propose des remplaçants pour chacun de leurs postes.
function renderToday() {
  const day = ui.day;
  const d = parseIso(day);
  const isToday = day === iso(new Date());
  let html = `<h1 class="page">${isToday ? 'Aujourd’hui' : esc(cap(d.toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' })))}</h1>
    <p class="sub">Les absents du jour viennent de ton planning Excel. L’appli te dit qui peut les remplacer.</p>
    <div class="date-row"><input type="date" class="date-input" id="day" value="${day}" aria-label="Choisir le jour">${isToday ? '' : '<button class="btn ghost small" data-action="today">Revenir à aujourd’hui</button>'}</div>
    ${linkBanner()}`;
  const steps = firstSteps();
  if (steps) return html + `<div style="margin-top:18px">${steps}</div>`;

  const absent = absentOn(day);
  const people = state.people.slice().sort(byName);
  html += `<div class="section-title">L’équipe ce jour-là<small>${absent.size ? absent.size + ' absent' + (absent.size > 1 ? 's' : '') : ''}</small></div>
    <div class="people-pick">${people
      .map((p) => `<button class="pick" data-absent="${p.id}" aria-pressed="${absent.has(p.id)}">${avHtml(p)}<span>${esc(p.name)}</span>${absBadge(absInfo(day, p.id))}</button>`)
      .join('')}</div>`;

  if (!absent.size) return html + `<p class="hint" style="margin-top:14px">${state.links.plan || Object.keys(state.absImport || {}).length ? 'Personne n’est absent ce jour-là dans le planning.' : 'Aucun planning raccordé : va dans Réglages pour choisir ton planning Excel.'}</p>`;

  // Postes que plus personne de présent ne sait tenir.
  const uncovered = state.postes.filter((po) => state.people.some((p) => absent.has(p.id) && p.skills?.[po.id]) && !candidates(po.id, absent).length);
  html += `<div class="summary">${uncovered.length ? `<span class="badge red">${uncovered.length} poste${uncovered.length > 1 ? 's' : ''} sans remplaçant : ${esc(uncovered.map((p) => p.name).join(', '))}</span>` : '<span class="badge green">Tous les postes ont un remplaçant possible</span>'}</div>
    <div class="section-title">Remplaçants possibles</div><div class="grid">`;
  for (const id of absent) {
    const p = person(id);
    if (!p) continue;
    const skills = Object.keys(p.skills || {}).filter((k) => poste(k) && level(p.skills[k]));
    html += `<div class="card absent-card"><div class="absent-head">${avHtml(p, 'absent')}<div class="grow"><div class="card-title">${esc(p.name)}</div><div class="card-meta">${esc(p.post || role(p.role)?.name || '')} · ${absInfo(day, p.id) ? esc(absInfo(day, p.id).type) + (absInfo(day, p.id).note ? ' (' + esc(absInfo(day, p.id).note) + ')' : '') : 'absent'}</div></div></div>
      <div class="replace">${
        skills.length
          ? skills
              .map((k) => poste(k))
              .sort(byName)
              .map((po) => {
                const c = candidates(po.id, absent);
                return `<div class="replace-row"><div class="replace-poste">${lvlHtml(p.skills[po.id])}<span style="padding-top:3px">${esc(po.name)}</span></div>${
                  c.length
                    ? `<div class="cands">${c.slice(0, 3).map((x) => `<button class="cand" data-person="${x.id}">${lvlHtml(x.skills[po.id])}${esc(x.name)}</button>`).join('')}${c.length > 3 ? `<button class="badge grey" data-poste="${po.id}" style="border:0">+${c.length - 3} autres</button>` : ''}</div>`
                    : '<div class="nobody">Personne de disponible</div>'
                }</div>`;
              })
              .join('')
          : '<p class="hint" style="margin:0">Aucune habilitation renseignée pour cette personne.</p>'
      }</div></div>`;
  }
  return html + `</div>`;
}

const cap = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function renderTeam() {
  let html = `<h1 class="page">Équipe</h1><p class="sub">${state.people.length} personne${state.people.length > 1 ? 's' : ''}</p>`;
  const steps = firstSteps();
  if (steps && !state.people.length) return html + `<div style="margin-top:18px">${steps}</div>`;
  html += `<div class="search-wrap">${icons.search}<input class="search" id="q" type="search" placeholder="Chercher une personne" value="${esc(ui.query)}" autocomplete="off" aria-label="Chercher une personne"></div>
    <div class="chips" role="group" aria-label="Filtrer par rôle">
      <button class="chip" data-role-filter="all" aria-pressed="${ui.roleFilter === 'all'}">Tous</button>
      ${state.roles.map((r) => `<button class="chip" data-role-filter="${r.id}" aria-pressed="${ui.roleFilter === r.id}"><span class="lvl" style="width:12px;height:12px;border-radius:4px;background:${r.color}"></span>${esc(r.name)}</button>`).join('')}
    </div>
    <div class="grid" style="margin-top:14px" id="people-list">${peopleCards()}</div>`;
  return html;
}

function peopleCards() {
  const q = ui.query.trim().toLowerCase();
  const list = state.people
    .filter((p) => (ui.roleFilter === 'all' || p.role === ui.roleFilter) && (!q || p.name.toLowerCase().includes(q)))
    .sort(byName);
  if (!list.length) return `<p class="hint">Personne ne correspond.</p>`;
  return list
    .map((p) => {
      const skills = Object.keys(p.skills || {}).filter((k) => poste(k) && level(p.skills[k]));
      return `<button class="card" data-person="${p.id}">${avHtml(p)}<div class="grow"><div class="card-title">${esc(p.name)}</div>
        <div class="card-meta">${esc(role(p.role)?.name || 'Sans rôle')}${p.team ? ' · ' + esc(p.team) : ''}${p.post ? ' · ' + esc(p.post) : ''} · ${skills.length} poste${skills.length > 1 ? 's' : ''}</div>
        ${skills.length ? `<div class="lvls-row">${skills.sort((a, b) => rank(p.skills[b]) - rank(p.skills[a]) || poste(a).name.localeCompare(poste(b).name, 'fr')).map((k) => `<span class="pchip">${lvlHtml(p.skills[k])}<span>${esc(poste(k).name)}</span></span>`).join('')}</div>` : ''}
      </div>${icons.chevron}</button>`;
    })
    .join('');
}

function renderPostes() {
  let html = `<h1 class="page">Postes</h1><p class="sub">Les habilitations de l’atelier, et qui sait tenir chaque poste.</p>
`;
  if (!state.postes.length) return html + `<div style="margin-top:14px">${firstSteps()}</div>`;
  const absent = absentOn(iso(new Date()));
  html += `<div class="grid" style="margin-top:14px">${state.postes
    .map((po) => {
      const who = state.people.filter((p) => p.skills?.[po.id] && level(p.skills[po.id])).sort((a, b) => rank(b.skills[po.id]) - rank(a.skills[po.id]));
      const counts = state.levels.map((lv) => [lv, who.filter((p) => p.skills[po.id] === lv.id).length]).filter(([, n]) => n);
      const present = who.filter((p) => !absent.has(p.id)).length;
      return `<button class="card" data-poste="${po.id}" style="align-items:flex-start"><div class="grow">
        <div class="card-title">${esc(po.name)}</div>
        <div class="card-meta">${po.training ? 'Formation : ' + esc(po.training) + ' · ' : ''}${who.length} habilité${who.length > 1 ? 's' : ''}</div>
        ${counts.length ? `<div class="lvls-row">${counts.map(([lv, n]) => `<span class="lvl-chip">${lvlHtml(lv.id)}${n}</span>`).join('')}</div>` : '<div class="lvls-row"><span class="badge red">Personne n’est habilité</span></div>'}
        ${who.length ? `<div class="lvls-row">${who.map((p) => `<span class="pchip"${absent.has(p.id) ? ' style="opacity:.5" title="Absent aujourd’hui"' : ''}>${lvlHtml(p.skills[po.id])}<span>${esc(p.name)}${absent.has(p.id) ? ' (absent)' : ''}</span></span>`).join('')}</div>` : ''}
        ${who.length && !present ? '<div class="lvls-row"><span class="badge red">Aucun habilité présent aujourd’hui</span></div>' : ''}
      </div>${icons.chevron}</button>`;
    })
    .join('')}</div>`;
  return html;
}

// Réglages : rôles et niveaux modifiables (pour ajouter ce qui manque), et sauvegarde.
function renderSettings() {
  return `<h1 class="page">Réglages</h1><p class="sub">L’appli est en lecture seule : tout se change dans les fichiers Excel, pour éviter les erreurs.</p>
    <div class="section-title">Fichiers Excel raccordés</div>
    ${linksHtml()}
    <div class="section-title">Niveaux</div>
    ${state.levels.map((lv) => `<div class="skill"><span class="skill-name">${esc(lv.desc)}</span>${levelTag(lv.id)}</div>`).join('')}
    <div class="section-title">Rôles</div>
    <div class="row-wrap">${state.roles.map((r) => `<span class="chip" style="cursor:default"><span class="lvl" style="width:12px;height:12px;border-radius:4px;background:${r.color}"></span>${esc(r.name)}</span>`).join('')}</div>
    <p class="hint">Un rôle qui n’est pas dans la liste est ajouté tout seul s’il est écrit dans la colonne « Rôle » du fichier Excel.</p>`;
}

// ---------- Interactions ----------

function bind() {
  document.getElementById('day')?.addEventListener('change', (e) => {
    if (e.target.value) ui.day = e.target.value;
    render();
  });
  document.getElementById('q')?.addEventListener('input', (e) => {
    ui.query = e.target.value;
    document.getElementById('people-list').innerHTML = peopleCards();
  });
  document.getElementById('import-file')?.addEventListener('change', importBackup);
  app.querySelectorAll('[data-pick-excel]').forEach((el) =>
    el.addEventListener('change', async () => {
      const f = el.files[0];
      if (f) await importExcel(f, el.dataset.pickExcel, true);
      el.value = '';
    }),
  );
  // Réglages : on enregistre en tapant, sans tout redessiner (le clavier reste ouvert).
  app.querySelectorAll('[data-rename-role]').forEach((el) =>
    el.addEventListener('input', () => {
      role(el.dataset.renameRole).name = el.value.trim() || 'Sans nom';
      save();
    }),
  );
  app.querySelectorAll('[data-level-letter]').forEach((el) =>
    el.addEventListener('change', () => {
      const lv = level(el.dataset.levelLetter);
      lv.letter = el.value.trim().toUpperCase() || lv.letter;
      save();
      render();
    }),
  );
  app.querySelectorAll('[data-level-desc]').forEach((el) =>
    el.addEventListener('input', () => {
      level(el.dataset.levelDesc).desc = el.value;
      save();
    }),
  );
}

document.addEventListener('click', (e) => {
  if (e.target.closest('.sheet-back')) return;
  const tab = e.target.closest('.tabs button');
  if (tab) {
    ui.tab = tab.dataset.tab;
    render();
    return window.scrollTo(0, 0);
  }
  const ab = e.target.closest('[data-absent]');
  if (ab) return openPerson(ab.dataset.absent);
  if (false) {
    const list = new Set(state.absences[ui.day] || []);
    list.has(ab.dataset.absent) ? list.delete(ab.dataset.absent) : list.add(ab.dataset.absent);
    if (list.size) state.absences[ui.day] = [...list];
    else delete state.absences[ui.day];
    save();
    return render();
  }
  const p = e.target.closest('[data-person]');
  if (p) return openPerson(p.dataset.person);
  const po = e.target.closest('[data-poste]');
  if (po) return openPoste(po.dataset.poste);
  const rf = e.target.closest('[data-role-filter]');
  if (rf) {
    ui.roleFilter = rf.dataset.roleFilter;
    return render();
  }
  const settings = settingsClick(e);
  if (settings) return;
  const a = e.target.closest('[data-action]')?.dataset.action;
  if (a === 'add-person') openPersonEditor();
  else if (a === 'add-poste') openPosteEditor();
  else if (a === 'today') {
    ui.day = iso(new Date());
    render();
  } else if (a === 'export') exportBackup();
  else if (a === 'import') document.getElementById('import-file').click();
  else if (a === 'link-hab') linkFile('hab');
  else if (a === 'link-plan') linkFile('plan');
  else if (a === 'unlink-hab') unlinkFile('hab');
  else if (a === 'unlink-plan') unlinkFile('plan');
  else if (a === 'refresh-links') refreshLinks(true);
  else if (a === 'demo') loadDemo();
});

function settingsClick(e) {
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t('[data-up-role]'))) {
    const i = state.roles.findIndex((r) => r.id === el.dataset.upRole);
    [state.roles[i - 1], state.roles[i]] = [state.roles[i], state.roles[i - 1]];
  } else if ((el = t('[data-del-role]'))) {
    const r = role(el.dataset.delRole);
    const used = state.people.filter((p) => p.role === r.id).length;
    if (!confirm(`Supprimer le rôle « ${r.name} » ?${used ? ` ${used} personne${used > 1 ? 's' : ''} n’aura plus de rôle.` : ''}`)) return true;
    state.roles = state.roles.filter((x) => x.id !== r.id);
    state.people.forEach((p) => p.role === r.id && (p.role = ''));
  } else if (t('[data-action="add-role"]')) {
    state.roles.push({ id: uid('r'), name: 'Nouveau rôle', color: ROLE_COLORS[state.roles.length % ROLE_COLORS.length] });
  } else if ((el = t('[data-up-level]'))) {
    const i = state.levels.findIndex((l) => l.id === el.dataset.upLevel);
    [state.levels[i - 1], state.levels[i]] = [state.levels[i], state.levels[i - 1]];
  } else if ((el = t('[data-del-level]'))) {
    if (state.levels.length <= 1) return toast('Il faut garder au moins un niveau.'), true;
    const lv = level(el.dataset.delLevel);
    const used = state.people.filter((p) => Object.values(p.skills || {}).includes(lv.id)).length;
    if (!confirm(`Supprimer le niveau « ${lv.letter} » ?${used ? ` Les habilitations de ce niveau (${used} personne${used > 1 ? 's' : ''}) seront retirées.` : ''}`)) return true;
    state.levels = state.levels.filter((x) => x.id !== lv.id);
    state.people.forEach((p) => Object.keys(p.skills || {}).forEach((k) => p.skills[k] === lv.id && delete p.skills[k]));
  } else if (t('[data-action="add-level"]')) {
    const letters = 'ABCDEFGHJKMNOPQRSTVWXYZ'.split('').filter((c) => !state.levels.some((l) => l.letter === c));
    state.levels.push({ id: uid('l'), letter: letters[0] || '?', shape: 'letter', color: LEVEL_COLORS[state.levels.length % LEVEL_COLORS.length], desc: 'À décrire.' });
  } else return false;
  save();
  render();
  return true;
}

// ---------- Fiches ----------

function showSheet(inner) {
  closeSheet();
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="band"></div>${inner}</div>`;
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.closest('.close')) closeSheet();
  });
  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  return back;
}

function closeSheet() {
  document.querySelector('.sheet-back')?.remove();
  document.body.style.overflow = '';
}

const closeBtn = `<button class="close" aria-label="Fermer">${icons.close}</button>`;

// Le niveau affiché en grand dans les fiches (lecture seule).
function levelTag(id) {
  const lv = level(id);
  if (!lv) return '';
  return `<span class="lvl-tag" style="color:${lv.color};background:${lv.color}14" title="${esc(lv.desc)}">${lvlHtml(id)}<b>${esc(lv.letter)}</b></span>`;
}

// Sélecteur de niveau : —, I, L, U (et les niveaux ajoutés).
function segHtml(current, attr) {
  return `<div class="seg" role="group" aria-label="Niveau">
    <button class="none" data-${attr}="" aria-pressed="${!current}" aria-label="Pas habilité">–</button>
    ${state.levels
      .map((lv) => `<button data-${attr}="${lv.id}" aria-pressed="${current === lv.id}" aria-label="Niveau ${esc(lv.letter)}" title="${esc(lv.desc)}">${lv.shape && lv.shape !== 'letter' ? levelSvg(lv) : `<span style="color:${current === lv.id ? lv.color : 'inherit'}">${esc(lv.letter)}</span>`}</button>`)
      .join('')}
  </div>`;
}

// Fiche d'une personne : rôle, habilitations poste par poste, et qui peut la remplacer.
function openPerson(id) {
  const p = person(id);
  if (!p) return;
  p.skills = p.skills || {};
  const absent = absentOn(iso(new Date()));
  absent.add(p.id);
  const known = state.postes.filter((po) => p.skills[po.id] && level(p.skills[po.id]));
  const others = state.postes.filter((po) => !known.includes(po));
  let replaceHtml = '';
  if (known.length) {
    replaceHtml = `<span class="label">Qui peut remplacer ${esc(p.name)} ?</span><div class="card" style="padding:12px"><div class="replace" style="margin:0;border:0;padding:0">${known
      .map((po) => {
        const c = candidates(po.id, absent);
        return `<div class="replace-row"><div class="replace-poste">${lvlHtml(p.skills[po.id])}<span style="padding-top:3px">${esc(po.name)}</span></div>${c.length ? `<div class="cands">${c.slice(0, 6).map((x) => `<button class="cand" data-go-person="${x.id}">${lvlHtml(x.skills[po.id])}${esc(x.name)}</button>`).join('')}</div>` : '<div class="nobody">Personne</div>'}</div>`;
      })
      .join('')}</div></div><p class="hint">Sans compter les absents du jour.</p>`;
  }
  const back = showSheet(`<div class="sheet-head">${avHtml(p, 'big')}<div style="min-width:0"><h2>${esc(p.name)}</h2><p>${esc(role(p.role)?.name || 'Sans rôle')}${p.team ? ' · ' + esc(p.team) : ''} · ${known.length} poste${known.length > 1 ? 's' : ''}</p></div>${closeBtn}</div>
    ${p.post ? `<p class="hint">Poste habituel : <b>${esc(p.post)}</b></p>` : ''}
    <span class="label">Habilitations</span>
    ${known.length ? known.map((po) => skillRow(p, po)).join('') : '<p class="hint" style="margin:0">Aucune habilitation de poste dans le fichier.</p>'}
    ${state.echeances.length ? `<span class="label">Habilitations à date</span>${state.echeances
      .map((ec) => {
        const d = p.dates?.[ec.id] || '';
        return `<div class="ech-edit"><span class="grow">${esc(ec.name)}</span>${echDate(d)}</div>`;
      })
      .join('')}` : ''}
    ${replaceHtml}
    <p class="hint" style="margin-top:18px">Pour changer quelque chose, modifie le fichier Excel : l’appli se met à jour toute seule.</p>`);
  back.querySelectorAll('[data-ech]').forEach((el) =>
    el.addEventListener('change', () => {
      p.dates = p.dates || {};
      if (el.value) p.dates[el.dataset.ech] = el.value;
      else delete p.dates[el.dataset.ech];
      save();
      render();
      openPerson(p.id);
    }),
  );
  let confirmDel = false;
  back.addEventListener('click', (e) => {
    let el;
    if ((el = e.target.closest('[data-set-role]'))) {
      p.role = el.dataset.setRole;
    } else if ((el = e.target.closest('[data-skill]'))) {
      const [posteId, lv] = el.dataset.skill.split('|');
      if (lv) p.skills[posteId] = lv;
      else delete p.skills[posteId];
    } else if ((el = e.target.closest('[data-add-skill]'))) {
      // Nouvelle habilitation : on commence au premier niveau (I), à ajuster ensuite.
      p.skills[el.dataset.addSkill] = state.levels[0].id;
      toast(`${poste(el.dataset.addSkill).name} ajouté : choisis le niveau.`);
    } else if ((el = e.target.closest('[data-go-person]'))) {
      return openPerson(el.dataset.goPerson);
    } else if (e.target.closest('[data-edit]')) {
      return openPersonEditor(p.id);
    } else if ((el = e.target.closest('[data-del]'))) {
      if (!confirmDel) {
        confirmDel = true;
        el.textContent = 'Appuie encore pour confirmer';
        return;
      }
      state.people = state.people.filter((x) => x.id !== p.id);
      Object.keys(state.absences).forEach((d) => (state.absences[d] = state.absences[d].filter((x) => x !== p.id)));
      save();
      closeSheet();
      render();
      return toast(`${p.name} retiré de l’équipe.`);
    } else return;
    save();
    render();
    const y = back.querySelector('.sheet').scrollTop;
    openPerson(p.id);
    document.querySelector('.sheet').scrollTop = y;
  });
}

// ---------- Sauvegarde ----------

function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `habilitations-${iso(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Sauvegarde créée.');
}

function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.people) || !Array.isArray(data.postes) || !Array.isArray(data.levels)) throw new Error('format');
      if (!confirm('Remplacer les données de cet appareil par celles de la sauvegarde ?')) return;
      state = { ...defaultState(), ...data };
      save();
      render();
      toast('Sauvegarde récupérée !');
    } catch (err) {
      toast('Ce fichier n’est pas une sauvegarde des habilitations.');
    }
  };
  reader.readAsText(f);
}

// ---------- Échéances ----------

const DAY = 864e5;
function echStatus(d) {
  if (!d) return 'none';
  const left = (parseIso(d) - parseIso(iso(new Date()))) / DAY;
  return left < 0 ? 'red' : left <= 60 ? 'orange' : 'green';
}
const fmtDate = (d) => parseIso(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: 'numeric' });
function echDate(d) {
  if (!d) return '<span class="ech-date none">—</span>';
  const st = echStatus(d);
  const left = Math.round((parseIso(d) - parseIso(iso(new Date()))) / DAY);
  const label = st === 'red' ? `Expiré · ${fmtDate(d)}` : st === 'orange' ? `Dans ${left} j · ${fmtDate(d)}` : fmtDate(d);
  return `<span class="ech-date ${st}">${label}</span>`;
}

function renderEcheances() {
  let html = `<h1 class="page">Échéances</h1><p class="sub">Les habilitations à date : rouge = expirée, orange = à renouveler dans les 60 jours.</p>`;
  if (!state.echeances.length)
    return html + `<div class="empty" style="margin-top:18px"><b>Pas encore d’échéances</b>Raccorde ton fichier Excel d’habilitations dans « Réglages » : les dates (microbio, ZEC, BPF, CACES…) arrivent ici.<br><button class="btn" data-tab-go="reglages">Raccorder mon fichier</button></div>`;
  const all = [];
  state.people.forEach((p) => state.echeances.forEach((ec) => p.dates?.[ec.id] && all.push({ p, ec, d: p.dates[ec.id], st: echStatus(p.dates[ec.id]) })));
  all.sort((a, b) => a.d.localeCompare(b.d));
  const red = all.filter((x) => x.st === 'red');
  const orange = all.filter((x) => x.st === 'orange');
  const green = all.filter((x) => x.st === 'green');
  const row = (x) => `<button class="ech-row" data-person="${x.p.id}" style="width:100%;text-align:left">${avHtml(x.p, 'small')}<span class="grow"><span class="card-title" style="font-size:16px;display:block">${esc(x.p.name)}</span><span class="card-meta">${esc(x.ec.name)}</span></span>${echDate(x.d)}</button>`;
  html += `<div class="summary"><span class="badge red">${red.length} expirée${red.length > 1 ? 's' : ''}</span><span class="badge" style="background:#FDF0DC;color:var(--warn)">${orange.length} bientôt</span><span class="badge green">${green.length} valide${green.length > 1 ? 's' : ''}</span></div>`;
  if (red.length) html += `<div class="section-title">Expirées</div>${red.map(row).join('')}`;
  if (orange.length) html += `<div class="section-title">À renouveler bientôt</div>${orange.map(row).join('')}`;
  if (!red.length && !orange.length) html += `<p class="hint" style="margin-top:14px">Tout est à jour.</p>`;
  html += `<div class="section-title">Par habilitation</div><div class="grid">${state.echeances
    .map((ec) => {
      const list = all.filter((x) => x.ec.id === ec.id);
      const r = list.filter((x) => x.st === 'red').length;
      const o = list.filter((x) => x.st === 'orange').length;
      return `<div class="card" style="padding:14px"><div class="card-title">${esc(ec.name)}</div><div class="card-meta">${list.length} personne${list.length > 1 ? 's' : ''}${ec.every ? ' · ' + esc(ec.every) : ''}</div>
        <div class="lvls-row">${r ? `<span class="badge red">${r} expirée${r > 1 ? 's' : ''}</span>` : ''}${o ? `<span class="badge" style="background:#FDF0DC;color:var(--warn)">${o} bientôt</span>` : ''}${!r && !o && list.length ? '<span class="badge green">À jour</span>' : ''}</div></div>`;
    })
    .join('')}</div>`;
  return html;
}

// ---------- Fichiers Excel raccordés ----------
// Sur ordinateur (Chrome / Edge), l'appli garde un lien vers le fichier et le relit toute seule
// dès qu'il est enregistré. Ailleurs (iPhone), on choisit le fichier à chaque mise à jour.

const canLink = 'showOpenFilePicker' in window;
const handles = {};
let linkNeedsTap = false;

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('habilitations-fichiers', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('h', mode);
    const req = fn(tx.objectStore('h'));
    tx.oncomplete = () => resolve(req?.result);
    tx.onerror = () => reject(tx.error);
  });
}

const KIND_NAME = { hab: 'Habilitations', plan: 'Planning des absences' };

function linksHtml() {
  const card = (kind, desc) => {
    const l = state.links[kind];
    const st = l ? `<p class="link-state ok">Raccordé : ${esc(l.name)} · lu le ${new Date(l.at).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' })}</p>` : `<p class="link-state">${desc}</p>`;
    const pick = canLink
      ? `<button class="btn${l ? ' ghost' : ''}" data-action="link-${kind}">${l ? 'Changer de fichier' : 'Raccorder le fichier'}</button>`
      : `<label class="btn${l ? ' ghost' : ''}" style="cursor:pointer">${l ? 'Mettre à jour avec le fichier' : 'Choisir le fichier'}<input type="file" accept=".xlsx,.xls,.xlsm,.csv" data-pick-excel="${kind}" hidden></label>`;
    return `<div class="link-card"><b>${KIND_NAME[kind]}</b>${st}<div class="actions" style="margin-top:0">${pick}${l ? `<button class="btn ghost" data-action="unlink-${kind}">Ne plus raccorder</button>` : ''}</div></div>`;
  };
  return `<p class="hint" style="margin:-4px 0 12px">${canLink ? 'Sur cet ordinateur, l’appli relit tes fichiers toute seule dès que tu les enregistres dans Excel.' : 'Sur ce téléphone, choisis le fichier à chaque fois que tu veux mettre l’appli à jour. Sur un ordinateur (Chrome ou Edge), la mise à jour est automatique.'} Les fichiers restent sur ton appareil : rien n’est envoyé sur internet.</p>
    ${card('hab', 'Ton fichier : nom, prénom, rôle, postes en I / L / U et dates d’échéance.')}
    ${card('plan', 'Ton planning annuel : un onglet par mois, une ligne par personne, et un code par jour (CA, RTT, ABS, For).')}`;
}

function linkBanner() {
  if (!linkNeedsTap) return '';
  return `<div class="banner">Tes fichiers Excel ont peut-être changé.<button class="btn" data-action="refresh-links">Mettre à jour</button></div>`;
}

async function linkFile(kind) {
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'], 'application/vnd.ms-excel': ['.xls'] } }] });
    handles[kind] = h;
    // Le lien est gardé pour relire le fichier aux prochaines ouvertures.
    await idbDo('readwrite', (st) => st.put(h, kind)).catch(() => {});
    await importExcel(await h.getFile(), kind, true);
  } catch (e) {
    if (e.name !== 'AbortError') toast('Impossible d’ouvrir ce fichier.');
  }
}

async function unlinkFile(kind) {
  delete handles[kind];
  delete state.links[kind];
  if (kind === 'plan') state.absImport = {};
  save();
  try {
    await idbDo('readwrite', (st) => st.delete(kind));
  } catch (e) {}
  render();
  toast('Fichier détaché. Les données déjà importées restent dans l’appli.');
}

// Relit les fichiers raccordés s'ils ont changé depuis la dernière lecture.
async function refreshLinks(fromTap) {
  if (!canLink) return;
  let needTap = false;
  for (const kind of ['hab', 'plan']) {
    if (!state.links[kind]) continue;
    try {
      if (!handles[kind]) handles[kind] = await idbDo('readonly', (st) => st.get(kind));
      const h = handles[kind];
      if (!h) continue;
      let perm = await h.queryPermission({ mode: 'read' });
      if (perm !== 'granted' && fromTap) perm = await h.requestPermission({ mode: 'read' });
      if (perm !== 'granted') {
        needTap = true;
        continue;
      }
      const f = await h.getFile();
      if (fromTap || f.lastModified !== state.links[kind].modified) await importExcel(f, kind, fromTap);
    } catch (e) {
      if (fromTap) toast(`Impossible de relire « ${state.links[kind].name} ». Raccorde-le à nouveau dans Réglages.`);
    }
  }
  if (needTap !== linkNeedsTap) {
    linkNeedsTap = needTap;
    if (!document.querySelector('.sheet-back')) render();
  }
}

let xlsxWait;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxWait)
    xlsxWait = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => {
        xlsxWait = null;
        reject(new Error('xlsx'));
      };
      document.head.appendChild(s);
    });
  return xlsxWait;
}

async function importExcel(file, kind, verbose) {
  try {
    await loadXlsx();
  } catch (e) {
    return toast('Il faut internet la première fois pour lire les fichiers Excel.');
  }
  let wb;
  try {
    wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  } catch (e) {
    return toast('Ce fichier n’est pas un fichier Excel lisible.');
  }
  const report = kind === 'plan' ? importPlanning(wb) : importHabilitations(wb);
  if (!report) return toast(kind === 'plan' ? 'Je ne trouve pas les colonnes Nom, Prénom, Type, Du, Au dans ce fichier.' : 'Je ne trouve pas les colonnes Nom et Prénom dans ce fichier.');
  state.links[kind] = { name: file.name, at: Date.now(), modified: file.lastModified };
  save();
  render();
  if (verbose) toast(report);
  else toast(`${KIND_NAME[kind]} mis à jour depuis Excel.`);
}

const sheetRows = (ws) => XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
const cellText = (v) => (v instanceof Date ? '' : String(v ?? '').replace(/\s+/g, ' ').trim());
const isDate = (v) => v instanceof Date && !isNaN(v);
function toIso(v) {
  if (isDate(v)) return iso(new Date(v.getTime() + 12 * 3600e3));
  const m = String(v ?? '').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return '';
  const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
}

// La ligne des titres : celle qui contient « Nom » et « Prénom ».
function findHeader(rows, also = []) {
  for (let r = 0; r < Math.min(rows.length, 30); r++) {
    const t = (rows[r] || []).map((v) => norm(cellText(v)));
    if (t.includes('nom') && t.includes('prenom') && also.every((a) => t.some((x) => x === a || x.startsWith(a)))) return r;
  }
  return -1;
}

const personKey = (prenom, nom) => norm(`${prenom} ${nom}`);
function findOrCreatePerson(nom, prenom) {
  const k = personKey(prenom, nom);
  const k2 = personKey(nom, prenom);
  let p = state.people.find((x) => x.key === k || norm(x.name) === k || norm(x.name) === k2);
  if (!p) {
    p = { id: uid('p'), name: `${cap(prenom.toLowerCase())} ${nom.toUpperCase()}`.trim(), role: state.roles[0]?.id || '', skills: {} };
    state.people.push(p);
  }
  p.key = k;
  return p;
}

const LEVEL_WORDS = { utilisateur: 'L', 'a initier': 'I', initier: 'I', formateur: 'U', tuteur: 'U' };
function levelFromCell(v) {
  const t = norm(cellText(v));
  if (!t) return null;
  const lv = state.levels.find((l) => norm(l.letter) === t);
  if (lv) return lv.id;
  const w = LEVEL_WORDS[t];
  return w && level(w) ? w : undefined;
}

const META = ['nom', 'prenom', 'visa', 'equipe', 'animateur', 'role', 'fonction', 'type', 'statut', 'matricule', 'mail', 'email'];
const GENERIC = /^(date.*|echeance|1 fois.*|tous les.*|)$/;

function importHabilitations(wb) {
  let nPeople = 0;
  let nSkills = 0;
  let nDates = 0;
  let found = false;
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    const h = findHeader(rows);
    if (h < 0) continue;
    found = true;
    const head = rows[h].map((v) => norm(cellText(v)));
    const col = (k) => head.findIndex((x) => x === k || x.startsWith(k));
    const cNom = col('nom');
    const cPre = col('prenom');
    const cRole = head.findIndex((x) => x === 'role' || x === 'fonction');
    const cTeam = col('equipe');
    const data = rows.slice(h + 1).filter((r) => r && cellText(r[cNom]) && cellText(r[cPre]));
    if (!data.length) continue;
    const width = Math.max(...rows.slice(0, h + 1 + data.length).map((r) => (r ? r.length : 0)));
    // Nom de chaque colonne : le titre, ou le texte au-dessus si le titre est « date ».
    const titleOf = (c) => {
      const own = cellText(rows[h]?.[c]);
      if (own && !GENERIC.test(norm(own))) return own.replace(/\s*\(tous les .*?\)\s*$/i, '').trim();
      // Titre sur deux lignes au-dessus (ex. « BROYEUR » puis « HOSO Micro »).
      const above = [h - 2, h - 1].filter((r) => r >= 0).map((r) => cellText(rows[r]?.[c])).filter((t) => t && !GENERIC.test(norm(t)));
      if (above.length) return above.join(' ');
      for (let r = h; r >= 0; r--) {
        const t = cellText(rows[r]?.[c]);
        if (t && !GENERIC.test(norm(t))) return t.replace(/\s*\(tous les .*?\)\s*$/i, '').trim();
      }
      return '';
    };
    const everyOf = (c) => {
      for (let r = h; r >= 0; r--) {
        const t = cellText(rows[r]?.[c]);
        const m = norm(t).match(/(1 fois tous les \d+ ans?|1 fois par an|tous les \d+ ans?|tous les ans)/);
        if (m) return m[1].replace(/^1 fois /, '').replace(/^tous les 1 an$/, 'tous les ans');
      }
      return '';
    };
    for (let c = 0; c < width; c++) {
      if (c === cNom || c === cPre || c === cRole || c === cTeam || META.includes(head[c])) continue;
      const vals = data.map((r) => r[c]);
      const title = titleOf(c);
      if (!title) continue;
      if (vals.some(isDate)) {
        let ec = state.echeances.find((x) => norm(x.name) === norm(title));
        if (!ec) state.echeances.push((ec = { id: uid('e'), name: title, every: everyOf(c) }));
        data.forEach((r) => {
          const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
          p.dates = p.dates || {};
          const d = toIso(r[c]);
          if (d) {
            p.dates[ec.id] = d;
            nDates++;
          } else delete p.dates[ec.id];
        });
      } else if (vals.some((v) => levelFromCell(v))) {
        let po = state.postes.find((x) => norm(x.name) === norm(title));
        if (!po) state.postes.push((po = { id: uid('po'), name: title, training: '' }));
        data.forEach((r) => {
          const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
          p.skills = p.skills || {};
          const lv = levelFromCell(r[c]);
          if (lv) {
            p.skills[po.id] = lv;
            nSkills++;
          } else if (lv === null) delete p.skills[po.id];
        });
      }
    }
    data.forEach((r) => {
      const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
      if (cTeam >= 0 && cellText(r[cTeam])) p.team = cellText(r[cTeam]);
      if (cRole >= 0 && cellText(r[cRole])) {
        const rn = cellText(r[cRole]);
        let ro = state.roles.find((x) => norm(x.name) === norm(rn));
        if (!ro) state.roles.push((ro = { id: uid('r'), name: rn, color: ROLE_COLORS[state.roles.length % ROLE_COLORS.length] }));
        p.role = ro.id;
      }
    });
    nPeople = Math.max(nPeople, data.length);
  }
  if (!found) return null;
  return `Importé : ${nPeople} personne${nPeople > 1 ? 's' : ''}, ${nSkills} habilitation${nSkills > 1 ? 's' : ''} de poste, ${nDates} date${nDates > 1 ? 's' : ''} d’échéance.`;
}

function importPlanning(wb) {
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    const h = findHeader(rows, ['type', 'du']);
    if (h < 0) continue;
    const head = rows[h].map((v) => norm(cellText(v)));
    const col = (k) => head.findIndex((x) => x === k || x.startsWith(k));
    const [cNom, cPre, cType, cDu, cAu] = ['nom', 'prenom', 'type', 'du', 'au'].map(col);
    const cNote = head.findIndex((x) => x.startsWith('comment') || x.startsWith('motif'));
    const abs = {};
    let n = 0;
    for (const r of rows.slice(h + 1)) {
      if (!r || !cellText(r[cNom]) || !cellText(r[cPre])) continue;
      const from = toIso(r[cDu]);
      const to = toIso(r[cAu]) || from;
      if (!from) continue;
      const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
      const info = { type: cellText(r[cType]) || 'Absent' };
      if (cNote >= 0 && cellText(r[cNote])) info.note = cellText(r[cNote]);
      for (let d = parseIso(from), i = 0; d <= parseIso(to) && i < 400; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), i++) {
        (abs[iso(d)] = abs[iso(d)] || {})[p.id] = info;
      }
      n++;
    }
    state.absImport = abs;
    return `Planning importé : ${n} absence${n > 1 ? 's' : ''}.`;
  }
  return importPlanningGrid(wb);
}

// Planning annuel « en grille » : un onglet par mois, une ligne par personne, un code par jour (CA, RTT, ABS, For…).
const GRID_CODES = { ca: 'Congé annuel', conge: 'Congé annuel', rtt: 'RTT', abs: 'Absence', arret: 'Arrêt', for: 'Formation', formation: 'Formation', am: 'Arrêt' };
function importPlanningGrid(wb) {
  const abs = {};
  let found = false;
  let days = 0;
  const seen = new Set();
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    let h = -1;
    let cName = -1;
    for (let r = 0; r < Math.min(rows.length, 40) && h < 0; r++) {
      const i = (rows[r] || []).findIndex((v) => norm(cellText(v)) === 'nom prenom' || norm(cellText(v)) === 'nom et prenom');
      if (i >= 0) [h, cName] = [r, i];
    }
    if (h < 0) continue;
    // La ligne des dates : celle qui contient le plus de vraies dates sous le titre.
    let dRow = -1;
    let best = 0;
    for (let r = h; r < Math.min(h + 5, rows.length); r++) {
      const n = (rows[r] || []).filter(isDate).length;
      if (n > best) [best, dRow] = [n, r];
    }
    if (dRow < 0 || best < 7) continue;
    found = true;
    const dates = (rows[dRow] || []).map((v) => (isDate(v) ? toIso(v) : ''));
    const cPoste = (rows[h] || []).findIndex((v) => norm(cellText(v)) === 'poste');
    // Étiquettes d'équipe (« EQ A ») placées à droite des blocs.
    const teamCells = [];
    rows.forEach((r, i) => (r || []).forEach((v, j) => j > cName + 1 && !dates[j] && /^(eq|equipe)\s*\S+$/.test(norm(cellText(v))) && teamCells.push([i, cellText(v)])));
    let block = [];
    const flush = () => {
      const label = teamCells.find(([i]) => block.includes(i))?.[1];
      if (label) block.forEach((i) => (rows[i].__team = label));
      block = [];
    };
    for (let r = dRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const full = cellText(row[cName]);
      if (!full) {
        flush();
        continue;
      }
      block.push(r);
    }
    flush();
    for (let r = dRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const full = cellText(row[cName]);
      if (!full) continue;
      // « NOM Prénom » : les mots en majuscules sont le nom.
      const words = full.split(' ');
      const nomW = words.filter((w) => w === w.toUpperCase() && /[A-Z]/.test(w));
      const preW = words.filter((w) => !nomW.includes(w));
      const p = findOrCreatePerson(nomW.join(' ') || words[0], preW.join(' ') || words.slice(1).join(' '));
      if (cPoste >= 0 && cellText(row[cPoste])) p.post = cellText(row[cPoste]);
      if (row.__team) p.team = row.__team;
      seen.add(p.id);
      dates.forEach((d, j) => {
        const code = cellText(row[j]);
        if (!d || !code) return;
        (abs[d] = abs[d] || {})[p.id] = { type: GRID_CODES[norm(code)] || code };
        days++;
      });
    }
  }
  if (!found) return null;
  state.absImport = abs;
  return `Planning importé : ${seen.size} personnes, ${days} jour${days > 1 ? 's' : ''} d’absence.`;
}

// L'exemple : les deux fichiers Excel publiés à côté de l'appli (noms inventés).
async function loadDemo() {
  toast('Je charge l’exemple…');
  try {
    for (const [kind, file] of [['hab', 'mes-habilitations.xlsx'], ['plan', 'planning-annuel.xlsx']]) {
      const res = await fetch('excel/' + file, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      await importExcel(new File([await res.blob()], file), kind, false);
      delete state.links[kind];
    }
    save();
    render();
    toast('Exemple chargé : 29 personnes inventées.');
  } catch (e) {
    toast('Impossible de charger l’exemple : vérifie ta connexion internet.');
  }
}

setInterval(() => document.visibilityState === 'visible' && refreshLinks(false), 30000);
