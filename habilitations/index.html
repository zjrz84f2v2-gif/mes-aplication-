// Les mots trouvés dans le fichier d'habilitations, et le niveau que l'appli leur donne.
function wordsHtml() {
  const words = state.levelWords || [];
  if (!words.length) return '';
  const unknown = words.filter((w) => !(state.levelMap?.[norm(w.text)] || w.lv)).length;
  const opts = (cur) =>
    `<option value="" ${cur ? '' : 'selected'} disabled>À choisir</option>` +
    state.levels.slice().reverse().map((lv) => `<option value="${lv.id}" ${cur === lv.id ? 'selected' : ''}>${esc(lv.name || (lv.label ? lv.letter + ' – ' + lv.label : lv.letter))}</option>`).join('') +
    `<option value="none" ${cur === 'none' ? 'selected' : ''}>Pas habilité</option>`;
  return `<div class="section-title">Comment l’appli lit tes niveaux${unknown ? `<span class="badge red">${unknown} à choisir</span>` : ''}</div>
    <p class="hint" style="margin:-4px 0 10px">Les mots trouvés dans ton fichier d’habilitations. Change le niveau si l’appli s’est trompée.</p>
    ${words
      .map((w) => {
        const t = norm(w.text);
        const cur = state.levelMap?.[t] || w.lv || '';
        return `<div class="ech-edit"${cur ? '' : ' style="border-color:var(--danger)"'}><span class="grow">« ${esc(w.text)} » <small style="color:var(--ink-3);font-weight:600">${w.n} case${w.n > 1 ? 's' : ''}</small></span>
          <select class="date-input" style="height:42px" data-word="${esc(t)}" aria-label="Niveau pour ${esc(w.text)}">${opts(cur)}</select></div>`;
      })
      .join('')}`;
}

// ---------- Interactions ----------

function bind() {
  document.getElementById('day')?.addEventListener('change', (e) => {
    if (e.target.value) ui.day = e.target.value;
    render();
  });
  document.getElementById('q')?.addEventListener('input', (e) => {
    ui.query = e.target.value;
    document.getElementById('people-list').innerHTML = peopleCards();
  });
  document.getElementById('import-file')?.addEventListener('change', importBackup);
  app.querySelectorAll('[data-word]').forEach((el) =>
    el.addEventListener('change', async () => {
      state.levelMap = { ...(state.levelMap || {}), [el.dataset.word]: el.value };
      save();
      if (lastFiles.hab) await importExcel(lastFiles.hab, 'hab', false);
      else if (state.links.hab) await refreshLinks(true);
      else render();
      toast('C’est noté : l’appli s’en souviendra.');
    }),
  );
  document.getElementById('plan-year')?.addEventListener('change', (e) => {
    state.planYear = Number(e.target.value) || new Date().getFullYear();
    save();
    if (state.links.plan) refreshLinks(true);
  });
  app.querySelectorAll('[data-pick-excel]').forEach((el) =>
    el.addEventListener('change', async () => {
      const f = el.files[0];
      if (f) await importExcel(f, el.dataset.pickExcel, true);
      el.value = '';
    }),
  );
  // Réglages : on enregistre en tapant, sans tout redessiner (le clavier reste ouvert).
  app.querySelectorAll('[data-rename-role]').forEach((el) =>
    el.addEventListener('input', () => {
      role(el.dataset.renameRole).name = el.value.trim() || 'Sans nom';
      save();
    }),
  );
  app.querySelectorAll('[data-level-letter]').forEach((el) =>
    el.addEventListener('change', () => {
      const lv = level(el.dataset.levelLetter);
      lv.letter = el.value.trim().toUpperCase() || lv.letter;
      save();
      render();
    }),
  );
  app.querySelectorAll('[data-level-desc]').forEach((el) =>
    el.addEventListener('input', () => {
      level(el.dataset.levelDesc).desc = el.value;
      save();
    }),
  );
}

document.addEventListener('click', (e) => {
  if (e.target.closest('.sheet-back')) return;
  const tab = e.target.closest('.tabs button');
  if (tab) {
    ui.tab = tab.dataset.tab;
    render();
    return window.scrollTo(0, 0);
  }
  const ab = e.target.closest('[data-absent]');
  if (ab) return openPerson(ab.dataset.absent);
  if (false) {
    const list = new Set(state.absences[ui.day] || []);
    list.has(ab.dataset.absent) ? list.delete(ab.dataset.absent) : list.add(ab.dataset.absent);
    if (list.size) state.absences[ui.day] = [...list];
    else delete state.absences[ui.day];
    save();
    return render();
  }
  const p = e.target.closest('[data-person]');
  if (p) return openPerson(p.dataset.person);
  const po = e.target.closest('[data-poste]');
  if (po) return openPoste(po.dataset.poste);
  const rf = e.target.closest('[data-role-filter]');
  if (rf) {
    ui.roleFilter = rf.dataset.roleFilter;
    return render();
  }
  const settings = settingsClick(e);
  if (settings) return;
  const a = e.target.closest('[data-action]')?.dataset.action;
  if (a === 'add-person') openPersonEditor();
  else if (a === 'add-poste') openPosteEditor();
  else if (a === 'today') {
    ui.day = iso(new Date());
    render();
  } else if (a === 'export') exportBackup();
  else if (a === 'import') document.getElementById('import-file').click();
  else if (a === 'link-hab') linkFile('hab');
  else if (a === 'link-plan') linkFile('plan');
  else if (a === 'unlink-hab') unlinkFile('hab');
  else if (a === 'unlink-plan') unlinkFile('plan');
  else if (a === 'refresh-links') refreshLinks(true);
  else if (a === 'reload-page') reloadPage();
  else if (a === 'demo') loadDemo();
  else if (a === 'no-team') openNoTeam();
  else if (a === 'wipe') {
    if (!confirm('Effacer toutes les personnes, postes et absences de cet appareil ? Tes fichiers Excel ne sont pas touchés.')) return;
    const keep = { levelMap: state.levelMap, planYear: state.planYear };
    state = { ...defaultState(), ...keep };
    save();
    idbDo('readwrite', (st) => st.clear()).catch(() => {});
    render();
    toast('Données effacées. Raccorde tes fichiers Excel.');
  }
});

function settingsClick(e) {
  const t = (sel) => e.target.closest(sel);
  let el;
  if ((el = t('[data-up-role]'))) {
    const i = state.roles.findIndex((r) => r.id === el.dataset.upRole);
    [state.roles[i - 1], state.roles[i]] = [state.roles[i], state.roles[i - 1]];
  } else if ((el = t('[data-del-role]'))) {
    const r = role(el.dataset.delRole);
    const used = state.people.filter((p) => p.role === r.id).length;
    if (!confirm(`Supprimer le rôle « ${r.name} » ?${used ? ` ${used} personne${used > 1 ? 's' : ''} n’aura plus de rôle.` : ''}`)) return true;
    state.roles = state.roles.filter((x) => x.id !== r.id);
    state.people.forEach((p) => p.role === r.id && (p.role = ''));
  } else if (t('[data-action="add-role"]')) {
    state.roles.push({ id: uid('r'), name: 'Nouveau rôle', color: ROLE_COLORS[state.roles.length % ROLE_COLORS.length] });
  } else if ((el = t('[data-up-level]'))) {
    const i = state.levels.findIndex((l) => l.id === el.dataset.upLevel);
    [state.levels[i - 1], state.levels[i]] = [state.levels[i], state.levels[i - 1]];
  } else if ((el = t('[data-del-level]'))) {
    if (state.levels.length <= 1) return toast('Il faut garder au moins un niveau.'), true;
    const lv = level(el.dataset.delLevel);
    const used = state.people.filter((p) => Object.values(p.skills || {}).includes(lv.id)).length;
    if (!confirm(`Supprimer le niveau « ${lv.letter} » ?${used ? ` Les habilitations de ce niveau (${used} personne${used > 1 ? 's' : ''}) seront retirées.` : ''}`)) return true;
    state.levels = state.levels.filter((x) => x.id !== lv.id);
    state.people.forEach((p) => Object.keys(p.skills || {}).forEach((k) => p.skills[k] === lv.id && delete p.skills[k]));
  } else if (t('[data-action="add-level"]')) {
    const letters = 'ABCDEFGHJKMNOPQRSTVWXYZ'.split('').filter((c) => !state.levels.some((l) => l.letter === c));
    state.levels.push({ id: uid('l'), letter: letters[0] || '?', shape: 'letter', color: LEVEL_COLORS[state.levels.length % LEVEL_COLORS.length], desc: 'À décrire.' });
  } else return false;
  save();
  render();
  return true;
}

// ---------- Fiches ----------

function showSheet(inner) {
  closeSheet();
  const back = document.createElement('div');
  back.className = 'sheet-back';
  back.innerHTML = `<div class="sheet" role="dialog" aria-modal="true"><div class="band"></div>${inner}</div>`;
  back.addEventListener('click', (e) => {
    if (e.target === back || e.target.closest('.close')) closeSheet();
  });
  document.body.appendChild(back);
  document.body.style.overflow = 'hidden';
  return back;
}

function closeSheet() {
  document.querySelector('.sheet-back')?.remove();
  document.body.style.overflow = '';
}

const closeBtn = `<button class="close" aria-label="Fermer">${icons.close}</button>`;

// Le niveau affiché en grand dans les fiches (lecture seule).
function levelTag(id) {
  const lv = level(id);
  if (!lv) return '';
  if (lv.name) return `<span class="lvl-tag" style="color:${lv.color};background:${lv.color}14;padding-left:12px" title="${esc(lv.desc)}"><b>${esc(lv.name)}</b></span>`;
  return `<span class="lvl-tag" style="color:${lv.color};background:${lv.color}14" title="${esc(lv.desc)}">${lvlHtml(id)}<b>${esc(lv.label || lv.letter)}</b></span>`;
}

// Sélecteur de niveau : —, I, L, U (et les niveaux ajoutés).
function segHtml(current, attr) {
  return `<div class="seg" role="group" aria-label="Niveau">
    <button class="none" data-${attr}="" aria-pressed="${!current}" aria-label="Pas habilité">–</button>
    ${state.levels
      .map((lv) => `<button data-${attr}="${lv.id}" aria-pressed="${current === lv.id}" aria-label="Niveau ${esc(lv.letter)}" title="${esc(lv.desc)}">${lv.shape && lv.shape !== 'letter' ? levelSvg(lv) : `<span style="color:${current === lv.id ? lv.color : 'inherit'}">${esc(lv.letter)}</span>`}</button>`)
      .join('')}
  </div>`;
}

// Fiche d'une personne : rôle, habilitations poste par poste, et qui peut la remplacer.
function openPerson(id) {
  const p = person(id);
  if (!p) return;
  p.skills = p.skills || {};
  const day = ui.day || iso(new Date());
  const dayName = day === iso(new Date()) ? 'Aujourd’hui' : cap(parseIso(day).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' }));
  const absent = absentOn(day);
  absent.add(p.id);
  const known = state.postes.filter((po) => p.skills[po.id] && level(p.skills[po.id]));
  const others = state.postes.filter((po) => !known.includes(po));
  let replaceHtml = '';
  const today = day;
  const dpp = isDpp(p, today);
  // Une puce de remplaçant : niveau, nom, quart ; mise en avant si même équipe.
  const chip = (x, lv) =>
    `<button class="cand${p.team && x.team === p.team ? ' same' : ''}" data-go-person="${x.id}">${lvlHtml(lv)}<span>${esc(x.name)}</span>${shiftOf(today, x.id) ? `<small style="color:${shiftColor(shiftOf(today, x.id))};font-weight:800">${esc(shortShift(shiftOf(today, x.id)))}</small>` : ''}${p.team && x.team !== p.team && x.team ? `<small>${esc(x.team)}</small>` : ''}</button>`;
  // Deux groupes : son équipe d'abord (mise en avant), puis les autres équipes.
  const groups = (list, lvOf) => {
    if (!list.length) return `<div class="nobody">${dpp ? 'Personne d’habilité au DPP de disponible' : 'Personne de disponible'}</div>`;
    const mine = p.team ? list.filter((x) => x.team === p.team) : list;
    const others = p.team ? list.filter((x) => x.team !== p.team) : [];
    let h = '';
    if (p.team) h += `<div class="rp-group"><span class="rp-title same">Dans son équipe · ${esc(p.team)}</span>${mine.length ? `<div class="cands">${mine.map((x) => chip(x, lvOf(x))).join('')}</div>` : '<span class="rp-none">Personne dans son équipe</span>'}</div>`;
    if (others.length || !p.team)
      h += `<div class="rp-group">${p.team ? '<span class="rp-title">Autres équipes</span>' : ''}<div class="cands">${(p.team ? others : mine).slice(0, 5).map((x) => chip(x, lvOf(x))).join('')}${(p.team ? others : mine).length > 5 ? `<span class="badge grey">+${(p.team ? others : mine).length - 5}</span>` : ''}</div></div>`;
    return h;
  };
  if (known.length || dpp) {
    const blocks = [];
    if (dpp) {
      const pool = state.people
        .filter((x) => shown(x) && !x.planOnly && !absent.has(x.id) && dppLevel(x) && (!dayHasShifts(today) || working(today, x.id)))
        .sort((a, b) => rank(dppLevel(b)) - rank(dppLevel(a)) || shiftRank(a, today) - shiftRank(b, today) || byName(a, b));
      blocks.push(`<div class="rp-block" data-rp="dpp batiment ai"><div class="rp-head"><span class="abs-type" style="background:#374151">DPP</span><b>Bâtiment AI</b><small>seulement les habilités au DPP</small></div>${groups(pool, dppLevel)}</div>`);
    }
    for (const po of known) {
      const c = candidates(po.id, absent, today).filter((x) => !dpp || dppLevel(x));
      blocks.push(`<div class="rp-block" data-rp="${esc(norm(po.name))}"><div class="rp-head"><b>${esc(po.name)}</b><small>${esc(p.name.split(' ')[0])} : ${levelTag(p.skills[po.id])}</small></div>${groups(c, (x) => x.skills[po.id])}</div>`);
    }
    replaceHtml = `<span class="label" id="rp-title">Qui peut remplacer ${esc(p.name)} ?</span>
      ${p.team ? `<p class="hint" style="margin:-4px 0 10px"><span class="legend-same"></span> En bleu : les personnes de son équipe (${esc(p.team)}).</p>` : ''}
      ${blocks.length > 2 ? `<div class="search-wrap" style="margin:0 0 10px">${icons.search}<input class="search" id="rp-find" type="search" placeholder="Chercher un poste" autocomplete="off" aria-label="Chercher un poste parmi ceux de ${esc(p.name)}"></div><p class="hint" id="rp-none" hidden style="margin:0 0 10px">Aucun de ses postes ne correspond.</p>` : ''}
      <div id="rp-list">${blocks.join('')}</div>
      <p class="hint">Sans compter les absents du jour${dayHasShifts(today) ? ', et seulement ceux qui travaillent ce jour-là' : ''}.</p>`;
  }
  const back = showSheet(`<div class="sheet-head">${avHtml(p, 'big')}<div style="min-width:0"><h2>${esc(p.name)}</h2><p>${esc([role(p.role)?.name, p.team].filter(Boolean).join(' · '))}${role(p.role) || p.team ? ' · ' : ''}${known.length} poste${known.length > 1 ? 's' : ''}</p><p style="margin-top:6px">${esc(dayName)} : ${presenceBadge(day, p)}</p></div>${closeBtn}</div>
    ${p.post ? `<p class="hint">Poste habituel : <b>${esc(p.post)}</b></p>` : ''}
    ${replaceHtml ? '<button class="btn ghost small" data-go-replace style="margin-top:12px">Voir qui peut le remplacer ↓</button>' : ''}
    <span class="label">Habilitations</span>
    ${known.length ? known.map((po) => skillRow(p, po)).join('') : '<p class="hint" style="margin:0">Aucune habilitation de poste dans le fichier.</p>'}
    ${state.echeances.length ? `<span class="label">Habilitations à date</span>${state.echeances
      .map((ec) => {
        const d = p.dates?.[ec.id] || '';
        return `<div class="ech-edit"><span class="grow">${esc(ec.name)}</span>${echDate(d, p.got?.[ec.id])}</div>`;
      })
      .join('')}` : ''}
    ${replaceHtml}
    <p class="hint" style="margin-top:18px">Pour changer quelque chose, modifie le fichier Excel : l’appli se met à jour toute seule.</p>`);
  back.querySelectorAll('[data-ech]').forEach((el) =>
    el.addEventListener('change', () => {
      p.dates = p.dates || {};
      if (el.value) p.dates[el.dataset.ech] = el.value;
      else delete p.dates[el.dataset.ech];
      save();
      render();
      openPerson(p.id);
    }),
  );
  back.querySelector('[data-go-replace]')?.addEventListener('click', () => {
    back.querySelector('#rp-title').scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth', block: 'start' });
  });
  back.querySelector('#rp-find')?.addEventListener('input', (e) => {
    const words = norm(e.target.value).split(' ').filter(Boolean);
    let n = 0;
    back.querySelectorAll('#rp-list .rp-block').forEach((b) => {
      const ok = words.every((w) => b.dataset.rp.includes(w));
      b.hidden = !ok;
      n += ok;
    });
    back.querySelector('#rp-none').hidden = n > 0;
  });
  let confirmDel = false;
  back.addEventListener('click', (e) => {
    let el;
    if ((el = e.target.closest('[data-set-role]'))) {
      p.role = el.dataset.setRole;
    } else if ((el = e.target.closest('[data-skill]'))) {
      const [posteId, lv] = el.dataset.skill.split('|');
      if (lv) p.skills[posteId] = lv;
      else delete p.skills[posteId];
    } else if ((el = e.target.closest('[data-add-skill]'))) {
      // Nouvelle habilitation : on commence au premier niveau (I), à ajuster ensuite.
      p.skills[el.dataset.addSkill] = state.levels[0].id;
      toast(`${poste(el.dataset.addSkill).name} ajouté : choisis le niveau.`);
    } else if ((el = e.target.closest('[data-go-person]'))) {
      return openPerson(el.dataset.goPerson);
    } else if (e.target.closest('[data-edit]')) {
      return openPersonEditor(p.id);
    } else if ((el = e.target.closest('[data-del]'))) {
      if (!confirmDel) {
        confirmDel = true;
        el.textContent = 'Appuie encore pour confirmer';
        return;
      }
      state.people = state.people.filter((x) => x.id !== p.id);
      Object.keys(state.absences).forEach((d) => (state.absences[d] = state.absences[d].filter((x) => x !== p.id)));
      save();
      closeSheet();
      render();
      return toast(`${p.name} retiré de l’équipe.`);
    } else return;
    save();
    render();
    const y = back.querySelector('.sheet').scrollTop;
    openPerson(p.id);
    document.querySelector('.sheet').scrollTop = y;
  });
}

function skillRow(p, po) {
  return `<div class="skill"><div class="skill-name">${esc(po.name)}${po.training ? `<small>Formation : ${esc(po.training)}</small>` : ''}</div>${levelTag(p.skills[po.id])}</div>`;
}

function openPersonEditor(id) {
  const p = id ? person(id) : null;
  const back = showSheet(`<div class="sheet-head"><h2>${p ? 'Modifier' : 'Nouvelle personne'}</h2>${closeBtn}</div>
    <form id="person-form">
      <label class="label" for="pname">Prénom et nom</label>
      <input id="pname" class="field" value="${esc(p?.name || '')}" required autocomplete="off" enterkeyhint="done" placeholder="ex. Marc Dupont">
      ${p ? '' : `<span class="label">Rôle</span><div class="row-wrap">${state.roles.map((r, i) => `<button type="button" class="chip" data-pick-role="${r.id}" aria-pressed="${i === 0}">${esc(r.name)}</button>`).join('')}</div>`}
      <div class="actions"><button class="btn" type="submit">${p ? 'Enregistrer' : 'Ajouter'}</button></div>
    </form>`);
  let roleId = state.roles[0]?.id || '';
  back.addEventListener('click', (e) => {
    const r = e.target.closest('[data-pick-role]');
    if (!r) return;
    roleId = r.dataset.pickRole;
    back.querySelectorAll('[data-pick-role]').forEach((b) => b.setAttribute('aria-pressed', String(b === r)));
  });
  back.querySelector('#person-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = back.querySelector('#pname').value.trim();
    if (!name) return;
    if (p) p.name = name;
    else state.people.push({ id: uid('p'), name, role: roleId, skills: {} });
    save();
    render();
    const target = p || state.people[state.people.length - 1];
    openPerson(target.id);
    if (!p) toast(`${name} ajouté. Ajoute ses habilitations.`);
  });
  setTimeout(() => back.querySelector('#pname').focus(), 60);
}

// Fiche d'un poste : qui est habilité, à quel niveau, et habiliter quelqu'un de plus.
function openPoste(id) {
  const po = poste(id);
  if (!po) return;
  const who = state.people.filter((p) => p.skills?.[po.id] && level(p.skills[po.id])).sort((a, b) => rank(b.skills[po.id]) - rank(a.skills[po.id]) || byName(a, b));
  const rest = state.people.filter((p) => !who.includes(p)).sort(byName);
  const back = showSheet(`<div class="sheet-head"><div style="min-width:0"><h2>${esc(po.name)}</h2><p>${po.training ? 'Temps de formation : ' + esc(po.training) + ' · ' : ''}${who.length} habilité${who.length > 1 ? 's' : ''}</p></div>${closeBtn}</div>
    <span class="label">Qui est habilité</span>
    ${who.length ? who.map((p) => `<div class="skill"><span class="skill-name" style="display:flex;align-items:center;gap:10px">${avHtml(p, 'small')}<span style="min-width:0">${esc(p.name)}<small>${esc(role(p.role)?.name || '')}</small></span></span>${levelTag(p.skills[po.id])}</div>`).join('') : '<p class="hint" style="margin:0">Personne n’est habilité dans le fichier.</p>'}
    <p class="hint" style="margin-top:18px">Pour changer quelque chose, modifie le fichier Excel : l’appli se met à jour toute seule.</p>`);
  let confirmDel = false;
  back.addEventListener('click', (e) => {
    let el;
    if ((el = e.target.closest('[data-pskill]'))) {
      const [pid, lv] = el.dataset.pskill.split('|');
      const p = person(pid);
      if (lv) p.skills[po.id] = lv;
      else delete p.skills[po.id];
    } else if ((el = e.target.closest('[data-habilite]'))) {
      const p = person(el.dataset.habilite);
      p.skills = p.skills || {};
      p.skills[po.id] = state.levels[0].id;
      toast(`${p.name} habilité : choisis le niveau.`);
    } else if (e.target.closest('[data-edit]')) {
      return openPosteEditor(po.id);
    } else if ((el = e.target.closest('[data-del]'))) {
      if (!confirmDel) {
        confirmDel = true;
        el.textContent = 'Appuie encore : les habilitations de ce poste seront retirées';
        return;
      }
      state.postes = state.postes.filter((x) => x.id !== po.id);
      state.people.forEach((p) => p.skills && delete p.skills[po.id]);
      save();
      closeSheet();
      render();
      return toast('Poste supprimé.');
    } else return;
    save();
    render();
    const y = back.querySelector('.sheet').scrollTop;
    openPoste(po.id);
    document.querySelector('.sheet').scrollTop = y;
  });
}

function openPosteEditor(id) {
  const po = id ? poste(id) : null;
  const back = showSheet(`<div class="sheet-head"><h2>${po ? 'Modifier le poste' : 'Nouveau poste'}</h2>${closeBtn}</div>
    <form id="poste-form">
      <label class="label" for="poname">Nom du poste</label>
      <input id="poname" class="field" value="${esc(po?.name || '')}" required autocomplete="off" placeholder="ex. Poste 1, Contrôle…">
      <label class="label" for="potrain">Temps de formation <span style="font-weight:600;color:var(--ink-2)">(facultatif)</span></label>
      <input id="potrain" class="field" value="${esc(po?.training || '')}" autocomplete="off" placeholder="ex. 1 jour, 2 semaines, 500 heures">
      <div class="actions"><button class="btn" type="submit">${po ? 'Enregistrer' : 'Ajouter le poste'}</button>
      ${po ? '' : '<button class="btn ghost" type="submit" data-again>Ajouter et en créer un autre</button>'}</div>
    </form>`);
  let again = false;
  back.querySelector('[data-again]')?.addEventListener('click', () => (again = true));
  back.querySelector('#poste-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const name = back.querySelector('#poname').value.trim();
    if (!name) return;
    const training = back.querySelector('#potrain').value.trim();
    if (po) Object.assign(po, { name, training });
    else state.postes.push({ id: uid('po'), name, training });
    save();
    render();
    if (again) {
      toast(`« ${name} » ajouté.`);
      return openPosteEditor();
    }
    closeSheet();
    toast(po ? 'Poste modifié.' : `« ${name} » ajouté.`);
  });
  setTimeout(() => back.querySelector('#poname').focus(), 60);
}

// ---------- Sauvegarde ----------

function exportBackup() {
  const blob = new Blob([JSON.stringify(state, null, 1)], { type: 'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `habilitations-${iso(new Date())}.json`;
  document.body.appendChild(a);
  a.click();
  a.remove();
  toast('Sauvegarde créée.');
}

function importBackup(e) {
  const f = e.target.files[0];
  if (!f) return;
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const data = JSON.parse(reader.result);
      if (!Array.isArray(data.people) || !Array.isArray(data.postes) || !Array.isArray(data.levels)) throw new Error('format');
      if (!confirm('Remplacer les données de cet appareil par celles de la sauvegarde ?')) return;
      state = { ...defaultState(), ...data };
      save();
      render();
      toast('Sauvegarde récupérée !');
    } catch (err) {
      toast('Ce fichier n’est pas une sauvegarde des habilitations.');
    }
  };
  reader.readAsText(f);
}

// ---------- Échéances ----------

const DAY = 864e5;
function echStatus(d) {
  if (!d) return 'none';
  const left = (parseIso(d) - parseIso(iso(new Date()))) / DAY;
  return left <= 90 ? 'red' : left <= 182 ? 'orange' : 'green';
}
const fmtDate = (d) => parseIso(d).toLocaleDateString('fr-FR', { day: '2-digit', month: '2-digit', year: '2-digit' });
// d = date où il faut la repasser ; got = date où elle a été obtenue (celle écrite dans l'Excel).
function echDate(d, got) {
  if (d && !got) return '<span class="ech-wrap"><span class="ech-date none">À relire</span><small class="ech-got">choisis à nouveau ton Excel</small></span>';
  const obt = got ? `<small class="ech-got">obtenue le ${fmtDate(got)}</small>` : '';
  if (!d) return `<span class="ech-wrap"><span class="ech-date none">${got ? 'Durée introuvable' : '—'}</span>${obt}</span>`;
  const st = echStatus(d);
  const left = Math.round((parseIso(d) - parseIso(iso(new Date()))) / DAY);
  const label = left < 0 ? `Expirée · ${fmtDate(d)}` : st === 'green' ? `Jusqu’au ${fmtDate(d)}` : `Dans ${left} j · ${fmtDate(d)}`;
  return `<span class="ech-wrap"><span class="ech-date ${st}">${label}</span>${obt}</span>`;
}

// Toutes les échéances des personnes qui correspondent à la recherche, de la plus urgente à la plus lointaine.
function echeancesOf(q) {
  const people = finderMatches(q);
  if (!people.length) return `<p class="hint" style="margin-top:14px">Personne ne s’appelle « ${esc(q.trim())} ».</p>`;
  return people
    .map((p) => {
      const rows = state.echeances.map((ec) => ({ ec, d: p.dates?.[ec.id] || '', got: p.got?.[ec.id] || '' })).sort((a, b) => (a.d || '9999').localeCompare(b.d || '9999'));
      const withDate = rows.filter((x) => x.d && x.got);
      const red = withDate.filter((x) => echStatus(x.d) === 'red').length;
      const orange = withDate.filter((x) => echStatus(x.d) === 'orange').length;
      return `<section class="card" style="padding:14px;margin-top:14px">
        <button class="absent-head" data-person="${p.id}" style="background:none;border:0;padding:0;width:100%;text-align:left">${avHtml(p)}<span class="grow"><span class="card-title" style="display:block">${esc(p.name)}</span><span class="card-meta">${esc([role(p.role)?.name, p.team].filter(Boolean).join(' · '))}</span></span>${icons.chevron}</button>
        <div class="lvls-row" style="margin:10px 0">${red ? `<span class="badge red">${red} à repasser vite</span>` : ''}${orange ? `<span class="badge" style="background:#FDF0DC;color:var(--warn)">${orange} dans moins de 6 mois</span>` : ''}${!red && !orange && withDate.length ? '<span class="badge green">Tout est à jour</span>' : ''}${!withDate.length ? '<span class="badge grey">Aucune échéance dans le fichier</span>' : ''}</div>
        ${rows.map((x) => `<div class="ech-edit"><span class="grow">${esc(x.ec.name)}${x.ec.every ? `<small style="display:block;color:var(--ink-3);font-weight:600;font-size:13px">${esc(x.ec.every)}</small>` : ''}</span>${echDate(x.d, x.got)}</div>`).join('')}
      </section>`;
    })
    .join('');
}

function renderEcheances() {
  let html = `<h1 class="page">Échéances</h1><p class="sub">Date de l’Excel = date d’obtention ; on y ajoute la durée écrite au-dessus (ex. 3 ans) pour savoir quand la repasser. Rouge = à repasser dans moins de 3 mois (ou expirée), orange = dans moins de 6 mois, vert = à jour.</p>`;
  if (!state.echeances.length)
    return html + `<div class="empty" style="margin-top:18px"><b>Pas encore d’échéances</b>Raccorde ton fichier Excel d’habilitations dans « Réglages » : les dates (microbio, ZEC, BPF, CACES…) arrivent ici.<br><button class="btn" data-tab-go="reglages">Raccorder mon fichier</button></div>`;
  if (norm(ui.echQuery)) return html + echeancesOf(ui.echQuery);
  const all = [];
  state.people.forEach((p) => state.echeances.forEach((ec) => p.dates?.[ec.id] && p.got?.[ec.id] && all.push({ p, ec, d: p.dates[ec.id], st: echStatus(p.dates[ec.id]) })));
  all.sort((a, b) => a.d.localeCompare(b.d));
  const red = all.filter((x) => x.st === 'red');
  const orange = all.filter((x) => x.st === 'orange');
  const green = all.filter((x) => x.st === 'green');
  const row = (x) => `<button class="ech-row" data-person="${x.p.id}" style="width:100%;text-align:left">${avHtml(x.p, 'small')}<span class="grow"><span class="card-title" style="font-size:16px;display:block">${esc(x.p.name)}</span><span class="card-meta">${esc(x.ec.name)}</span></span>${echDate(x.d, x.p.got?.[x.ec.id])}</button>`;
  html += `<div class="summary"><span class="badge red">${red.length} à repasser vite</span><span class="badge" style="background:#FDF0DC;color:var(--warn)">${orange.length} dans moins de 6 mois</span><span class="badge green">${green.length} valide${green.length > 1 ? 's' : ''}</span></div>`;
  if (red.length) html += `<div class="section-title">À repasser vite (moins de 3 mois)</div>${red.map(row).join('')}`;
  if (orange.length) html += `<div class="section-title">À repasser dans moins de 6 mois</div>${orange.map(row).join('')}`;
  if (!red.length && !orange.length) html += `<p class="hint" style="margin-top:14px">Tout est à jour.</p>`;
  html += `<div class="section-title">Par habilitation</div><div class="grid">${state.echeances
    .map((ec) => {
      const list = all.filter((x) => x.ec.id === ec.id);
      const r = list.filter((x) => x.st === 'red').length;
      const o = list.filter((x) => x.st === 'orange').length;
      return `<div class="card" style="padding:14px"><div class="card-title">${esc(ec.name)}</div><div class="card-meta">${list.length} personne${list.length > 1 ? 's' : ''}${ec.every ? ' · ' + esc(ec.every) : ''}</div>
        <div class="lvls-row">${r ? `<span class="badge red">${r} à repasser vite</span>` : ''}${o ? `<span class="badge" style="background:#FDF0DC;color:var(--warn)">${o} dans moins de 6 mois</span>` : ''}${!r && !o && list.length ? '<span class="badge green">À jour</span>' : ''}</div></div>`;
    })
    .join('')}</div>`;
  return html;
}

// ---------- Fichiers Excel raccordés ----------
// Sur ordinateur (Chrome / Edge), l'appli garde un lien vers le fichier et le relit toute seule
// dès qu'il est enregistré. Ailleurs (iPhone), on choisit le fichier à chaque mise à jour.

const canLink = 'showOpenFilePicker' in window;
// À changer quand la façon de lire les fichiers change : les fichiers raccordés sont alors relus.
const READER_VERSION = '2026-11-18a';
const handles = {};
let linkNeedsTap = false;

function idb() {
  return new Promise((resolve, reject) => {
    const r = indexedDB.open('habilitations-fichiers', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('h');
    r.onsuccess = () => resolve(r.result);
    r.onerror = () => reject(r.error);
  });
}
async function idbDo(mode, fn) {
  const db = await idb();
  return new Promise((resolve, reject) => {
    const tx = db.transaction('h', mode);
    const req = fn(tx.objectStore('h'));
    tx.oncomplete = () => resolve(req?.result);
    tx.onerror = () => reject(tx.error);
  });
}

const KIND_NAME = { hab: 'Habilitations', plan: 'Planning (absences et quarts)' };

function linksHtml() {

    const l = state.links[kind];

    <div class="ech-edit" style="margin-top:10px"><label class="grow" for="plan-year">Année du planning (si le fichier n’écrit que les numéros des jours)</label>
      <input id="plan-year" type="number" inputmode="numeric" min="2020" max="2100" value="${Number(state.planYear) || new Date().getFullYear()}" style="width:96px"></div>`;

function linkBanner() {
  const unknown = (state.levelWords || []).filter((w) => !(state.levelMap?.[norm(w.text)] || w.lv)).length;
  if (unknown) return `<div class="banner" style="background:var(--danger-soft);color:var(--danger)">${unknown} façon${unknown > 1 ? 's' : ''} d’écrire un niveau à expliquer à l’appli.<button class="btn" data-tab-go="reglages">Choisir</button></div>`;
  const kinds = Object.keys(state.links || {});
  if (!kinds.length) return '';
  const last = Math.max(...kinds.map((k) => state.links[k].at || 0));
  const when = last ? new Date(last).toLocaleString('fr-FR', { day: '2-digit', month: '2-digit', hour: '2-digit', minute: '2-digit' }) : '';
  const old = kinds.some((k) => state.links[k].reader !== READER_VERSION);
  if (linkNeedsTap || old) return `<div class="banner">${old ? 'L’appli a été améliorée : relis tes fichiers Excel.' : 'Tes fichiers Excel ont peut-être changé.'}<button class="btn" data-action="refresh-links">Actualiser</button></div>`;
  return `<div class="banner" style="background:var(--card);color:var(--ink-2);border:1px solid var(--line)">Fichiers lus le ${when}.<button class="btn ghost" data-action="refresh-links">${canLink ? 'Actualiser' : 'Comment actualiser ?'}</button></div>`;

async function linkFile(kind) {
  try {
    const [h] = await window.showOpenFilePicker({ types: [{ description: 'Excel', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx', '.xlsm'], 'application/vnd.ms-excel': ['.xls'] } }] });
    handles[kind] = h;
    // Le lien est gardé pour relire le fichier aux prochaines ouvertures.
    await idbDo('readwrite', (st) => st.put(h, kind)).catch(() => {});
    await importExcel(await h.getFile(), kind, true);
  } catch (e) {
    if (e.name !== 'AbortError') toast('Impossible d’ouvrir ce fichier.');
  }
}

async function unlinkFile(kind) {
  delete handles[kind];
  delete state.links[kind];
  if (kind === 'plan') {
    state.absImport = {};
    state.shifts = {};
    state.locs = {};
  }
  save();
  try {
    await idbDo('readwrite', (st) => st.delete(kind));
  } catch (e) {}
  render();
  toast('Fichier détaché. Les données déjà importées restent dans l’appli.');
}

// Relit les fichiers raccordés s'ils ont changé depuis la dernière lecture.
// Bouton ↻ : relit les fichiers Excel (sur ordinateur), puis recharge la dernière version de l'appli.
async function reloadPage() {
  toast('Je rafraîchis…');
  if (canLink && Object.keys(state.links || {}).length) {
    try {
      await refreshLinks(true);
    } catch (e) {}
  }
  const u = new URL(location.href);
  u.searchParams.set('r', Date.now());
  location.replace(u.toString());
}

async function refreshLinks(fromTap) {
  if (!canLink) {
    if (fromTap) {
      ui.tab = 'reglages';
      render();
      toast('Sur téléphone, choisis à nouveau tes fichiers Excel ici pour les relire.');
    }
    return;
  }
  let needTap = false;
  for (const kind of ['hab', 'plan']) {
    if (!state.links[kind]) continue;
    try {
      if (!handles[kind]) handles[kind] = await idbDo('readonly', (st) => st.get(kind));
      const h = handles[kind];
      if (!h) continue;
      let perm = await h.queryPermission({ mode: 'read' });
      if (perm !== 'granted' && fromTap) perm = await h.requestPermission({ mode: 'read' });
      if (perm !== 'granted') {
        needTap = true;
        continue;
      }
      const f = await h.getFile();
      if (fromTap || f.lastModified !== state.links[kind].modified || state.links[kind].reader !== READER_VERSION) await importExcel(f, kind, fromTap);
    } catch (e) {
      if (fromTap) toast(`Impossible de relire « ${state.links[kind].name} ». Raccorde-le à nouveau dans Réglages.`);
    }
  }
  if (fromTap && !needTap) toast('Fichiers relus.');
  if (needTap !== linkNeedsTap) {
    linkNeedsTap = needTap;
    if (!document.querySelector('.sheet-back')) render();
  }
}

const lastFiles = {};
let xlsxWait;
function loadXlsx() {
  if (window.XLSX) return Promise.resolve();
  if (!xlsxWait)
    xlsxWait = new Promise((resolve, reject) => {
      const s = document.createElement('script');
      s.src = 'https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js';
      s.onload = resolve;
      s.onerror = () => {
        xlsxWait = null;
        reject(new Error('xlsx'));
      };
      document.head.appendChild(s);
    });
  return xlsxWait;
}

async function importExcel(file, kind, verbose) {
  try {
    await loadXlsx();
  } catch (e) {
    return toast('Il faut internet la première fois pour lire les fichiers Excel.');
  }
  let wb;
  try {
    wb = XLSX.read(await file.arrayBuffer(), { type: 'array', cellDates: true });
  } catch (e) {
    return toast('Ce fichier n’est pas un fichier Excel lisible.');
  }
  lastFiles[kind] = file;
  importSeen = new Set();
  const report = kind === 'plan' ? importPlanning(wb) : importHabilitations(wb);
  const seen = importSeen;
  importSeen = null;
  if (report) {
    // Le fichier est la seule source : on oublie les personnes qui venaient d'anciens fichiers.
    const before = state.people.length;
    state.people = state.people.filter((p) => seen.has(p.id) || (kind === 'hab' ? p.planOnly : !p.planOnly));
    const gone = before - state.people.length;
    if (gone) console.info(`${gone} personne(s) d'anciens fichiers retirée(s)`);
  }
  if (!report) return toast(kind === 'plan' ? 'Je ne trouve pas les colonnes Nom, Prénom, Type, Du, Au dans ce fichier.' : 'Je ne trouve pas les colonnes Nom et Prénom dans ce fichier.');
  state.links[kind] = { name: file.name, at: Date.now(), modified: file.lastModified, reader: READER_VERSION };
  save();
  render();
  if (verbose) toast(report);
  else toast(`${KIND_NAME[kind]} mis à jour depuis Excel.`);
}

const sheetRows = (ws) => XLSX.utils.sheet_to_json(ws, { header: 1, raw: true, defval: null, blankrows: true });
const cellText = (v) => (v instanceof Date ? '' : String(v ?? '').replace(/\s+/g, ' ').trim());
const isDate = (v) => v instanceof Date && !isNaN(v);
function toIso(v) {
  if (isDate(v)) return iso(new Date(v.getTime() + 12 * 3600e3));
  const m = String(v ?? '').match(/(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{2,4})/);
  if (!m) return '';
  const y = m[3].length === 2 ? 2000 + Number(m[3]) : Number(m[3]);
  return `${y}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
}

// La ligne des titres : celle qui contient « Nom » et « Prénom ».
function findHeader(rows, also = []) {
  for (let r = 0; r < Math.min(rows.length, 30); r++) {
    const t = (rows[r] || []).map((v) => norm(cellText(v)));
    if (t.includes('nom') && t.includes('prenom') && also.every((a) => t.some((x) => x === a || x.startsWith(a)))) return r;
  }
  return -1;
}

const personKey = (prenom, nom) => norm(`${prenom} ${nom}`);
// Le rôle de chacun : seulement s'il est écrit (colonne Rôle/Fonction/Statut, ou le poste du planning).
// Rien d'écrit : pas de rôle.
const ROLE_RULES = [
  ['Manageur', /\bmanag|chef d equipe|\bchef\b(?! de ligne)|responsable|superviseur|\bencadr/],
  ['Alternant', /altern|apprenti|stagiaire|contrat pro|\binterim/],
  ['Technicien', /techni|\btech\b|maintenance|methode|qualite/],
  ['Opérateur', /operat|conduct/],
];
function roleFromText(t) {
  const n = norm(t);
  if (!n) return '';
  return (ROLE_RULES.find(([, re]) => re.test(n)) || [''])[0];
}
function applyRoles() {
  const roleId = (name) => {
    let ro = state.roles.find((x) => norm(x.name) === norm(name));
    if (!ro) state.roles.push((ro = { id: uid('r'), name, color: ROLE_COLORS[state.roles.length % ROLE_COLORS.length] }));
    return ro.id;
  };
  for (const p of state.people) {
    const name = roleFromText(p.roleText) || p.roleText || roleFromText(p.post) || '';
    p.role = name ? roleId(name) : '';
  }
}

function mergePlanOnly() {
  for (const p of state.people.filter((x) => x.planOnly)) {
    const hits = p.preN
      ? state.people.filter((x) => !x.planOnly && ((x.nomN === p.nomN && closeEnough(x.preN || '', p.preN)) || (x.nomN === p.preN && closeEnough(x.preN || '', p.nomN))))
      : findByLastName(p.nomN);
    if (hits.length !== 1) {
      p.ambiguous = !p.preN && hits.length > 1 ? hits.map((x) => x.name) : null;
      continue;
    }
    const to = hits[0];
    for (const day of [...Object.values(state.absImport || {}), ...Object.values(state.shifts || {}), ...Object.values(state.locs || {})]) {
      if (day[p.id]) {
        day[to.id] = day[p.id];
        delete day[p.id];
      }
    }
    if (p.post && !to.post) to.post = p.post;
    if (p.team && !to.team) to.team = p.team;
    state.people = state.people.filter((x) => x !== p);
  }
  applyRoles();
}

// Une vraie personne : pas une ligne de total (« 37 NOMBRE OPÉRATEURS »), ni un titre.
function validName(nom, prenom) {
  const t = norm(`${nom} ${prenom}`);
  return /[a-z]/.test(t) && !/\d/.test(t) && !/\b(nombre|total|effectif|somme|moyenne|nom|prenom)\b/.test(t);
}

// Même nom de famille et prénom presque pareil (« Mickael » / « Michaël ») : c'est la même personne.
function closeEnough(a, b) {
  if (!a || !b) return false;
  if (a === b || a.startsWith(b) || b.startsWith(a)) return true;
  if (Math.abs(a.length - b.length) > 2) return false;
  const d = Array.from({ length: b.length + 1 }, (_, j) => j);
  for (let i = 1; i <= a.length; i++) {
    let prev = d[0];
    d[0] = i;
    for (let j = 1; j <= b.length; j++) {
      const tmp = d[j];
      d[j] = Math.min(d[j] + 1, d[j - 1] + 1, prev + (a[i - 1] === b[j - 1] ? 0 : 1));
      prev = tmp;
    }
  }
  return d[b.length] <= 2;
}

// Planning avec le nom de famille seul (« SARTELET ») : on cherche ce nom dans le fichier d'habilitations.
function findByLastName(nom) {
  const n = norm(nom);
  const hits = state.people.filter((x) => !x.planOnly && (x.nomN === n || (!x.nomN && norm(x.name).split(' ').slice(1).join(' ') === n)));
  return hits;
}

// Les personnes vues pendant la lecture d'un fichier (pour oublier celles des anciens fichiers).
let importSeen = null;
function findOrCreatePerson(nom, prenom, fromPlan) {
  const p = findOrCreatePerson0(nom, prenom, fromPlan);
  if (p && importSeen) importSeen.add(p.id);
  return p;
}

function findOrCreatePerson0(nom, prenom, fromPlan) {
  if (!validName(nom, prenom)) return null;
  if (fromPlan && !norm(prenom)) {
    const hits = findByLastName(nom);
    if (hits.length === 1) return hits[0];
    // Pas trouvé, ou plusieurs personnes avec ce nom : on garde la ligne du planning à part.
    const n = norm(nom);
    let p = state.people.find((x) => x.planOnly && x.nomN === n && !x.preN);
    if (!p) {
      p = { id: uid('p'), name: nom.toUpperCase(), role: '', skills: {}, planOnly: true, nomN: n, preN: '' };
      state.people.push(p);
    }
    p.ambiguous = hits.length > 1 ? hits.map((x) => x.name) : null;
    return p;
  }
  const k = personKey(prenom, nom);
  const k2 = personKey(nom, prenom);
  const n = norm(nom);
  const pr = norm(prenom);
  let p =
    state.people.find((x) => x.key === k || norm(x.name) === k || norm(x.name) === k2) ||
    state.people.find((x) => x.nomN && x.preN && ((x.nomN === n && closeEnough(x.preN, pr)) || (x.nomN === pr && closeEnough(x.preN, n))));
  if (!p) {
    p = { id: uid('p'), name: `${cap(prenom.toLowerCase())} ${nom.toUpperCase()}`.trim(), role: '', skills: {}, planOnly: !!fromPlan };
    state.people.push(p);
  }
  if (!fromPlan && p.planOnly) {
    // Une ligne du planning retrouvée dans le fichier d'habilitations : elle prend le nom complet.
    p.planOnly = false;
    p.ambiguous = null;
    p.name = `${cap(prenom.toLowerCase())} ${nom.toUpperCase()}`.trim();
    p.nomN = n;
    p.preN = pr;
    p.key = k;
  }
  p.key = p.key || k;
  p.nomN = p.nomN || n;
  p.preN = p.preN || pr;
  return p;
}

// Les différentes façons d'écrire un niveau dans les fichiers. « none » = pas habilité.
const LEVEL_WORDS = {
  AI: ['ai', 'a initier', 'a initie', 'a faire', 'initier', 'a former', 'pas initie', 'non initie', 'pas encore forme', 'formation a prevoir'],
  EF: ['ef', 'en formation', 'formation en cours', 'en cours de formation', 'en cours', 'initiation', 'apprentissage'],
  I: ['i', 'initie', 'initiee', 'debutant', 'debutante', 'novice', 'decouverte', 'base', 'connaissance de base', 'notions', 'accompagne', 'sous tutelle', 'niveau 1', 'niv 1', 'n1', '1'],
  L: ['l', 'utilisateur', 'utilisatrice', 'utilisateurs', 'habilite', 'habilitee', 'autonome', 'maitrise', 'maitrisee', 'operationnel', 'operationnelle', 'confirme', 'confirmee', 'forme', 'formee', 'valide', 'validee', 'qualifie', 'qualifiee', 'oui', 'ok', 'x', 'niveau 2', 'niv 2', 'n2', '2'],
  U: ['u', 'formateur', 'formatrice', 'tuteur', 'tutrice', 'expert', 'experte', 'referent', 'referente', 'reference', 'pilote', 'sait former', 'transmet', 'niveau 3', 'niv 3', 'n3', '3'],
  none: ['non', 'no', 'na', 'n a', 'nc', 'aucun', 'aucune', 'pas habilite', 'pas forme', 'retire', 'retiree', 'suspendu', 'suspendue', '0', 'niveau 0', 'n0'],
};
const WORD_LEVEL = Object.fromEntries(Object.entries(LEVEL_WORDS).flatMap(([lv, words]) => words.map((w) => [w, lv])));
let seenWords = {};

// Le niveau d'une case : d'abord tes choix (Réglages), puis la lettre, puis les mots connus.
function wordLevel(t) {
  const mine = state.levelMap?.[t];
  if (mine) return mine;
  const lv = state.levels.find((l) => norm(l.letter) === t);
  if (lv) return lv.id;
  if (WORD_LEVEL[t]) return WORD_LEVEL[t];
  // « Utilisateur depuis 2023 », « Formateur (VA/VP) »… : on regarde le début.
  const start = Object.keys(WORD_LEVEL)
    .filter((w) => w.length > 2 && t.startsWith(w + ' '))
    .sort((a, b) => b.length - a.length)[0];
  return start ? WORD_LEVEL[start] : '';
}

function levelFromCell(v, track) {
  const t = norm(cellText(v));
  if (!t) return null;
  // Une date écrite dans la case (« 14/03/2024 ») : la personne a été formée ce jour-là.
  const lv = /^\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{2,4}/.test(cellText(v)) && !state.levelMap?.[t] ? 'L' : wordLevel(t);
  if (track) seenWords[t] = seenWords[t] || { text: cellText(v), n: 0, lv };
  if (track) seenWords[t].n++;
  if (lv === 'none') return null;
  return lv && level(lv) ? lv : undefined;
}

// Une colonne de postes : des mots courts répétés (pas des dates, ni des adresses, ni des phrases).
function looksLikeLevels(vals) {
  const t = vals.map((v) => cellText(v)).filter(Boolean);
  if (!t.length) return false;
  if (t.some((x) => levelFromCell(x) !== undefined && levelFromCell(x) !== null)) return true;
  const distinct = new Set(t.map(norm));
  return distinct.size <= 6 && t.every((x) => x.length <= 25 && !/@|https?:/.test(x));
}

const META = ['nom', 'prenom', 'visa', 'equipe', 'animateur', 'role', 'fonction', 'type', 'statut', 'matricule', 'mail', 'email'];
const GENERIC = /^(date.*|echeance|1 fois.*|tous les.*|oui non|type|occurrence|)$/;

function importHabilitations(wb) {
  let nPeople = 0;
  let nSkills = 0;
  let nDates = 0;
  let found = false;
  seenWords = {};
  // Les dates viennent seulement de ce fichier : on repart de zéro (plus de restes d'une ancienne lecture).
  // Pareil pour les postes et les niveaux : seulement ceux du fichier lu maintenant.
  const oldDates = state.people.map((p) => [p, p.dates, p.got, p.skills]);
  const oldEch = state.echeances;
  const oldPostes = state.postes;
  state.echeances = [];
  state.postes = [];
  state.people.forEach((p) => {
    p.dates = {};
    p.got = {};
    p.skills = {};
  });
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    const h = findHeader(rows);
    if (h < 0) continue;
    found = true;
    for (const m of wb.Sheets[name]['!merges'] || []) {
      const v = rows[m.s.r]?.[m.s.c];
      for (let r = m.s.r; r <= Math.min(m.e.r, h - 1); r++) for (let c = m.s.c; c <= m.e.c; c++) if (rows[r] && rows[r][c] == null) rows[r][c] = v;
    }
    // Onglets « Etat des lieux KF » : le sujet de l'onglet sert de préfixe aux colonnes.
    const topic = /^etat des lieux /.test(norm(name)) ? name.replace(/^\s*[ée]tat des lieux\s*/i, '').trim() + ' – ' : '';
    const head = rows[h].map((v) => norm(cellText(v)));
    const col = (k) => head.findIndex((x) => x === k || x.startsWith(k));
    const cNom = col('nom');
    const cPre = col('prenom');
    const cRole = head.findIndex((x) => ['role', 'fonction', 'statut', 'metier', 'emploi', 'categorie', 'qualification', 'contrat'].includes(x));
    const cTeam = col('equipe');
    const cVisa = col('visa');
    const cAnim = col('animateur');
    const data = rows.slice(h + 1).filter((r) => r && cellText(r[cNom]) && cellText(r[cPre]) && validName(cellText(r[cNom]), cellText(r[cPre])));
    if (!data.length) continue;
    const width = Math.max(...rows.slice(0, h + 1 + data.length).map((r) => (r ? r.length : 0)));
    // Nom de chaque colonne : le titre, ou le texte au-dessus si le titre est « date ».
    const titleOf = (c) => {
      const own = cellText(rows[h]?.[c]);
      if (own && !GENERIC.test(norm(own))) return own.replace(/\s*\(tous les .*?\)\s*$/i, '').trim();
      // Titre sur deux lignes au-dessus (ex. « BROYEUR » puis « HOSO Micro »).
      const above = [h - 2, h - 1].filter((r) => r >= 0).map((r) => cellText(rows[r]?.[c])).filter((t) => t && !GENERIC.test(norm(t)));
      if (above.length) return [...new Set(above)].join(' ');
      for (let r = h; r >= 0; r--) {
        const t = cellText(rows[r]?.[c]);
        if (t && !GENERIC.test(norm(t))) return t.replace(/\s*\(tous les .*?\)\s*$/i, '').trim();
      }
      return '';
    };
    const everyOf = (c) => {
      for (let r = h; r >= 0; r--) {
        const t = cellText(rows[r]?.[c]);
        const n = norm(t);
        const m = n.match(/(1 fois tous les \d+ ans?|1 fois par an|tous les \d+ ans?|tous les ans)/);
        if (m) return m[1].replace(/^1 fois /, '').replace(/^tous les 1 an$/, 'tous les ans');
        // Juste la durée écrite au-dessus : « 3 ans », « valable 5 ans », « 6 mois », « annuel ».
        if (n.length <= 30) {
          const y = n.match(/(?:^|\s|\()(\d+)\s*(ans?|annees?)\b/);
          if (y) return Number(y[1]) === 1 ? 'tous les ans' : `tous les ${y[1]} ans`;
          const mo = n.match(/(?:^|\s|\()(\d+)\s*mois\b/);
          if (mo) return `tous les ${mo[1]} mois`;
          if (/^(annuel(le)?|par an)$/.test(n)) return 'tous les ans';
        }
      }
      return '';
    };
    for (let c = 0; c < width; c++) {
      if (c === cNom || c === cPre || c === cRole || c === cTeam || META.includes(head[c])) continue;
      const vals = data.map((r) => r[c]);
      const title0 = titleOf(c);
      if (!title0) continue;
      const title = topic && !norm(title0).startsWith(norm(topic)) ? topic + title0 : title0;
      const every = everyOf(c);
      const colTxt = [h - 2, h - 1, h].filter((r) => r >= 0).map((r) => norm(cellText(rows[r]?.[c]))).join(' ');
      // Une date sans fréquence ni « échéance » : c'est la date où la personne a été formée.
      const trainedOn = vals.some(isDate) && !every && !/echeance/.test(colTxt);
      if (trainedOn && /date/.test(colTxt)) continue; // date d'une colonne voisine (« date formation ou réhabilitation »)
      if (vals.some(isDate) && !trainedOn) {
        // La date écrite est celle où l'habilitation a été OBTENUE ; elle est valable la durée écrite au-dessus.
        const months = /mois/.test(every) ? Number((every.match(/\d+/) || [0])[0]) : (every === 'par an' || every === 'tous les ans' ? 1 : Number((every.match(/\d+/) || [0])[0])) * 12;
        let ec = state.echeances.find((x) => norm(x.name) === norm(title));
        if (!ec) state.echeances.push((ec = { id: uid('e'), name: title, every }));
        if (every) ec.every = every;
        data.forEach((r) => {
          const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
          p.dates = p.dates || {};
          p.got = p.got || {};
          const got = toIso(r[c]);
          let d = '';
          if (got && months) {
            const x = parseIso(got);
            d = iso(new Date(x.getFullYear(), x.getMonth() + months, x.getDate()));
          } // Sans durée trouvée : on garde seulement la date d'obtention (jamais prise pour une date d'expiration).
          if (got) {
            p.got[ec.id] = got;
            nDates++;
          } else delete p.got[ec.id];
          if (d) p.dates[ec.id] = d;
          else delete p.dates[ec.id];
        });
      } else if (trainedOn || looksLikeLevels(vals)) {
        let po = state.postes.find((x) => norm(x.name) === norm(title));
        if (!po) state.postes.push((po = { id: uid('po'), name: title, training: '' }));
        data.forEach((r) => {
          const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
          p.skills = p.skills || {};
          const lv = isDate(r[c]) ? 'L' : levelFromCell(r[c], true);
          if (lv) {
            p.skills[po.id] = lv;
            nSkills++;
          } else delete p.skills[po.id];
        });
      }
    }
    data.forEach((r) => {
      const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]));
      if (cTeam >= 0 && cellText(r[cTeam])) p.team = cellText(r[cTeam]);
      if (cVisa >= 0 && cellText(r[cVisa])) p.visa = cellText(r[cVisa]);
      if (cAnim >= 0 && cellText(r[cAnim])) p.anim = cellText(r[cAnim]);
      if (cRole >= 0 && cellText(r[cRole])) {
        p.roleText = cellText(r[cRole]);
      }
    });
    nPeople = Math.max(nPeople, data.length);
  }
  if (!found) {
    // Pas un fichier d'habilitations : on remet tout comme avant.
    state.echeances = oldEch;
    state.postes = oldPostes;
    oldDates.forEach(([p, d, g, sk]) => Object.assign(p, { dates: d || {}, got: g || {}, skills: sk || {} }));
    return null;
  }
  mergePlanOnly();
  state.levelWords = Object.values(seenWords).sort((a, b) => b.n - a.n);
  const unknown = state.levelWords.filter((w) => !w.lv).length;
  if (unknown) return `Importé, mais ${unknown} façon${unknown > 1 ? 's' : ''} d’écrire un niveau ${unknown > 1 ? 'sont inconnues' : 'est inconnue'} : choisis leur sens dans Réglages.`;
  return `Importé : ${nPeople} personne${nPeople > 1 ? 's' : ''}, ${nSkills} habilitation${nSkills > 1 ? 's' : ''} de poste, ${nDates} date${nDates > 1 ? 's' : ''} d’échéance.`;
}

function importPlanning(wb) {
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    const h = findHeader(rows, ['type', 'du']);
    if (h < 0) continue;
    const head = rows[h].map((v) => norm(cellText(v)));
    const col = (k) => head.findIndex((x) => x === k || x.startsWith(k));
    const [cNom, cPre, cType, cDu, cAu] = ['nom', 'prenom', 'type', 'du', 'au'].map(col);
    const cNote = head.findIndex((x) => x.startsWith('comment') || x.startsWith('motif'));
    const abs = {};
    const shifts = {};
    let n = 0;
    for (const r of rows.slice(h + 1)) {
      if (!r || !cellText(r[cNom]) || !cellText(r[cPre])) continue;
      const from = toIso(r[cDu]);
      const to = toIso(r[cAu]) || from;
      if (!from) continue;
      const p = findOrCreatePerson(cellText(r[cNom]), cellText(r[cPre]), true);
      if (!p) continue;
      const info = { type: cellText(r[cType]) || 'Absent', raw: cellText(r[cType]) };
      if (cNote >= 0 && cellText(r[cNote])) info.note = cellText(r[cNote]);
      const shift = SHIFT_CODES[norm(info.type)];
      for (let d = parseIso(from), i = 0; d <= parseIso(to) && i < 400; d = new Date(d.getFullYear(), d.getMonth(), d.getDate() + 1), i++) {
        if (shift) (shifts[iso(d)] = shifts[iso(d)] || {})[p.id] = shift;
        else (abs[iso(d)] = abs[iso(d)] || {})[p.id] = info;
      }
      n++;
    }
    state.absImport = abs;
    state.shifts = shifts;
    mergePlanOnly();
    return `Planning importé : ${n} absence${n > 1 ? 's' : ''}.`;
  }
  return importPlanningGrid(wb);
}

const MONTH_NAMES = ['janvier', 'fevrier', 'mars', 'avril', 'mai', 'juin', 'juillet', 'aout', 'septembre', 'octobre', 'novembre', 'decembre'];
// Jours écrits 1, 2, 3… : le mois vient du nom de l'onglet (« Janvier », « Juillet et Août »), l'année du réglage.
function numberedDays(rows, h, sheetName) {
  const months = MONTH_NAMES.map((m, i) => [norm(sheetName).indexOf(m), i]).filter(([at]) => at >= 0).sort((a, b) => a[0] - b[0]).map(([, i]) => i);
  if (!months.length) return null;
  const year = Number(state.planYear) || new Date().getFullYear();
  for (let r = h; r < Math.min(h + 5, rows.length); r++) {
    const row = rows[r] || [];
    const nums = row.map((v) => (typeof v === 'number' && Number.isInteger(v) && v >= 1 && v <= 31 ? v : null));
    if (nums.filter((n) => n).length < 20) continue;
    let mi = 0;
    let prev = 0;
    return [nums.map((n) => {
      if (!n) return '';
      if (n < prev && mi < months.length - 1) mi++;
      prev = n;
      const d = new Date(year, months[mi], n);
      return d.getMonth() === months[mi] ? iso(d) : '';
    }), r];
  }
  return null;
}

// Planning annuel « en grille » : un onglet par mois, une ligne par personne, un code par jour (CA, RTT, ABS, For…).
const GRID_CODES = { ca: 'Congé annuel', conge: 'Congé annuel', rtt: 'RTT', abs: 'Absence', arret: 'Arrêt', for: 'Formation', formation: 'Formation', am: 'Arrêt' };
function importPlanningGrid(wb) {
  const abs = {};
  const shifts = {};
  const locs = {};
  let found = false;
  let days = 0;
  let nShifts = 0;
  const seen = new Set();
  for (const name of wb.SheetNames) {
    const rows = sheetRows(wb.Sheets[name]);
    let h = -1;
    let cName = -1;
    for (let r = 0; r < Math.min(rows.length, 40) && h < 0; r++) {
      const i = (rows[r] || []).findIndex((v) => ['nom prenom', 'nom et prenom', 'nom', 'noms', 'nom prenoms'].includes(norm(cellText(v))));
      if (i >= 0) [h, cName] = [r, i];
    }
    if (h < 0) continue;
    // La ligne des dates : celle qui contient le plus de vraies dates sous le titre.
    let dRow = -1;
    let best = 0;
    for (let r = h; r < Math.min(h + 5, rows.length); r++) {
      const n = (rows[r] || []).filter(isDate).length;
      if (n > best) [best, dRow] = [n, r];
    }
    let dates = dRow >= 0 && best >= 7 ? (rows[dRow] || []).map((v) => (isDate(v) ? toIso(v) : '')) : null;
    if (!dates) {
      const nd = numberedDays(rows, h, name);
      if (nd) [dates, dRow] = nd;
    }
    if (!dates) continue;
    found = true;
    const cPoste = (rows[h] || []).findIndex((v) => norm(cellText(v)) === 'poste');
    // Étiquettes d'équipe (« EQ A ») placées à droite des blocs.
    const teamCells = [];
    rows.forEach((r, i) => (r || []).forEach((v, j) => j > cName + 1 && !dates[j] && /^(eq|equipe)\s*\S+$/.test(norm(cellText(v))) && teamCells.push([i, cellText(v)])));
    let block = [];
    const flush = () => {
      const label = teamCells.find(([i]) => block.includes(i))?.[1];
      if (label) block.forEach((i) => (rows[i].__team = label));
      block = [];
    };
    for (let r = dRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const full = cellText(row[cName]);
      if (!full) {
        flush();
        continue;
      }
      block.push(r);
    }
    flush();
    for (let r = dRow + 1; r < rows.length; r++) {
      const row = rows[r] || [];
      const full = cellText(row[cName]);
      if (!full) continue;
      // « NOM Prénom » : les mots en majuscules sont le nom.
      const words = full.split(' ');
      // Une initiale (« M. ») est le début du prénom, pas le nom.
      const isInitial = (w) => /^[A-Za-zÀ-ÿ]\.?$/.test(w);
      const nomW = words.filter((w) => w === w.toUpperCase() && /[A-Z]/.test(w) && !isInitial(w));
      const preW = words.filter((w) => !nomW.includes(w)).map((w) => w.replace(/\.$/, ''));
      // Sans majuscules (« Collin ») : le premier mot est le nom.
      const p = nomW.length ? findOrCreatePerson(nomW.join(' '), preW.join(' '), true) : findOrCreatePerson(words[0], words.slice(1).join(' '), true);
      if (!p) continue;
      if (cPoste >= 0 && cellText(row[cPoste])) p.post = cellText(row[cPoste]);
      if (row.__team) p.team = row.__team;
      seen.add(p.id);
      dates.forEach((d, j) => {
        const code = cellText(row[j]);
        if (!d || !code || /^(eq|equipe)\s*\S+$/.test(norm(code))) return;
        // « DPP », « QMDPP », « QM DPP », « DPP-QAM »… : au bâtiment AI ce jour-là, avec le quart s'il est écrit.
        const dppCode = norm(code).replace(/ /g, '').match(/^(qam|qm|qn|qj)?dpp(qam|qm|qn|qj)?$/);
        if (dppCode) {
          (locs[d] = locs[d] || {})[p.id] = 'DPP';
          const sh = SHIFT_CODES[dppCode[1] || dppCode[2] || ''];
          if (sh) {
            (shifts[d] = shifts[d] || {})[p.id] = sh;
            nShifts++;
          }
          return;
        }
        const shift = SHIFT_CODES[norm(code)];
        if (shift) {
          (shifts[d] = shifts[d] || {})[p.id] = shift;
          nShifts++;
          return;
        }
        (abs[d] = abs[d] || {})[p.id] = { type: GRID_CODES[norm(code)] || code, raw: code };
        days++;
      });
    }
  }
  if (!found) return null;
  state.absImport = abs;
  state.shifts = shifts;
  state.locs = locs;
  mergePlanOnly();
  const unknown = state.people.filter((p) => p.planOnly && p.ambiguous).length;
  if (unknown) return `Planning importé. ${unknown} nom${unknown > 1 ? 's' : ''} à vérifier (homonymes) : voir Équipe.`;
  return `Planning importé : ${seen.size} personnes, ${days} jour${days > 1 ? 's' : ''} d’absence${nShifts ? `, ${nShifts} quart${nShifts > 1 ? 's' : ''} de travail` : ''}.`;
}

// L'exemple : les deux fichiers Excel publiés à côté de l'appli (noms inventés).
async function loadDemo() {
  toast('Je charge l’exemple…');
  try {
    for (const [kind, file] of [['hab', 'mes-habilitations.xlsx'], ['plan', 'planning-annuel.xlsx']]) {
      const res = await fetch('excel/' + file, { cache: 'no-store' });
      if (!res.ok) throw new Error(res.status);
      await importExcel(new File([await res.blob()], file), kind, false);
      delete state.links[kind];
    }
    save();
    render();
    toast('Exemple chargé : 29 personnes inventées.');
  } catch (e) {
    toast('Impossible de charger l’exemple : vérifie ta connexion internet.');
  }
}

setInterval(() => document.visibilityState === 'visible' && refreshLinks(false), 30000);

render();
refreshLinks(false);
