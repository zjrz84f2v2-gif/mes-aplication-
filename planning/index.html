<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Planning">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#ECEEF4">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&display=swap" rel="stylesheet">
<title>Notre planning</title>
<style>
/* Un agenda papier posé sur la table : feuille crème, encre noire, le jour même surligné au fluo.
   Chaque personne a sa couleur d'encre. */
:root {
  --paper: #ECEEF4;
  --card: #FFFFFF;
  --ink: #1E1C18;
  --ink-2: #5A554B;
  --ink-3: #8A8477;
  --line: rgba(30, 28, 24, .12);
  --accent: #2F5BD3;
  --accent-ink: #FFFFFF;
  --highlight: #FFE066;
  --danger: #B23A26;
  --ok: #2E7D4F;
  --radius: 18px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
  --display: "Bricolage Grotesque", var(--font);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  background: var(--paper);
  color: var(--ink);
  font: 17px/1.4 var(--font);
  -webkit-tap-highlight-color: transparent;
  -webkit-text-size-adjust: 100%;
  overscroll-behavior-y: contain;
}
::selection { background: var(--highlight); color: var(--ink); }
button, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); text-underline-offset: 3px; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
input, textarea { caret-color: var(--accent); }

#app { min-height: 100vh; padding: env(safe-area-inset-top) max(18px, env(safe-area-inset-right)) calc(110px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); max-width: 640px; margin: 0 auto; }

/* En-tête : nom du planning, qui en fait partie, inviter. */
.top { display: flex; align-items: center; gap: 12px; padding-top: 16px; }
.top h1 { font: 800 22px/1.15 var(--display); margin: 0; flex: 1; min-width: 0; letter-spacing: -.01em; }
.people { display: flex; }
.dot-avatar { width: 34px; height: 34px; border-radius: 50%; color: #fff; font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 0 3px var(--paper); }
.dot-avatar + .dot-avatar { margin-left: -8px; }
.icon-btn { min-height: 44px; padding: 0 14px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; }
.icon-btn svg { width: 18px; height: 18px; }
.sync { font-size: 13px; color: var(--ink-2); margin-top: 4px; display: flex; align-items: center; gap: 6px; }
.sync i { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); display: inline-block; }
.sync.off i { background: #C28A1A; }

/* Aujourd'hui, en grand. */
.today { margin-top: 18px; background: var(--card); border-radius: 24px; padding: 18px 18px 8px; box-shadow: 0 1px 0 rgba(30, 28, 24, .04), 0 10px 30px -18px rgba(30, 28, 24, .35); }
.today-date { font: 800 30px/1.05 var(--display); letter-spacing: -.02em; margin: 0; }
.today-date mark { background: linear-gradient(transparent 55%, var(--highlight) 55%, var(--highlight) 92%, transparent 92%); color: inherit; padding: 0 2px; }
.today-sub { color: var(--ink-2); font-size: 15px; margin: 4px 0 6px; }
.tomorrow { margin-top: 12px; border-top: 1px dashed var(--line); padding-top: 12px; }
.tomorrow h3 { margin: 0 0 2px; font: 700 15px/1.2 var(--font); color: var(--ink-2); }

/* Une activité. */
.ev { display: flex; align-items: flex-start; gap: 10px; padding: 8px 0; }
.check { width: 30px; height: 30px; border-radius: 9px; border: 2px solid var(--ink-3); background: transparent; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; padding: 0; margin-top: 1px; }
.check svg { width: 18px; height: 18px; opacity: 0; }
.ev.done .check { background: var(--ok); border-color: var(--ok); }
.ev.done .check svg { opacity: 1; }
.ev-body { flex: 1; min-width: 0; text-align: left; background: none; border: 0; padding: 2px 0; display: block; }
.ev-title { font-weight: 700; font-size: 17px; line-height: 1.3; display: block; overflow-wrap: anywhere; }
.ev.done .ev-title { text-decoration: line-through; text-decoration-thickness: 2px; color: var(--ink-3); }
.ev-meta { font-size: 14px; color: var(--ink-2); display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.ev-meta .who { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; }
.ev-meta .who i { width: 9px; height: 9px; border-radius: 50%; display: inline-block; }
.ev-time { font-variant-numeric: tabular-nums; font-weight: 800; color: var(--ink); }
.nothing { color: var(--ink-2); font-size: 15px; padding: 6px 0 12px; margin: 0; }

/* La semaine : une ligne par jour, comme un agenda papier. */
.week-head { display: flex; align-items: center; gap: 8px; margin: 30px 0 8px; }
.week-head h2 { flex: 1; margin: 0; font: 800 21px/1.2 var(--display); letter-spacing: -.01em; }
.nav { width: 44px; height: 44px; border-radius: 50%; border: 1.5px solid var(--line); background: var(--card); display: flex; align-items: center; justify-content: center; padding: 0; }
.nav svg { width: 18px; height: 18px; }
.back-now { min-height: 44px; border: 0; background: none; color: var(--accent); font-weight: 700; font-size: 15px; padding: 0 4px; }
/* Choix de la vue : semaine ou mois. */
.switch { display: flex; background: rgba(30, 28, 24, .07); border-radius: 14px; padding: 4px; margin-top: 26px; }
.switch button { flex: 1; min-height: 44px; border: 0; background: none; border-radius: 11px; font-weight: 700; font-size: 16px; color: var(--ink-2); }
.switch button[aria-pressed="true"] { background: var(--card); color: var(--ink); box-shadow: 0 2px 8px -3px rgba(30, 28, 24, .3); }
.switch + .week-head { margin-top: 18px; }
/* Le mois : une grille, des points de couleur sur les jours occupés. */
.month { background: var(--card); border-radius: var(--radius); box-shadow: 0 10px 30px -22px rgba(30, 28, 24, .4); padding: 10px 8px 8px; }
.month-names, .month-grid { display: grid; grid-template-columns: repeat(7, 1fr); }
.month-names span { text-align: center; font-size: 12px; font-weight: 700; color: var(--ink-2); padding: 2px 0 6px; text-transform: capitalize; }
.mday { min-height: 54px; border: 0; background: none; border-radius: 12px; padding: 6px 0 4px; display: flex; flex-direction: column; align-items: center; gap: 4px; font: 700 17px/1 var(--font); font-variant-numeric: tabular-nums; color: var(--ink); }
.mday.out { color: var(--ink-3); opacity: .5; }
.mday.past { color: var(--ink-3); }
.mday.is-today b { background: linear-gradient(transparent 45%, var(--highlight) 45%, var(--highlight) 95%, transparent 95%); padding: 0 3px; }
.mday[aria-pressed="true"] { background: var(--ink); color: var(--paper); }
.mday[aria-pressed="true"].is-today b { background: none; }
.mdots { display: flex; gap: 3px; height: 7px; }
.mdots i { width: 7px; height: 7px; border-radius: 50%; display: block; }
.mday[aria-pressed="true"] .mdots i { box-shadow: 0 0 0 1.5px var(--paper); }
.picked { margin-top: 14px; background: var(--card); border-radius: var(--radius); padding: 14px 14px 6px; box-shadow: 0 10px 30px -22px rgba(30, 28, 24, .4); }
.picked h3 { margin: 0 0 4px; font: 800 19px/1.2 var(--display); }
.picked .day-add { padding-left: 40px; }
.days { background: var(--card); border-radius: var(--radius); box-shadow: 0 10px 30px -22px rgba(30, 28, 24, .4); overflow: hidden; }
.day { display: grid; grid-template-columns: 64px 1fr; border-top: 1px solid var(--line); min-height: 64px; }
.day:first-child { border-top: 0; }
.day-num { padding: 12px 0 10px 14px; display: flex; flex-direction: column; }
.day-num b { font: 800 26px/1 var(--display); font-variant-numeric: tabular-nums; }
.day-num span { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-top: 3px; text-transform: capitalize; }
.day.is-today .day-num b { background: linear-gradient(transparent 50%, var(--highlight) 50%, var(--highlight) 95%, transparent 95%); align-self: flex-start; padding: 0 2px; margin-left: -2px; }
.day.is-past { background: rgba(30, 28, 24, .025); }
.day.is-past .day-num b { color: var(--ink-3); }
.day-list { padding: 4px 8px 4px 0; min-width: 0; display: flex; flex-direction: column; }
.day-add { align-self: stretch; min-height: 44px; border: 0; background: none; text-align: left; color: var(--ink-3); font-size: 15px; padding: 0 0 0 40px; border-radius: 10px; }
.day-list .ev + .day-add { min-height: 36px; }

/* Onglet Travail : un emploi du temps par personne, en couleurs. */
.legend { display: flex; flex-wrap: wrap; gap: 6px; margin: 0 0 10px; }
.tag { display: inline-flex; align-items: center; min-height: 26px; padding: 0 10px; border-radius: 999px; font-size: 13px; font-weight: 800; background: var(--c); color: var(--i); }
.work-sum { margin: 0 0 10px; display: flex; flex-direction: column; gap: 2px; }
.work-sum p { margin: 0; font-size: 14px; color: var(--ink-2); }
.work-sum b { color: var(--ink); }
.work { background: var(--card); border-radius: var(--radius); box-shadow: 0 10px 30px -22px rgba(30, 28, 24, .4); overflow: clip; }
.work-row { display: grid; grid-template-columns: 62px repeat(var(--cols), minmax(0, 1fr)); gap: 6px; padding: 4px 8px 4px 0; align-items: center; border-top: 1px solid var(--line); }
.work-row.wk { border-top: 2px solid rgba(30, 28, 24, .2); }
.work-names { position: sticky; top: 0; z-index: 2; background: var(--card); border-top: 0; padding-top: 10px; padding-bottom: 8px; box-shadow: 0 1px 0 var(--line); }
.work-names span { display: flex; align-items: center; justify-content: center; gap: 6px; min-width: 0; font-weight: 800; font-size: 15px; }
.work-names span em { font-style: normal; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.work-names i { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; }
.wday { padding-left: 12px; display: flex; align-items: baseline; gap: 5px; }
.wday b { font: 800 19px/1 var(--display); font-variant-numeric: tabular-nums; min-width: 1.3em; }
.wday span { font-size: 12px; font-weight: 700; color: var(--ink-2); text-transform: capitalize; }
.work-row.weekend .wday span { color: var(--accent); }
.work-row.is-today { background: rgba(255, 224, 102, .28); }
.work-row.is-today .wday b { background: linear-gradient(transparent 45%, var(--highlight) 45%, var(--highlight) 95%, transparent 95%); }
.work-row.is-past .wday b { color: var(--ink-3); }
.work-row.is-past .wcell { opacity: .55; }
.wcell { min-height: 40px; min-width: 0; border-radius: 10px; border: 0; padding: 3px 4px; background: var(--c); color: var(--i); font-weight: 800; font-size: 15px; line-height: 1.15; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.wcell small { display: block; font-size: 12px; font-weight: 700; opacity: .92; font-variant-numeric: tabular-nums; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
.hours { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.hours .field { width: auto; flex: 1 1 120px; max-width: 160px; }
.hours span { font-weight: 700; color: var(--ink-2); }
.wcell.empty { background: transparent; border: 1.5px dashed rgba(30, 28, 24, .14); color: var(--ink-3); font-weight: 600; font-size: 18px; }
.today-work { display: flex; flex-wrap: wrap; gap: 6px; margin: 2px 0 8px; }
.codes { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.code-btn { min-height: 58px; border-radius: 14px; border: 0; background: var(--c); color: var(--i); font-weight: 800; font-size: 17px; }
.code-btn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.who-pick { display: flex; gap: 8px; flex-wrap: wrap; }

/* Petit écran : l'en-tête garde la place pour le titre. */
@media (max-width: 430px) {
  .top { gap: 8px; }
  .top .btn-txt { display: none; }
  .top .icon-btn { width: 44px; padding: 0; justify-content: center; }
}

/* Accueil : deux grandes cartes, Planning et Courses. */
.home { display: flex; flex-direction: column; gap: 14px; margin-top: 22px; }
.home-card { display: flex; align-items: center; gap: 16px; width: 100%; text-align: left; border: 0; background: var(--card); border-radius: 24px; padding: 20px 18px; box-shadow: 0 1px 0 rgba(30, 28, 24, .04), 0 10px 30px -18px rgba(30, 28, 24, .35); color: var(--ink); }
.home-card .hc-icon { width: 58px; height: 58px; border-radius: 18px; flex: 0 0 auto; display: flex; align-items: center; justify-content: center; color: #fff; }
.home-card .hc-icon svg { width: 30px; height: 30px; }
.home-card b { display: block; font: 800 24px/1.1 var(--display); letter-spacing: -.01em; }
.home-card small { display: block; color: var(--ink-2); font-size: 15px; margin-top: 4px; }
.home-card .grow { flex: 1; min-width: 0; }
.home-card > svg { width: 22px; height: 22px; color: var(--ink-3); flex: 0 0 auto; }
.home-hello { font: 800 30px/1.05 var(--display); letter-spacing: -.02em; margin: 22px 0 0; }
.home-hello mark { background: linear-gradient(transparent 55%, var(--highlight) 55%, var(--highlight) 92%, transparent 92%); color: inherit; padding: 0 2px; }
.back-home { flex: 0 0 auto; }

/* Courses : liste à acheter, classée par urgence, et dates de péremption. */
.c-group { margin-top: 18px; }
.c-group h3 { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font: 800 18px/1.2 var(--display); }
.c-group h3 i { width: 12px; height: 12px; border-radius: 50%; }
.c-group h3 small { font: 600 14px var(--font); color: var(--ink-2); }
.c-list { background: var(--card); border-radius: var(--radius); box-shadow: 0 10px 30px -22px rgba(30, 28, 24, .4); overflow: hidden; }
.c-row { display: flex; align-items: center; gap: 10px; padding: 6px 12px; border-top: 1px solid var(--line); min-height: 56px; }
.c-row:first-child { border-top: 0; }
.c-row .ev-body { flex: 1; min-width: 0; }
.c-row .ev-title { overflow-wrap: anywhere; }
.c-row.bought .ev-title { text-decoration: line-through; color: var(--ink-3); }
.c-row.bought .check { background: var(--ok); border-color: var(--ok); }
.urg-btns { display: grid; grid-template-columns: 1fr; gap: 10px; }
.urg-btn { min-height: 58px; border-radius: 14px; border: 0; background: var(--c); color: var(--i); font-weight: 800; font-size: 17px; display: flex; align-items: center; justify-content: center; gap: 8px; }
.urg-btn[aria-pressed="true"] { box-shadow: 0 0 0 3px var(--paper), 0 0 0 6px var(--ink); }
.exp { flex: 0 0 auto; font-weight: 800; font-size: 14px; padding: 5px 10px; border-radius: 10px; white-space: nowrap; font-variant-numeric: tabular-nums; background: var(--c); color: var(--i); text-align: right; }
.exp small { display: block; font-weight: 600; font-size: 12px; opacity: .85; }
.photo-btn { position: relative; overflow: hidden; }
.photo-btn input { position: absolute; inset: 0; opacity: 0; font-size: 0; }
.ocr-state { margin: 10px 0 0; font-size: 15px; color: var(--ink-2); }
.ocr-state.err { color: var(--danger); font-weight: 600; }
.ocr-photo { display: block; max-width: 100%; max-height: 180px; border-radius: 14px; margin-top: 12px; }
.empty-box { background: var(--card); border-radius: var(--radius); padding: 22px 18px; text-align: center; color: var(--ink-2); margin-top: 14px; }
.empty-box b { display: block; color: var(--ink); font-size: 18px; margin-bottom: 4px; }

/* Gros bouton du bas. */
.footer { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px max(18px, env(safe-area-inset-right)) calc(12px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); background: linear-gradient(rgba(236, 238, 244, 0), var(--paper) 30%); z-index: 5; }
.footer .btn { max-width: 604px; margin: 0 auto; display: flex; }

/* Boutons. */
.btn { min-height: 56px; width: 100%; padding: 0 22px; border: 0; background: var(--accent); color: var(--accent-ink); font-weight: 800; font-size: 18px; border-radius: 16px; align-items: center; justify-content: center; gap: 8px; text-decoration: none; display: inline-flex; box-shadow: 0 8px 20px -10px rgba(47, 91, 211, .7); }
.btn svg { width: 22px; height: 22px; }
.btn.ghost { background: var(--card); color: var(--ink); border: 1.5px solid var(--line); box-shadow: none; font-weight: 700; font-size: 17px; }
.btn.danger { background: transparent; color: var(--danger); border: 1.5px solid rgba(178, 58, 38, .4); box-shadow: none; font-size: 17px; }
.btn:disabled { opacity: .5; }
.actions { display: flex; flex-direction: column; gap: 10px; margin-top: 22px; }

/* Feuilles (qui montent du bas). */
.sheet-back { position: fixed; inset: 0; background: rgba(30, 28, 24, .4); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--paper); width: 100%; max-width: 640px; max-height: 92%; overflow-y: auto; border-radius: 26px 26px 0 0; padding: 0 max(18px, env(safe-area-inset-right)) calc(24px + env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left)); }
.sheet .band { width: 40px; height: 5px; border-radius: 3px; background: rgba(30, 28, 24, .2); margin: 10px auto 0; }
.sheet-head { display: flex; align-items: flex-start; gap: 12px; padding-top: 14px; }
.sheet-head h3 { flex: 1; margin: 0; font: 800 24px/1.15 var(--display); letter-spacing: -.01em; overflow-wrap: anywhere; }
.close { width: 40px; height: 40px; border-radius: 50%; border: 0; background: rgba(30, 28, 24, .08); display: flex; align-items: center; justify-content: center; flex: 0 0 auto; padding: 0; }
.close svg { width: 16px; height: 16px; }
.label { display: block; font-weight: 700; font-size: 16px; margin: 20px 0 8px; }
.field { width: 100%; min-height: 54px; border: 1.5px solid var(--line); background: var(--card); border-radius: 14px; padding: 12px 14px; font-size: 18px; }
textarea.field { min-height: 90px; resize: vertical; font-size: 17px; }
.field::placeholder { color: var(--ink-3); }
.row { display: flex; gap: 10px; flex-wrap: wrap; }
.chip { min-height: 46px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--card); font-weight: 700; font-size: 16px; }
.chip[aria-pressed="true"] { background: var(--ink); border-color: var(--ink); color: var(--paper); }
.date-field { flex: 1 1 160px; }
.detail-meta { color: var(--ink-2); margin: 6px 0 0; font-size: 16px; }
.detail-note { background: var(--card); border-radius: 14px; padding: 12px 14px; margin: 14px 0 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.hint { color: var(--ink-2); font-size: 15px; margin: 8px 0 0; }

/* Mise en route. */
.hello { padding-top: 40px; }
.hello h1 { font: 800 40px/1 var(--display); letter-spacing: -.025em; margin: 0; }
.hello h1 mark { background: linear-gradient(transparent 55%, var(--highlight) 55%, var(--highlight) 92%, transparent 92%); color: inherit; padding: 0 3px; }
.hello p.lead { font-size: 18px; color: var(--ink-2); margin: 14px 0 0; max-width: 34ch; }
.steps { list-style: none; counter-reset: step; padding: 0; margin: 20px 0 0; display: flex; flex-direction: column; gap: 14px; }
.steps > li { counter-increment: step; background: var(--card); border-radius: var(--radius); padding: 16px; display: grid; grid-template-columns: 34px 1fr; gap: 12px; }
.steps > li::before { content: counter(step); width: 34px; height: 34px; border-radius: 50%; background: var(--highlight); font: 800 17px/34px var(--display); text-align: center; }
.steps > li > div { min-width: 0; }
.steps b.step-title { display: block; font-size: 17px; margin-top: 5px; }
.steps p { margin: 6px 0 0; color: var(--ink-2); font-size: 15px; }
.steps p strong { color: var(--ink); }
.copy-box { margin-top: 10px; background: var(--paper); border-radius: 12px; padding: 10px; font: 13px/1.45 ui-monospace, Menlo, monospace; white-space: pre; overflow-x: auto; color: var(--ink); }
.small-btn { margin-top: 10px; min-height: 44px; padding: 0 16px; border-radius: 999px; border: 1.5px solid var(--line); background: var(--paper); font-weight: 700; font-size: 15px; display: inline-flex; align-items: center; text-decoration: none; color: var(--ink); }
.error { color: var(--danger); font-weight: 600; font-size: 15px; margin: 10px 0 0; }
.status { color: var(--ink-2); font-size: 15px; margin: 10px 0 0; }
.banner { margin-top: 14px; background: var(--highlight); border-radius: 14px; padding: 12px 14px; font-size: 15px; display: flex; gap: 10px; align-items: flex-start; }
.banner p { margin: 0; flex: 1; }
.banner button { border: 0; background: none; font-weight: 800; min-height: 32px; padding: 0 4px; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(96px + env(safe-area-inset-bottom)); background: var(--ink); color: var(--paper); padding: 12px 18px; font-weight: 700; z-index: 30; max-width: calc(100% - 32px); text-align: center; border-radius: 999px; box-shadow: 0 10px 30px -10px rgba(0, 0, 0, .5); }

/* Retour visuel immédiat quand on touche. */

<body>
<div id="app"></div>
<script>
'use strict';

// ---------- Réglages gardés dans ce téléphone ----------
// Tout ce qu'il faut est aussi dans l'adresse de la page (?p=…&c=…&m=…) :
// ainsi l'app ajoutée à l'écran d'accueil de l'iPhone retrouve le planning.

const LOCAL_KEY = 'planning-v1';
const FB_VERSION = '12.17.1';
const COLORS = ['#2F5BD3', '#D9573B', '#2E7D4F', '#8A4FBF', '#B7791F', '#C2417A'];
const DEMO = new URLSearchParams(location.search).has('demo');

const RULES = `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    match /plannings/{planId}/{document=**} {
      allow read, write: if planId.size() >= 20;
    }
  }
}`;

function loadLocal() {
  try {
    return JSON.parse(localStorage.getItem(LOCAL_KEY)) || {};
  } catch (e) {
    return {};
  }
}
function saveLocal() {
  try {
    localStorage.setItem(LOCAL_KEY, JSON.stringify(local));
  } catch (e) {}
}

const b64 = (o) => btoa(unescape(encodeURIComponent(JSON.stringify(o)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
const unb64 = (s) => JSON.parse(decodeURIComponent(escape(atob(s.replace(/-/g, '+').replace(/_/g, '/')))));

let local = loadLocal();
(function readUrl() {
  const q = new URLSearchParams(location.search);
  try {
    if (q.get('c')) local.cfg = unb64(q.get('c'));
  } catch (e) {}
  if (q.get('p') && q.get('p') !== local.planId) {
    // Lien d'invitation vers un autre planning : on le rejoint (nouvelle identité dans ce planning).
    if (local.planId) delete local.memberId;
    local.planId = q.get('p');
  }
  if (q.get('m') && q.get('p') === local.planId) local.memberId = q.get('m');
  saveLocal();
})();

// L'adresse de la page porte le planning : l'icône de l'écran d'accueil l'ouvrira directement.
function syncUrl() {
  if (!local.planId || !local.cfg) return;
  const q = new URLSearchParams();
  if (DEMO) q.set('demo', '1');
  q.set('p', local.planId);
  q.set('c', b64(local.cfg));
  if (local.memberId) q.set('m', local.memberId);
  history.replaceState(null, '', location.pathname + '?' + q);
}

function inviteUrl() {
  const q = new URLSearchParams();
  if (DEMO) q.set('demo', '1');
  q.set('p', local.planId);
  q.set('c', b64(local.cfg));
  return location.origin + location.pathname + '?' + q;
}

const randomId = (n) => {
  const abc = 'abcdefghijkmnpqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  return Array.from(crypto.getRandomValues(new Uint8Array(n)), (x) => abc[x % abc.length]).join('');
};

// ---------- Le serveur (Firebase Firestore) ----------

const backend = DEMO ? demoBackend() : firebaseBackend();

function firebaseBackend() {
  let fs, db;
  return {
    async init(cfg) {
      if (db) return;
      const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
      const { initializeApp } = await import(base + 'firebase-app.js');
      fs = await import(base + 'firebase-firestore.js');
      const app = initializeApp({ apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, appId: cfg.appId });
      // Cache dans le téléphone : l'app marche hors connexion et envoie les changements plus tard.
      db = fs.initializeFirestore(app, { localCache: fs.persistentLocalCache({ tabManager: fs.persistentMultipleTabManager() }) });
    },
    createPlan: (p, data) => fs.setDoc(fs.doc(db, 'plannings', p), { ...data, createdAt: fs.serverTimestamp() }),
    joinPlan: (p, m, member) => fs.updateDoc(fs.doc(db, 'plannings', p), { ['members.' + m]: member }),
    watchPlan: (p, cb, err) =>
      fs.onSnapshot(fs.doc(db, 'plannings', p), { includeMetadataChanges: true }, (s) => cb(s.exists() ? s.data() : null, s.metadata), err),
    watchEvents: (p, since, cb, err) =>
      fs.onSnapshot(
        fs.query(fs.collection(db, 'plannings', p, 'events'), fs.where('date', '>=', since)),
        { includeMetadataChanges: true },
        (qs) => cb(qs.docs.map((d) => ({ ...d.data(), id: d.id })), qs.metadata),
        err,
      ),
    saveEvent: (p, ev) => fs.setDoc(fs.doc(db, 'plannings', p, 'events', ev.id), ev, { merge: true }),
    removeEvent: (p, id) => fs.deleteDoc(fs.doc(db, 'plannings', p, 'events', id)),
    // Emploi du temps travail : un document par personne et par jour (plannings/{p}/work/{membre}_{date}).
    watchWork: (p, since, cb, err) =>
      fs.onSnapshot(
        fs.query(fs.collection(db, 'plannings', p, 'work'), fs.where('date', '>=', since)),
        { includeMetadataChanges: true },
        (qs) => cb(qs.docs.map((d) => ({ ...d.data(), id: d.id })), qs.metadata),
        err,
      ),
    // Courses et dates de péremption : plannings/{p}/courses et plannings/{p}/stock.
    watchAll: (p, coll, cb, err) =>
      fs.onSnapshot(fs.collection(db, 'plannings', p, coll), { includeMetadataChanges: true }, (qs) => cb(qs.docs.map((d) => ({ ...d.data(), id: d.id })), qs.metadata), err),
    put: (p, coll, d) => fs.setDoc(fs.doc(db, 'plannings', p, coll, d.id), d, { merge: true }),
    del(p, coll, ids) {
      const b = fs.writeBatch(db);
      [].concat(ids).forEach((id) => b.delete(fs.doc(db, 'plannings', p, coll, id)));
      return b.commit();
    },
    saveWork(p, list, removeIds) {
      const b = fs.writeBatch(db);
      list.forEach((w) => b.set(fs.doc(db, 'plannings', p, 'work', w.id), w));
      (removeIds || []).forEach((id) => b.delete(fs.doc(db, 'plannings', p, 'work', id)));
      return b.commit();
    },
  };
}

// Mode démo (?demo=1) : même fonctionnement, rangé dans le navigateur (pour tester sans Firebase).
function demoBackend() {
  const K = 'planning-demo-db';
  const read = () => JSON.parse(localStorage.getItem(K) || '{}');
  const write = (dbv) => {
    localStorage.setItem(K, JSON.stringify(dbv));
    listeners.forEach((f) => f());
  };
  const listeners = new Set();
  addEventListener('storage', (e) => e.key === K && listeners.forEach((f) => f()));
  const meta = { hasPendingWrites: false, fromCache: false };
  return {
    async init() {},
    async createPlan(p, data) {
      const d = read();
      d[p] = { plan: { ...data, createdAt: Date.now() }, events: {} };
      write(d);
    },
    async joinPlan(p, m, member) {
      const d = read();
      if (!d[p]) throw Object.assign(new Error('absent'), { code: 'not-found' });
      d[p].plan.members[m] = member;
      write(d);
    },
    watchPlan(p, cb) {
      const f = () => cb(read()[p]?.plan || null, meta);
      listeners.add(f);
      setTimeout(f);
      return () => listeners.delete(f);
    },
    watchEvents(p, since, cb) {
      const f = () => cb(Object.values(read()[p]?.events || {}).filter((e) => e.date >= since), meta);
      listeners.add(f);
      setTimeout(f);
      return () => listeners.delete(f);
    },
    async saveEvent(p, ev) {
      const d = read();
      d[p].events[ev.id] = { ...(d[p].events[ev.id] || {}), ...ev };
      write(d);
    },
    async removeEvent(p, id) {
      const d = read();
      delete d[p].events[id];
      write(d);
    },
    watchWork(p, since, cb) {
      const f = () => cb(Object.values(read()[p]?.work || {}).filter((w) => w.date >= since), meta);
      listeners.add(f);
      setTimeout(f);
      return () => listeners.delete(f);
    },
    watchAll(p, coll, cb) {
      const f = () => cb(Object.values(read()[p]?.[coll] || {}), meta);
      listeners.add(f);
      setTimeout(f);
      return () => listeners.delete(f);
    },
    async put(p, coll, doc) {
      const d = read();
      d[p][coll] = d[p][coll] || {};
      d[p][coll][doc.id] = { ...(d[p][coll][doc.id] || {}), ...doc };
      write(d);
    },
    async del(p, coll, ids) {
      const d = read();
      [].concat(ids).forEach((id) => delete (d[p][coll] || {})[id]);
      write(d);
    },
    async saveWork(p, list, removeIds) {
      const d = read();
      d[p].work = d[p].work || {};
      list.forEach((w) => (d[p].work[w.id] = w));
      (removeIds || []).forEach((id) => delete d[p].work[id]);
      write(d);
    },
  };
}

// Les messages d'erreur de Firebase, en clair.
function explain(e) {
  const code = String(e?.code || e?.message || '');
  if (code.includes('permission-denied')) return 'Firebase refuse l’accès : vérifie que tu as bien collé et publié les règles dans l’onglet Sécurité (étape 3).';
  if (code.includes('not-found') || code.includes('does not exist')) return 'La base Firestore n’existe pas encore : refais l’étape 2 (« Créer une base de données »).';
  if (code.includes('invalid-api-key') || code.includes('api-key')) return 'Le code collé n’est pas le bon : recopie tout le bloc « firebaseConfig » (étape 4).';
  if (code.includes('timeout')) return 'Firebase ne répond pas. Vérifie ta connexion internet et que la base Firestore est bien créée (étape 2).';
  return 'Ça n’a pas marché (' + code.slice(0, 80) + '). Vérifie ta connexion, puis réessaie.';
}

const withTimeout = (promise, ms) =>
  Promise.race([promise, new Promise((_, reject) => setTimeout(() => reject(Object.assign(new Error('timeout'), { code: 'timeout' })), ms))]);

// ---------- Dates ----------

const pad = (n) => String(n).padStart(2, '0');
const iso = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const parseIso = (s) => {
  const [y, m, d] = s.split('-').map(Number);
  return new Date(y, m - 1, d);
};
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const startOfWeek = (d) => addDays(d, -((d.getDay() + 6) % 7));
const firstOfMonth = (d) => new Date(d.getFullYear(), d.getMonth(), 1);
const todayIso = () => iso(new Date());
const fmt = (d, o) => d.toLocaleDateString('fr-FR', o);
const capital = (s) => s.charAt(0).toUpperCase() + s.slice(1);

function dayLabel(s) {
  const t = todayIso();
  if (s === t) return 'aujourd’hui';
  if (s === iso(addDays(new Date(), 1))) return 'demain';
  if (s === iso(addDays(new Date(), -1))) return 'hier';
  return fmt(parseIso(s), { weekday: 'long', day: 'numeric', month: 'long' });
}

// ---------- État de l'écran ----------

let plan = null; // { name, members: { id: { name, color } } }
let events = [];
let courses = []; // { id, name, urg: 'U'|'B'|'P', bought, by, createdAt, updatedAt }
let stock = []; // { id, name, date, by, createdAt, updatedAt } : dates de péremption
let work = []; // { id: membre_date, member, date, code, by, updatedAt }

// Les couleurs du travail : vert le matin, orange l'après-midi, violet la nuit.
const WORK = {
  M: { one: 'matin', pl: 'matins', label: 'Matin', short: 'Matin', c: '#2E7D4F', i: '#fff' },
  AM: { one: 'aprèm', pl: 'aprèm', label: 'Après-midi', short: 'Aprèm', c: '#C2570C', i: '#fff' },
  N: { one: 'nuit', pl: 'nuits', label: 'Nuit', short: 'Nuit', c: '#6B3FBF', i: '#fff' },
  J: { one: 'journée', pl: 'journées', label: 'Journée', short: 'Journée', c: '#1F6F8B', i: '#fff' },
  ECOLE: { one: 'jour d’école', pl: 'jours d’école', label: 'École', short: 'École', c: '#2F5BD3', i: '#fff' },
  RTT: { one: 'RTT', pl: 'RTT', label: 'RTT', short: 'RTT', c: '#FFE066', i: '#1E1C18' },
  CP: { one: 'congé payé', pl: 'congés payés', label: 'Congé payé', short: 'CP', c: '#CDEFF1', i: '#0E5560' },
  MAL: { one: 'jour de maladie', pl: 'jours de maladie', label: 'Arrêt maladie', short: 'Maladie', c: '#B23A26', i: '#fff' },
};
const workId = (m, day) => `${m}_${day}`;
// « 06:00 » → « 6h », « 13:30 » → « 13h30 ».
const hh = (t) => (t ? `${Number(t.slice(0, 2))}h${t.slice(3, 5) === '00' ? '' : t.slice(3, 5)}` : '');
const workHours = (w) => (w?.start || w?.end ? `${hh(w.start) || '?'}–${hh(w.end) || '?'}` : '');
const workOn = (m, day) => work.find((w) => w.member === m && w.date === day);
const tagHtml = (code, text) => (WORK[code] ? `<span class="tag" style="--c:${WORK[code].c};--i:${WORK[code].i}">${esc(text ?? WORK[code].label)}</span>` : '');
// Moi d'abord, puis les autres.
const memberIds = () => Object.keys(plan?.members || {}).sort((a, b) => (b === local.memberId) - (a === local.memberId));

function workLine(day) {
  const tags = memberIds()
    .map((m) => [m, workOn(m, day)])
    .filter(([, w]) => w && WORK[w.code])
    .map(([m, w]) => tagHtml(w.code, `${member(m).name} · ${WORK[w.code].short}${workHours(w) ? ' ' + workHours(w) : ''}`));
  return tags.length ? `<div class="today-work" aria-label="Travail">${tags.join('')}</div>` : '';
}
let synced = true;
let ui = { weekStart: startOfWeek(new Date()), month: firstOfMonth(new Date()), selected: iso(new Date()), view: ['week', 'month', 'work'].includes(local.view) ? local.view : 'week', section: null, cview: local.cview === 'stock' ? 'stock' : 'list', screen: 'loading', error: '' };
const app = document.getElementById('app');

const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

let toastTimer;
function toast(text) {
  document.querySelector('.toast')?.remove();
  const el = document.createElement('div');
  el.className = 'toast';
  el.setAttribute('role', 'status');
  el.textContent = text;
  document.body.appendChild(el);
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => el.remove(), 2200);
}

const icons = {
  reload: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12a9 9 0 1 1-9-9c2.52 0 4.93 1 6.74 2.74L21 8"/><path d="M21 3v5h-5"/></svg>',
  cart: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 4h2.5l2.2 10.5a1.5 1.5 0 0 0 1.5 1.2h8.6a1.5 1.5 0 0 0 1.5-1.1L21 8H6.3"/><circle cx="10" cy="20" r="1.4"/><circle cx="17.5" cy="20" r="1.4"/></svg>',
  calendar: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M8 14h3M8 17h6"/></svg>',
  camera: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l1.8-2.5h6.4L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.5"/></svg>',
  plus: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>',
  invite: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M19 8v6M16 11h6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>',
  check: '<svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg>',
  close: '<svg viewBox="0 0 22 22" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M4 4l14 14M18 4L4 18"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M8 3v4M16 3v4M3.5 10h17M12 13v4M10 15h4"/></svg>',
};

const member = (id) => plan?.members?.[id] || { name: 'Quelqu’un', color: '#8A8477' };

// ---------- Écrans ----------

function render() {
  const screens = { loading: renderLoading, welcome: renderWelcome, setup: renderSetup, name: renderName, main: () => (ui.section === 'courses' ? renderCourses() : ui.section === 'planning' ? renderMain() : renderHome()), error: renderError };
  app.innerHTML = screens[ui.screen]();
  document.querySelector('.footer')?.remove();
  if (ui.screen === 'main' && ui.section) {
    const f = document.createElement('div');
    f.className = 'footer';
    f.innerHTML = ui.section === 'courses'
      ? ui.cview === 'stock'
        ? `<button class="btn" data-action="add-stock">${icons.plus} Ajouter un produit</button>`
        : `<button class="btn" data-action="add-course">${icons.plus} Ajouter à la liste</button>`
      : ui.view === 'work'
      ? `<button class="btn" data-work="${esc(local.memberId)}|${todayIso()}">${icons.plus} Ajouter mon travail</button>`
      : `<button class="btn" data-add="${todayIso()}">${icons.plus} Ajouter</button>`;
    document.body.appendChild(f);
  }
  bind();
}

const renderLoading = () => `<p class="status" style="padding-top:40px">Je charge le planning…</p>`;

function renderError() {
  return `<div class="hello"><h1>Oups</h1><p class="lead">${esc(ui.error)}</p>
    <div class="actions"><button class="btn" data-action="reload">Réessayer</button>
    <button class="btn ghost" data-action="reset">Recommencer à zéro</button></div></div>`;
}

function renderWelcome() {
  return `<div class="hello">
    <h1>Notre <mark>planning</mark></h1>
    <p class="lead">Écrivez ce que vous avez prévu, jour par jour, et invitez la personne de votre choix pour avoir le même planning tous les deux.</p>
    <div class="actions"><button class="btn" data-action="setup">Créer notre planning</button></div>
    <p class="hint">Tu as reçu une invitation ? Ouvre simplement le lien qu’on t’a envoyé.</p>
  </div>`;
}

// Mise en route : créer la base Firebase gratuite (une seule fois).
function renderSetup() {
  if (local.cfg) return renderName();
  return `<div class="hello" style="padding-top:24px">
    <h1>Une seule fois</h1>
    <p class="lead">Le planning est rangé dans une base gratuite de Google (Firebase). Tu la crées une fois, ensuite la personne invitée n’aura rien à faire.</p>
    <ol class="steps">
      <li><div><b class="step-title">Crée le projet</b>

        <a class="small-btn" href="https://console.firebase.google.com/" target="_blank" rel="noopener">Ouvrir Firebase</a></div></li>
      <li><div><b class="step-title">Crée la base</b>
        <p>Dans le menu : <strong>Créer</strong> (ou « Build ») › <strong>Firestore Database</strong> › <strong>Créer une base de données</strong>. Emplacement : <strong>eur3 (Europe)</strong>. Choisis <strong>mode production</strong>, puis <strong>Créer</strong>.</p></div></li>
      <li><div><b class="step-title">Colle les règles</b>
        <p>Dans Firestore, onglet <strong>Sécurité</strong> (ou « Règles ») : efface tout, colle ce texte, puis <strong>Publier</strong>. Il autorise seulement les personnes qui ont votre lien secret.</p>
        <div class="copy-box">${esc(RULES)}</div>
        <button class="small-btn" data-copy="rules">Copier les règles</button></div></li>
      <li><div><b class="step-title">Récupère le code</b>

}

// Ton prénom (et, pour la personne qui crée, le nom du planning).

    <button class="ev-body" data-open="${esc(e.id)}">
      <span class="ev-title">${esc(e.title)}</span>
      <span class="ev-meta">${e.time ? `<span class="ev-time">${esc(e.time.replace(':', ' h '))}</span>` : ''}<span class="who"><i style="background:${esc(m.color)}"></i>${esc(m.name)}</span>${e.note ? '<span>· note</span>' : ''}</span>

const sortEvents = (list) => list.slice().sort((a, b) => (a.time || '99') .localeCompare(b.time || '99') || (a.createdAt || 0) - (b.createdAt || 0));
const eventsOn = (day) => sortEvents(events.filter((e) => e.date === day));

// Accueil : deux choix, le planning ou les courses.
function renderHome() {
  const t = todayIso();
  const todays = eventsOn(t);
  const left = todays.filter((e) => !e.done).length;
  const toBuy = courses.filter((c) => !c.bought);
  const urgent = toBuy.filter((c) => c.urg === 'U').length;

  const planSub = [left ? `${left} chose${left > 1 ? 's' : ''} à faire aujourd’hui` : 'Rien à faire aujourd’hui', mine && WORK[mine.code] ? `${WORK[mine.code].label.toLowerCase()}${workHours(mine) ? ' ' + workHours(mine) : ''}` : ''].filter(Boolean).join(' · ');
  const courseSub = [toBuy.length ? `${toBuy.length} article${toBuy.length > 1 ? 's' : ''} à acheter${urgent ? ` dont ${urgent} urgent${urgent > 1 ? 's' : ''}` : ''}` : 'Liste vide', soon ? `${soon} produit${soon > 1 ? 's' : ''} à manger vite` : ''].filter(Boolean).join(' · ');

    <div class="home">
      <button class="home-card" data-section="planning"><span class="hc-icon" style="background:var(--accent)">${icons.calendar}</span><span class="grow"><b>Planning</b><small>${esc(planSub)}</small></span>${icons.right}</button>
      <button class="home-card" data-section="courses"><span class="hc-icon" style="background:#2E7D4F">${icons.cart}</span><span class="grow"><b>Courses</b><small>${esc(courseSub)}</small></span>${icons.right}</button>
    </div>`;

}

function renderMain() {
  const today = new Date();
  const t = iso(today);
  const tomorrow = iso(addDays(today, 1));
  const todays = eventsOn(t);
  const left = todays.filter((e) => !e.done).length;
  let html = `${topHtml(plan.name, true)}`;


  html += `<section class="today" aria-label="Aujourd’hui">
      <h2 class="today-date"><mark>${esc(capital(fmt(today, { weekday: 'long' })))}</mark> ${esc(fmt(today, { day: 'numeric', month: 'long' }))}</h2>
      <p class="today-sub">${todays.length ? (left ? `${left} chose${left > 1 ? 's' : ''} à faire aujourd’hui` : 'Tout est fait pour aujourd’hui, bravo !') : 'Rien de prévu aujourd’hui.'}</p>
      ${workLine(t)}
      ${todays.map(evHtml).join('')}
      <div class="tomorrow"><h3>Demain</h3>${workLine(tomorrow)}${eventsOn(tomorrow).map(evHtml).join('') || '<p class="nothing">Rien de prévu pour l’instant.</p>'}</div>
    </section>`;

  html += `<div class="switch" role="group" aria-label="Affichage">
      <button data-view="week" aria-pressed="${ui.view === 'week'}">Semaine</button>
      <button data-view="month" aria-pressed="${ui.view === 'month'}">Mois</button>
      <button data-view="work" aria-pressed="${ui.view === 'work'}">Travail</button>
    </div>`;
  return html + (ui.view === 'work' ? workHtml(today) : ui.view === 'month' ? monthHtml(today) : weekHtml(today));
}

function weekHtml(today) {
  const t = iso(today);
  let html = '';
  const ws = ui.weekStart;
  const we = addDays(ws, 6);
  const isThisWeek = iso(ws) === iso(startOfWeek(today));
  const range = ws.getMonth() === we.getMonth() ? `${ws.getDate()} au ${fmt(we, { day: 'numeric', month: 'long' })}` : `${fmt(ws, { day: 'numeric', month: 'short' })} au ${fmt(we, { day: 'numeric', month: 'short' })}`;
  const offset = Math.round((ws - startOfWeek(today)) / (7 * 864e5));
  const weekName = offset === 0 ? 'Cette semaine' : offset === 1 ? 'Semaine prochaine' : offset === -1 ? 'Semaine dernière' : capital(range);
  html += `<div class="week-head">
      <h2>${esc(weekName)}</h2>
      ${isThisWeek ? '' : '<button class="back-now" data-action="this-week">Aujourd’hui</button>'}
      <button class="nav" data-week="-1" aria-label="Semaine précédente">${icons.left}</button>
      <button class="nav" data-week="1" aria-label="Semaine suivante">${icons.right}</button>
    </div>
    ${Math.abs(offset) <= 1 ? `<p class="hint" style="margin:-4px 0 10px">Du ${esc(range)}</p>` : ''}
    <div class="days">`;
  for (let i = 0; i < 7; i++) {
    const d = addDays(ws, i);
    const ds = iso(d);
    const list = eventsOn(ds);
    html += `<div class="day${ds === t ? ' is-today' : ''}${ds < t ? ' is-past' : ''}">
        <div class="day-num"><b>${d.getDate()}</b><span>${esc(fmt(d, { weekday: 'short' }).replace('.', ''))}</span></div>
        <div class="day-list">${list.map(evHtml).join('')}<button class="day-add" data-add="${ds}" aria-label="Ajouter le ${esc(fmt(d, { weekday: 'long', day: 'numeric', month: 'long' }))}">+ Ajouter</button></div>
      </div>`;
  }
  html += `</div>`;
  return html;
}

function monthHtml(today) {
  const t = iso(today);
  const m0 = ui.month;
  const isThisMonth = iso(m0) === iso(firstOfMonth(today));
  const gridStart = startOfWeek(m0);
  const last = new Date(m0.getFullYear(), m0.getMonth() + 1, 0);
  const gridEnd = addDays(startOfWeek(last), 6);
  let html = `<div class="week-head">
      <h2>${esc(capital(fmt(m0, { month: 'long', year: 'numeric' })))}</h2>
      ${isThisMonth ? '' : '<button class="back-now" data-action="this-week">Aujourd’hui</button>'}
      <button class="nav" data-month="-1" aria-label="Mois précédent">${icons.left}</button>
      <button class="nav" data-month="1" aria-label="Mois suivant">${icons.right}</button>
    </div>
    <div class="month">
      <div class="month-names" aria-hidden="true">${[0, 1, 2, 3, 4, 5, 6].map((i) => `<span>${esc(fmt(addDays(gridStart, i), { weekday: 'short' }).replace('.', '').slice(0, 3))}</span>`).join('')}</div>
      <div class="month-grid">`;
  for (let d = gridStart; d <= gridEnd; d = addDays(d, 1)) {
    const ds = iso(d);
    const list = eventsOn(ds);
    const label = `${fmt(d, { weekday: 'long', day: 'numeric', month: 'long' })}${list.length ? ', ' + list.length + ' activité' + (list.length > 1 ? 's' : '') : ''}`;
    html += `<button class="mday${d.getMonth() !== m0.getMonth() ? ' out' : ''}${ds === t ? ' is-today' : ''}${ds < t ? ' past' : ''}" data-pick-day="${ds}" aria-pressed="${ds === ui.selected}" aria-label="${esc(label)}">
        <b>${d.getDate()}</b><span class="mdots">${list.slice(0, 3).map((e) => `<i style="background:${esc(member(e.by).color)}"></i>`).join('')}</span>
      </button>`;
  }
  const sel = ui.selected;
  const list = eventsOn(sel);
  html += `</div></div>
    <section class="picked" aria-live="polite">
      <h3>${esc(capital(dayLabel(sel)))}</h3>
      ${list.map(evHtml).join('') || '<p class="nothing">Rien de prévu ce jour-là.</p>'}
      <button class="day-add" data-add="${sel}">+ Ajouter ce jour-là</button>
    </section>`;
  return html;
}

// L'emploi du temps travail du mois : une colonne par personne.
function workHtml(today) {
  const t = iso(today);
  const m0 = ui.month;
  const isThisMonth = iso(m0) === iso(firstOfMonth(today));
  const ids = memberIds();
  const last = new Date(m0.getFullYear(), m0.getMonth() + 1, 0).getDate();
  let html = `<div class="week-head">
      <h2>${esc(capital(fmt(m0, { month: 'long', year: 'numeric' })))}</h2>
      ${isThisMonth ? '' : '<button class="back-now" data-action="this-week">Aujourd’hui</button>'}
      <button class="nav" data-month="-1" aria-label="Mois précédent">${icons.left}</button>
      <button class="nav" data-month="1" aria-label="Mois suivant">${icons.right}</button>
    </div>
    <div class="legend-row"><div class="legend">${['M', 'AM', 'N'].map((c) => tagHtml(c)).join('')}</div><button class="small-btn" data-action="work-export" style="margin:0">Télécharger</button></div>`;
  // Le compte du mois pour chacun.
  const sums = ids
    .map((m) => {
      const n = {};
      for (let d = 1; d <= last; d++) {
        const w = workOn(m, iso(new Date(m0.getFullYear(), m0.getMonth(), d)));
        if (w && WORK[w.code]) n[w.code] = (n[w.code] || 0) + 1;
      }
      const parts = Object.keys(WORK).filter((c) => n[c]).map((c) => `${n[c]} ${n[c] > 1 ? WORK[c].pl : WORK[c].one}`);
      return parts.length ? `<p><b>${esc(member(m).name)}</b> : ${esc(parts.join(' · '))}</p>` : '';
    })
    .join('');
  if (sums) html += `<div class="work-sum">${sums}</div>`;
  html += `<div class="work" style="--cols:${ids.length}">
      <div class="work-row work-names"><span></span>${ids.map((m) => `<span><i style="background:${esc(member(m).color)}"></i><em>${esc(member(m).name)}</em></span>`).join('')}</div>`;
  for (let day = 1; day <= last; day++) {
    const d = new Date(m0.getFullYear(), m0.getMonth(), day);
    const ds = iso(d);
    const wd = d.getDay();
    const cls = `${wd === 1 && day > 1 ? ' wk' : ''}${wd === 0 || wd === 6 ? ' weekend' : ''}${ds === t ? ' is-today' : ''}${ds < t ? ' is-past' : ''}`;
    const long = fmt(d, { weekday: 'long', day: 'numeric', month: 'long' });
    html += `<div class="work-row${cls}">
        <div class="wday"><b>${day}</b><span>${esc(fmt(d, { weekday: 'short' }).replace('.', ''))}</span></div>
        ${ids
          .map((m) => {
            const w = workOn(m, ds);
            const k = w && WORK[w.code];
            const label = `${member(m).name}, ${long} : ${k ? k.label + (workHours(w) ? ' de ' + workHours(w).replace('–', ' à ') : '') : 'rien'}. Modifier`;
            return k
              ? `<button class="wcell" style="--c:${k.c};--i:${k.i}" data-work="${esc(m)}|${ds}" aria-label="${esc(label)}">${esc(k.short)}${workHours(w) ? `<small>${esc(workHours(w))}</small>` : ''}</button>`
              : `<button class="wcell empty" data-work="${esc(m)}|${ds}" aria-label="${esc(label)}">+</button>`;
          })
          .join('')}
      </div>`;
  }
  html += `</div>
    <p class="hint">Touche une case pour mettre ou changer le travail de ce jour-là. Chacun remplit sa colonne.</p>`;
  return html;
}

// ---------- Courses ----------

// Urgence d'un article : rouge, orange, gris.
const URG = {
  U: { label: 'Urgent', c: '#B23A26', i: '#fff', hint: 'à racheter tout de suite' },
  B: { label: 'Bientôt', c: '#C2570C', i: '#fff', hint: 'à la prochaine course' },
  P: { label: 'Pas urgent', c: '#5A554B', i: '#fff', hint: 'pas pour l’instant' },
};
const daysLeft = (d) => Math.round((parseIso(d) - parseIso(todayIso())) / 864e5);
// Couleur d'une date de péremption : rouge = périmé ou dans 2 jours, orange = dans la semaine, vert = ça va.
function expInfo(d) {
  const n = daysLeft(d);
  const short = parseIso(d).toLocaleDateString('fr-FR', { day: 'numeric', month: 'short' }).replace('.', '');
  if (n < 0) return { c: '#7A1F12', i: '#fff', text: 'Périmé', small: `depuis ${-n} j` };
  if (n === 0) return { c: '#B23A26', i: '#fff', text: 'Aujourd’hui', small: short };
  if (n <= 2) return { c: '#B23A26', i: '#fff', text: n === 1 ? 'Demain' : `Dans ${n} j`, small: short };
  if (n <= 7) return { c: '#C2570C', i: '#fff', text: `Dans ${n} j`, small: short };
  return { c: '#DCEFE2', i: '#1F5A37', text: short, small: `dans ${n} j` };
}

function renderCourses() {
  let html = topHtml('Courses', true);
  html += `<div class="switch" role="group" aria-label="Courses" style="margin-top:18px">
      <button data-cview="list" aria-pressed="${ui.cview !== 'stock'}">À acheter</button>
      <button data-cview="stock" aria-pressed="${ui.cview === 'stock'}">Péremption</button>
    </div>`;
  return html + (ui.cview === 'stock' ? stockHtml() : listHtml());
}

function listHtml() {
  const by = (a, b) => (a.createdAt || 0) - (b.createdAt || 0);
  const row = (c) => `<div class="c-row${c.bought ? ' bought' : ''}">
      <button class="check" data-buy="${esc(c.id)}" aria-label="${c.bought ? 'Pas encore acheté' : 'Acheté'} : ${esc(c.name)}" aria-pressed="${!!c.bought}">${icons.check}</button>
      <button class="ev-body" data-course="${esc(c.id)}"><span class="ev-title">${esc(c.name)}</span><span class="ev-meta"><span class="who"><i style="background:${esc(member(c.by).color)}"></i>${esc(member(c.by).name)}</span></span></button>
    </div>`;
  const toBuy = courses.filter((c) => !c.bought);
  const bought = courses.filter((c) => c.bought).sort((a, b) => (b.updatedAt || 0) - (a.updatedAt || 0));
  if (!courses.length)
    return `<div class="empty-box"><b>La liste est vide</b>Touche « Ajouter à la liste » en bas : écris ce qu’il faut racheter, puis choisis si c’est urgent.</div>`;
  let html = '';
  for (const [k, u] of Object.entries(URG)) {
    const list = toBuy.filter((c) => (c.urg || 'B') === k).sort(by);
    if (!list.length) continue;
    html += `<section class="c-group"><h3><i style="background:${u.c}"></i>${u.label} <small>${list.length} · ${u.hint}</small></h3><div class="c-list">${list.map(row).join('')}</div></section>`;
  }
  if (!toBuy.length) html += `<p class="hint" style="margin-top:16px">Tout est acheté, bravo !</p>`;
  if (bought.length)
    html += `<section class="c-group"><h3><i style="background:var(--ok)"></i>Dans le panier <small>${bought.length}</small></h3><div class="c-list">${bought.map(row).join('')}</div>
      <button class="small-btn" data-action="clear-bought">Vider le panier (enlever les articles achetés)</button></section>`;
  return html;
}

function stockHtml() {
  if (!stock.length)
    return `<div class="empty-box"><b>Aucun produit pour l’instant</b>Touche « Ajouter un produit » en bas : écris le nom et la date, ou prends le produit en photo pour que l’appli les lise.</div>`;
  const list = stock.slice().sort((a, b) => (a.date || '9999').localeCompare(b.date || '9999'));
  return `<p class="hint" style="margin-top:14px">Du plus urgent au plus lointain. Rouge = à manger tout de suite, orange = dans la semaine.</p>
    <div class="c-list" style="margin-top:10px">${list
      .map((x) => {
        const e = x.date ? expInfo(x.date) : { c: 'rgba(30,28,24,.08)', i: 'var(--ink-2)', text: 'Sans date', small: '' };
        return `<div class="c-row"><button class="ev-body" data-stock="${esc(x.id)}" style="display:flex;align-items:center;gap:10px"><span style="flex:1;min-width:0"><span class="ev-title">${esc(x.name)}</span><span class="ev-meta"><span class="who"><i style="background:${esc(member(x.by).color)}"></i>${esc(member(x.by).name)}</span></span></span><span class="exp" style="--c:${e.c};--i:${e.i}">${esc(e.text)}${e.small ? `<small>${esc(e.small)}</small>` : ''}</span></button></div>`;
      })
      .join('')}</div>`;
}

function saveCourse(c) {
  const i = courses.findIndex((x) => x.id === c.id);
  if (i >= 0) courses[i] = { ...courses[i], ...c };
  else courses.push(c);
  backend.put(local.planId, 'courses', c).catch((err) => toast(explain(err)));
}

function toggleBought(id) {
  const c = courses.find((x) => x.id === id);
  if (!c) return;
  saveCourse({ id, bought: !c.bought, updatedAt: Date.now() });
  render();
  if (!c.bought) toast('Dans le panier !');
}

// Ajouter (ou modifier) un article : on écrit, puis on touche l'urgence.
function openCourse(id) {
  const cur = id ? courses.find((x) => x.id === id) : null;
  let confirmDel = false;
  const back = showSheet(`<div class="sheet-head"><h3>${cur ? 'Modifier' : 'À acheter'}</h3>${closeBtn}</div>
    <form id="c-form">
      <label class="label" for="c-name">Qu’est-ce qu’il faut racheter ?</label>
      <input id="c-name" class="field" value="${esc(cur?.name || '')}" placeholder="ex. Lait, papier toilette…" enterkeyhint="done" maxlength="80" autocomplete="off">
      <span class="label">Puis touche l’urgence</span>
      <div class="urg-btns">${Object.entries(URG).map(([k, u]) => `<button type="button" class="urg-btn" style="--c:${u.c};--i:${u.i}" data-urg="${k}" aria-pressed="${cur?.urg === k}">${u.label}<span style="font-weight:600;font-size:14px;opacity:.85">· ${u.hint}</span></button>`).join('')}</div>
    </form>

    } catch (err) {
      state.className = 'ocr-state err';
      state.textContent = 'Impossible de lire la photo (connexion internet ?). Écris le nom et la date à la main.';

  back.querySelector('#s-form').addEventListener('submit', (e) => {
    e.preventDefault();

      toast('Supprimé.');

// ---------- Lire une étiquette en photo (reconnaissance de texte, dans le téléphone) ----------

const TESSERACT_URL = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
let ocrWorker = null;
let ocrProgress = () => {};
async function getOcr() {
  if (!window.Tesseract)
    await new Promise((ok, ko) => {
      const sc = document.createElement('script');
      sc.src = TESSERACT_URL;
      sc.onload = ok;
      sc.onerror = () => ko(new Error('tesseract'));
      document.head.appendChild(sc);
    });
  if (!ocrWorker) ocrWorker = await Tesseract.createWorker('fra', 1, { logger: (m) => m.status === 'recognizing text' && ocrProgress(Math.round(m.progress * 100)) });
  return ocrWorker;
}

// Photo réduite et en niveaux de gris : plus rapide et plus lisible.
async function prepareImage(file) {
  const img = await new Promise((ok, ko) => {
    const im = new Image();
    im.onload = () => ok(im);
    im.onerror = ko;
    im.src = URL.createObjectURL(file);
  });
  const k = Math.min(1, 1800 / Math.max(img.naturalWidth, img.naturalHeight));
  const cv = document.createElement('canvas');
  cv.width = Math.round(img.naturalWidth * k);
  cv.height = Math.round(img.naturalHeight * k);
  const cx = cv.getContext('2d');
  cx.filter = 'grayscale(1) contrast(1.4)';
  cx.drawImage(img, 0, 0, cv.width, cv.height);
  return cv;
}

async function readLabel(file, onProgress) {
  ocrProgress = onProgress || (() => {});
  const w = await getOcr();
  const { data } = await w.recognize(await prepareImage(file));
  const lines = (data.lines || []).map((l) => ({ text: l.text, h: l.bbox ? l.bbox.y1 - l.bbox.y0 : 0, conf: l.confidence }));
  return { date: parseExpiry(data.text || ''), name: guessName(lines) };
}

// Trouve la date de péremption dans le texte lu : « 12/05/27 », « 12.05.2027 », « 12 MAI 2027 », « 05/2027 »…
function parseExpiry(raw) {
  let t = ' ' + String(raw).replace(/\r/g, '') + ' ';
  // Les lettres que la lecture confond avec des chiffres (O → 0, l → 1) dans les dates.
  t = t.replace(/[0-9OoIl|]{1,4}(?:\s?[\/.\-]\s?[0-9OoIl|]{1,4}){1,2}/g, (m) => m.replace(/[Oo]/g, '0').replace(/[Il|]/g, '1'));
  const tn = t.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
  const cands = [];
  const push = (y, m, d, idx) => {
    if (y < 100) y += 2000;
    if (y < 2015 || y > 2045 || !(m >= 1 && m <= 12)) return;
    const last = new Date(y, m, 0).getDate();
    if (d == null) d = last;
    if (d < 1 || d > last) return;
    cands.push({ date: iso(new Date(y, m - 1, d)), idx });
  };
  for (const m of tn.matchAll(/(?<!\d)(\d{1,2})\s?[\/.\-]\s?(\d{1,2})\s?[\/.\-]\s?(\d{4}|\d{2})(?!\d)/g)) push(+m[3], +m[2], +m[1], m.index);
  const MOIS = { jan: 1, fev: 2, feb: 2, mar: 3, avr: 4, apr: 4, mai: 5, may: 5, jun: 6, jui: 7, jul: 7, aou: 8, aug: 8, sep: 9, oct: 10, nov: 11, dec: 12 };
  for (const m of tn.matchAll(/(?<!\d)(?:(\d{1,2})\s?)?(janv?|fevr?|feb|mars?|avr|apr|mai|may|juin|jun|juil|jul|aout|aou|aug|sept?|oct|nov|dec)[a-z]*\.?\s?(\d{4}|\d{2})(?!\d)/g)) {
    const k = m[2] === 'juin' ? 'jun' : m[2] === 'juil' ? 'jui' : m[2].slice(0, 3);
    push(+m[3], MOIS[k], m[1] ? +m[1] : null, m.index);
  }
  for (const m of tn.matchAll(/(?<![\d\/.\-])(\d{1,2})\s?[\/.\-]\s?(\d{4})(?![\d\/.\-])/g)) push(+m[2], +m[1], null, m.index);
  if (!cands.length) return '';
  // La date juste après « à consommer… », « DDM », « EXP »… ; sinon la plus lointaine (pas la date de fabrication).
  for (const k of tn.matchAll(/consommer|jusqu|avant|ddm|dlc|dluo|\bexp|best before|use by|\bbb\b|peremption/g)) {
    const after = cands.filter((c) => c.idx >= k.index && c.idx - k.index < 70).sort((a, b) => a.idx - b.idx)[0];
    if (after) return after.date;
  }
  return cands.sort((a, b) => b.date.localeCompare(a.date))[0].date;
}

// Le nom du produit : la ligne écrite le plus gros, qui ressemble à des mots.
function guessName(lines) {
  const bad = /consom|ingr|poids|\blot\b|kcal|kj|valeur|conserv|\bexp|avant|fabriqu|www|http|\bnet\b|emball|origine|temp[eé]rat|\d{2}[\/.]\d{2}/i;
  const ok = lines
    .map((l) => ({ ...l, clean: String(l.text || '').replace(/[^A-Za-zÀ-ÿ' \-]/g, ' ').replace(/\s+/g, ' ').trim() }))
    .filter((l) => (l.conf ?? 100) > 45 && (l.clean.match(/[A-Za-zÀ-ÿ]/g) || []).length >= 3 && !bad.test(l.text) && l.clean.length / Math.max(1, String(l.text).trim().length) > 0.6);
  if (!ok.length) return '';
  const best = ok.sort((a, b) => b.h - a.h)[0].clean.slice(0, 40);
  const lower = best === best.toUpperCase() ? best.toLowerCase() : best;
  return lower.charAt(0).toUpperCase() + lower.slice(1);
}

// Le bloc copié depuis Firebase : on y lit apiKey, projectId, appId…
function parseConfig(text) {
  const cfg = {};
  for (const m of text.matchAll(/["']?(apiKey|authDomain|projectId|storageBucket|messagingSenderId|appId)["']?\s*:\s*["']([^"']+)["']/g)) cfg[m[1]] = m[2].trim();
  if (!cfg.apiKey || !cfg.projectId || !cfg.appId) return null;
  cfg.authDomain = cfg.authDomain || cfg.projectId + '.firebaseapp.com';
  return { apiKey: cfg.apiKey, authDomain: cfg.authDomain, projectId: cfg.projectId, appId: cfg.appId };
}

async function copyText(text, done) {
  try {
    await navigator.clipboard.writeText(text);
    toast(done || 'Copié !');
  } catch (e) {
    toast('Copie impossible : sélectionne le texte à la main.');
  }
}

document.addEventListener('click', (e) => {

    ui.month = new Date(ui.month.getFullYear(), ui.month.getMonth() + Number(month.dataset.month), 1);

  }

    if (d.getMonth() !== ui.month.getMonth()) ui.month = firstOfMonth(d);
    return render();
  }
  const week = e.target.closest('[data-week]');
  if (week) {
    ui.weekStart = addDays(ui.weekStart, 7 * Number(week.dataset.week));
    return render();
  }
  const action = e.target.closest('[data-action]')?.dataset.action;
  if (action === 'setup') {
    ui.screen = 'setup';
    render();
    window.scrollTo(0, 0);
  } else if (action === 'invite') openInvite();
  else if (action === 'this-week') {
    ui.weekStart = startOfWeek(new Date());
    ui.month = firstOfMonth(new Date());
    ui.selected = todayIso();
    render();
  } else if (action === 'reload-page') {
    // Recharge la dernière version de l'appli (sans perdre le planning : tout est dans l'adresse).
    toast('J’actualise…');
    const u = new URL(location.href);
    u.searchParams.set('r', Date.now());
    location.replace(u.toString());
  } else if (action === 'home') {
    ui.section = null;
    render();
    window.scrollTo(0, 0);
  } else if (action === 'add-course') openCourse(null);
  else if (action === 'work-export') openWorkExport();
  else if (action === 'add-stock') openStock(null);
  else if (action === 'clear-bought') {
    const ids = courses.filter((c) => c.bought).map((c) => c.id);
    if (!ids.length) return;
    courses = courses.filter((c) => !c.bought);
    backend.del(local.planId, 'courses', ids).catch((err) => toast(explain(err)));
    render();
    toast('Panier vidé.');
  } else if (action === 'hide-banner') {
    local.dismissedHome = true;
    saveLocal();
    render();
  } else if (action === 'reload') location.reload();
  else if (action === 'reset') {
    if (!confirm('Oublier ce planning sur ce téléphone ? (Il reste chez les autres personnes.)')) return;
    localStorage.removeItem(LOCAL_KEY);
    location.href = location.pathname + (DEMO ? '?demo=1' : '');
  }
});

function toggleDone(id) {
  const ev = events.find((x) => x.id === id);

  render();

}

}
