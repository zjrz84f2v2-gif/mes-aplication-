// ---------- Télécharger le planning de travail (tous les mois, pour chaque personne) ----------

function workMonthsOf(m) {
  const days = work.filter((w) => w.member === m && WORK[w.code]).map((w) => w.date).sort();
  if (!days.length) return [];
  const out = [];
  for (let d = firstOfMonth(parseIso(days[0])); iso(d) <= days[days.length - 1]; d = new Date(d.getFullYear(), d.getMonth() + 1, 1)) out.push(d);
  return out;
}

function openWorkExport() {
  const ids = memberIds().filter((m) => workMonthsOf(m).length);
  if (!ids.length) return toast('Personne n’a encore de travail noté.');
  let who = ids.includes(local.memberId) ? local.memberId : ids[0];
  const back = showSheet(`<div class="sheet-head"><h3>Télécharger le planning de travail</h3>${closeBtn}</div>
    <p class="hint">Tous les mois, de la première à la dernière date notée.</p>
    <span class="label">Pour qui ?</span>
    <div class="who-pick">${ids.map((id) => `<button type="button" class="chip" data-who="${esc(id)}" aria-pressed="${id === who}">${esc(member(id).name)}</button>`).join('')}${ids.length > 1 ? `<button type="button" class="chip" data-who="*" aria-pressed="false">Tout le monde</button>` : ''}</div>
    <div class="actions">
      <button class="btn" data-pdf>Enregistrer en PDF (ou imprimer)</button>
      <a class="btn ghost" data-ics href="#" target="_blank" rel="noopener">${icons.cal} Mettre dans mon agenda iPhone</a>
    </div>
    <p class="hint">PDF : dans la fenêtre qui s’ouvre, touche <b>Partager</b> (ou « Imprimer ») puis <b>Enregistrer dans Fichiers</b>. Agenda : touche <b>Tout ajouter</b>.</p>`);
  const ics = back.querySelector('[data-ics]');
  const sync = () => {
    back.querySelectorAll('[data-who]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.who === who)));
    ics.href = workIcsUrl(who === '*' ? ids : [who]);
    ics.style.display = who === '*' ? 'none' : '';
  };
  sync();
  back.addEventListener('click', (e) => {
    const w = e.target.closest('[data-who]');
    if (w) {
      who = w.dataset.who;
      return sync();
    }
    if (e.target.closest('[data-pdf]')) {
      closeSheet();
      printWork(who === '*' ? ids : [who]);
    }
  });
}

function workPrintHtml(ids) {
  const names = ['lun', 'mar', 'mer', 'jeu', 'ven', 'sam', 'dim'];
  let html = '';
  for (const m of ids) {
    const months = workMonthsOf(m);
    html += `<section class="pr-person"><h1>Planning de travail – ${esc(member(m).name)}</h1><p>${esc(capital(fmt(months[0], { month: 'long', year: 'numeric' })))} à ${esc(fmt(months[months.length - 1], { month: 'long', year: 'numeric' }))} · imprimé le ${esc(fmt(new Date(), { day: 'numeric', month: 'long', year: 'numeric' }))}</p>`;
    for (const m0 of months) {
      const last = new Date(m0.getFullYear(), m0.getMonth() + 1, 0);
      const n = {};
      let rows = '';
      for (let d = startOfWeek(m0); d <= last; d = addDays(d, 7)) {
        rows += '<tr>';
        for (let i = 0; i < 7; i++) {
          const day = addDays(d, i);
          if (day.getMonth() !== m0.getMonth()) {
            rows += '<td class="out"></td>';
            continue;
          }
          const w = workOn(m, iso(day));
          const k = w && WORK[w.code];
          if (k) n[w.code] = (n[w.code] || 0) + 1;
          rows += `<td><b>${day.getDate()}</b>${k ? `<span style="background:${k.c};color:${k.i}">${esc(k.short)}${workHours(w) ? `<small>${esc(workHours(w))}</small>` : ''}</span>` : ''}</td>`;
        }
        rows += '</tr>';
      }
      const sum = Object.keys(WORK).filter((c) => n[c]).map((c) => `${n[c]} ${n[c] > 1 ? WORK[c].pl : WORK[c].one}`).join(' · ');
      html += `<div class="pr-month"><h2>${esc(fmt(m0, { month: 'long', year: 'numeric' }))}</h2><table><thead><tr>${names.map((x) => `<th>${x}</th>`).join('')}</tr></thead><tbody>${rows}</tbody></table>${sum ? `<div class="pr-sum">${esc(sum)}</div>` : ''}</div>`;
    }
    html += '</section>';
  }
  return html;
}

function printWork(ids) {
  let area = document.getElementById('print-area');
  if (!area) {
    area = document.createElement('div');
    area.id = 'print-area';
    document.body.appendChild(area);
  }
  area.innerHTML = workPrintHtml(ids);
  document.body.classList.add('printing');
  const done = () => document.body.classList.remove('printing');
  addEventListener('afterprint', done, { once: true });
  setTimeout(() => {
    window.print();
    setTimeout(done, 1000);
  }, 50);
}

// Fichier agenda (.ics) : un rendez-vous par jour de travail, avec les horaires s'ils sont notés.
function workIcsUrl(ids) {
  const stamp = new Date().toISOString().replace(/[-:]/g, '').slice(0, 15) + 'Z';
  const t = (day, hm) => `${day.replace(/-/g, '')}T${hm.replace(':', '')}00`;
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Notre planning//FR', 'CALSCALE:GREGORIAN', 'X-WR-CALNAME:Travail'];
  for (const m of ids)
    for (const w of work.filter((x) => x.member === m && WORK[x.code]).sort((a, b) => a.date.localeCompare(b.date))) {
      const k = WORK[w.code];
      lines.push('BEGIN:VEVENT', `UID:work-${w.id}@notre-planning`, `DTSTAMP:${stamp}`);
      if (w.start && w.end) {
        const endDay = w.end <= w.start ? iso(addDays(parseIso(w.date), 1)) : w.date;
        lines.push(`DTSTART:${t(w.date, w.start)}`, `DTEND:${t(endDay, w.end)}`);
      } else lines.push(`DTSTART;VALUE=DATE:${w.date.replace(/-/g, '')}`, `DTEND;VALUE=DATE:${iso(addDays(parseIso(w.date), 1)).replace(/-/g, '')}`);
      lines.push(`SUMMARY:${icsText(`${k.label}${ids.length > 1 ? ' – ' + member(m).name : ''}`)}`, 'TRANSP:OPAQUE', 'END:VEVENT');
    }
  lines.push('END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
}

// Ajouter ou modifier une activité.
function openEditor(id, day) {
  const ev = id ? events.find((x) => x.id === id) : null;
  let date = ev?.date || day || todayIso();
  const t = todayIso();
  const tm = iso(addDays(new Date(), 1));
  const back = showSheet(`<div class="sheet-head"><h3>${ev ? 'Modifier' : 'Ajouter au planning'}</h3>${closeBtn}</div>
    <form id="ev-form">
      <label class="label" for="ev-title">Qu’est-ce qui est prévu ?</label>
      <input id="ev-title" class="field" value="${esc(ev?.title || '')}" placeholder="ex. Dîner chez Léa" enterkeyhint="done" required maxlength="140">
      <span class="label">Quel jour ?</span>
      <div class="row">
        <button type="button" class="chip" data-day="${t}" aria-pressed="${date === t}">Aujourd’hui</button>
        <button type="button" class="chip" data-day="${tm}" aria-pressed="${date === tm}">Demain</button>
        <input type="date" class="field date-field" id="ev-date" value="${date}" aria-label="Choisir une date">
      </div>
      <label class="label" for="ev-time">À quelle heure ? <span style="font-weight:500;color:var(--ink-2)">(facultatif)</span></label>
      <input id="ev-time" type="time" class="field" value="${esc(ev?.time || '')}" style="max-width:180px">
      <label class="label" for="ev-note">Note <span style="font-weight:500;color:var(--ink-2)">(facultatif)</span></label>
      <textarea id="ev-note" class="field" placeholder="Adresse, choses à prendre…">${esc(ev?.note || '')}</textarea>
      <div class="actions"><button class="btn" type="submit">${ev ? 'Enregistrer' : 'Ajouter'}</button></div>
    </form>`);
  const dateInput = back.querySelector('#ev-date');
  const syncChips = () => back.querySelectorAll('[data-day]').forEach((c) => c.setAttribute('aria-pressed', String(c.dataset.day === date)));
  back.addEventListener('click', (e) => {
    const c = e.target.closest('[data-day]');
    if (!c) return;
    date = c.dataset.day;
    dateInput.value = date;
    syncChips();
  });
  dateInput.addEventListener('change', () => {
    date = dateInput.value || date;
    syncChips();
  });
  back.querySelector('#ev-form').addEventListener('submit', (e) => {
    e.preventDefault();
    const title = back.querySelector('#ev-title').value.trim();
    if (!title) return;
    const data = {
      id: ev?.id || randomId(16),
      title,
      date,
      time: back.querySelector('#ev-time').value || '',
      note: back.querySelector('#ev-note').value.trim(),
      updatedAt: Date.now(),
    };
    if (!ev) Object.assign(data, { by: local.memberId, done: false, createdAt: Date.now() });
    // Affiché tout de suite, envoyé au serveur en arrière-plan (marche aussi hors connexion).
    const i = events.findIndex((x) => x.id === data.id);
    if (i >= 0) events[i] = { ...events[i], ...data };
    else events.push(data);
    backend.saveEvent(local.planId, data).catch((err) => toast(explain(err)));
    closeSheet();
    // On montre la semaine de l'activité.
    ui.weekStart = startOfWeek(parseIso(date));
    ui.month = firstOfMonth(parseIso(date));
    ui.selected = date;
    render();
    toast(ev ? 'Modifié !' : `Ajouté pour ${dayLabel(date)} !`);
  });
  if (!ev) setTimeout(() => back.querySelector('#ev-title').focus(), 60);
}

function openDetail(id) {
  const ev = events.find((x) => x.id === id);
  if (!ev) return;
  const m = member(ev.by);
  let confirmDel = false;
  const back = showSheet(`<div class="sheet-head"><h3>${esc(ev.title)}</h3>${closeBtn}</div>
    <p class="detail-meta">${esc(capital(dayLabel(ev.date)))}${ev.time ? ' à ' + esc(ev.time.replace(':', ' h ')) : ''}</p>
    <p class="detail-meta"><span class="ev-meta" style="display:inline-flex"><span class="who"><i style="background:${esc(m.color)}"></i>Ajouté par ${esc(m.name)}</span></span></p>
    ${ev.note ? `<p class="detail-note">${esc(ev.note)}</p>` : ''}
    <div class="actions">
      <a class="btn" href="${calendarUrl(ev)}" target="_blank" rel="noopener">${icons.cal} Ajouter à mon agenda iPhone</a>
      <a class="btn ghost" href="${googleUrl(ev)}" target="_blank" rel="noopener">Ajouter à Google Agenda</a>
      <button class="btn ghost" data-edit>Modifier</button>
      <button class="btn ghost" data-toggle>${ev.done ? 'Remettre « à faire »' : 'C’est fait !'}</button>
      <button class="btn danger" data-del>Supprimer</button>
    </div>
    <p class="hint">L’agenda de l’iPhone te préviendra ${ev.time ? '1 heure avant' : 'la veille à 9 h'}.</p>`);
  back.addEventListener('click', (e) => {
    if (e.target.closest('[data-edit]')) return openEditor(id);
    if (e.target.closest('[data-toggle]')) {
      closeSheet();
      return toggleDone(id);
    }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!confirmDel) {
        confirmDel = true;
        del.textContent = 'Appuie encore pour supprimer';
        return;
      }
      events = events.filter((x) => x.id !== id);
      backend.removeEvent(local.planId, id).catch((err) => toast(explain(err)));
      closeSheet();
      render();
      toast('Supprimé.');
    }
  });
}

// Mettre, changer ou effacer le travail d'une personne, sur un jour ou plusieurs.
function openWork(m, day) {
  if (!plan?.members?.[m]) m = local.memberId;
  const ids = memberIds();
  const cur = workOn(m, day);
  let who = m;
  const back = showSheet(`<div class="sheet-head"><h3>Travail</h3>${closeBtn}</div>
    <p class="detail-meta">${esc(capital(fmt(parseIso(day), { weekday: 'long', day: 'numeric', month: 'long' })))}</p>
    ${ids.length > 1 ? `<span class="label">Pour qui ?</span><div class="who-pick">${ids.map((id) => `<button type="button" class="chip" data-who="${esc(id)}" aria-pressed="${id === who}">${esc(member(id).name)}</button>`).join('')}</div>` : ''}
    <label class="label" for="work-end">Jusqu’au <span style="font-weight:500;color:var(--ink-2)">(plusieurs jours d’un coup)</span></label>
    <input type="date" class="field" id="work-end" value="${day}" min="${day}" style="max-width:220px">
    <span class="label">Horaires <span style="font-weight:500;color:var(--ink-2)">(facultatif)</span></span>
    <div class="hours"><span>De</span><input type="time" class="field" id="work-start" value="${esc(cur?.start || '')}" aria-label="Heure de début"><span>à</span><input type="time" class="field" id="work-stop" value="${esc(cur?.end || '')}" aria-label="Heure de fin"></div>
    <span class="label">Puis touche ce que c’est</span>
    <div class="codes">${Object.entries(WORK).map(([c, k]) => `<button type="button" class="code-btn" style="--c:${k.c};--i:${k.i}" data-code="${c}" aria-pressed="${cur?.code === c}">${esc(k.label)}</button>`).join('')}</div>
    <div class="actions"><button class="btn danger" data-clear>Effacer (repos)</button></div>`);
  const end = back.querySelector('#work-end');
  const startIn = back.querySelector('#work-start');
  const stopIn = back.querySelector('#work-stop');
  const days = () => {
    const out = [];
    const last = end.value && end.value > day ? end.value : day;
    for (let d = parseIso(day); iso(d) <= last && out.length < 120; d = addDays(d, 1)) out.push(iso(d));
    return out;
  };
  const apply = (code) => {
    const list = days();
    const now = Date.now();
    const start = startIn.value || '';
    const stop = stopIn.value || '';
    const docs = code ? list.map((ds) => ({ id: workId(who, ds), member: who, date: ds, code, start, end: stop, by: local.memberId, updatedAt: now })) : [];
    const removeIds = code ? [] : list.map((ds) => workId(who, ds));
    const touched = new Set(list.map((ds) => workId(who, ds)));
    work = work.filter((w) => !touched.has(w.id)).concat(docs);
    backend.saveWork(local.planId, docs, removeIds).catch((err) => toast(explain(err)));
    closeSheet();
    render();
    const n = list.length > 1 ? ` (${list.length} jours)` : '';
    toast(code ? `${WORK[code].label}${start || stop ? ' ' + workHours({ start, end: stop }) : ''}${n} : c’est noté !` : `Effacé${n}.`);
  };
  back.addEventListener('click', (e) => {
    const w = e.target.closest('[data-who]');
    if (w) {
      who = w.dataset.who;
      back.querySelectorAll('[data-who]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.who === who)));
      const cw = workOn(who, day);
      const c = cw?.code;
      startIn.value = cw?.start || '';
      stopIn.value = cw?.end || '';
      back.querySelectorAll('[data-code]').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.code === c)));
      return;
    }
    const c = e.target.closest('[data-code]');
    if (c) return apply(c.dataset.code);
    if (e.target.closest('[data-clear]')) apply(null);
  });
}

// ---------- Agenda (rappel du téléphone) ----------

const icsDate = (s) => s.replace(/-/g, '');
const icsText = (s) => String(s || '').replace(/[\\;,]/g, (c) => '\\' + c).replace(/\n/g, '\\n');

function calendarUrl(ev) {
  const lines = ['BEGIN:VCALENDAR', 'VERSION:2.0', 'PRODID:-//Notre planning//FR', 'BEGIN:VEVENT', `UID:${ev.id}@notre-planning`, `DTSTAMP:${new Date().toISOString().replace(/[-:]/g, '').slice(0, 15)}Z`];
  if (ev.time) {
    const start = parseIso(ev.date);
    const [h, m] = ev.time.split(':').map(Number);
    start.setHours(h, m);
    const end = new Date(start.getTime() + 3600e3);
    const stamp = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    lines.push(`DTSTART:${stamp(start)}`, `DTEND:${stamp(end)}`);
  } else {
    lines.push(`DTSTART;VALUE=DATE:${icsDate(ev.date)}`, `DTEND;VALUE=DATE:${icsDate(iso(addDays(parseIso(ev.date), 1)))}`);
  }
  lines.push(`SUMMARY:${icsText(ev.title)}`);
  if (ev.note) lines.push(`DESCRIPTION:${icsText(ev.note)}`);
  lines.push('BEGIN:VALARM', 'ACTION:DISPLAY', `DESCRIPTION:${icsText(ev.title)}`, `TRIGGER:${ev.time ? '-PT1H' : '-PT15H'}`, 'END:VALARM', 'END:VEVENT', 'END:VCALENDAR');
  return 'data:text/calendar;charset=utf-8,' + encodeURIComponent(lines.join('\r\n'));
}

function googleUrl(ev) {
  let dates;
  if (ev.time) {
    const [h, m] = ev.time.split(':').map(Number);
    const s = parseIso(ev.date);
    s.setHours(h, m);
    const e = new Date(s.getTime() + 3600e3);
    const g = (d) => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}T${pad(d.getHours())}${pad(d.getMinutes())}00`;
    dates = `${g(s)}/${g(e)}`;
  } else dates = `${icsDate(ev.date)}/${icsDate(iso(addDays(parseIso(ev.date), 1)))}`;
  return `https://calendar.google.com/calendar/render?action=TEMPLATE&text=${encodeURIComponent(ev.title)}&dates=${dates}&details=${encodeURIComponent(ev.note || '')}&ctz=Europe/Paris`;
}

// ---------- Inviter ----------

function openInvite() {
  const url = inviteUrl();
  const members = Object.values(plan.members || {});
  const back = showSheet(`<div class="sheet-head"><h3>Inviter quelqu’un</h3>${closeBtn}</div>
    <p class="hint">Envoie ce lien à la personne de ton choix (SMS, WhatsApp…). Elle l’ouvre, écrit son prénom, et vous avez le même planning. Elle n’a rien à installer.</p>
    <div class="actions">
      <button class="btn" data-share>${icons.invite} Envoyer le lien</button>
      <button class="btn ghost" data-copy-link>Copier le lien</button>
    </div>
    <span class="label">Dans ce planning</span>
    ${members.map((m) => `<p class="detail-meta"><span class="ev-meta" style="display:inline-flex;font-size:16px"><span class="who"><i style="background:${esc(m.color)}"></i>${esc(m.name)}</span></span></p>`).join('')}
    <p class="hint">Garde ce lien pour vous : toute personne qui l’a peut voir et modifier le planning.</p>`);
  back.addEventListener('click', async (e) => {
    if (e.target.closest('[data-copy-link]')) return copyText(url, 'Lien copié !');
    if (e.target.closest('[data-share]')) {
      if (navigator.share) {
        try {
          await navigator.share({ title: plan.name, text: `Rejoins « ${plan.name} » pour qu’on ait le même planning :`, url });
        } catch (err) {}
      } else copyText(url, 'Lien copié !');
    }
  });
}

// ---------- Démarrage ----------

let unsub = [];
async function start() {
  unsub.forEach((f) => f && f());
  unsub = [];
  if (!local.cfg) {
    ui.screen = 'welcome';
    return render();
  }
  if (!local.planId) {
    ui.screen = 'setup';
    return render();
  }
  ui.screen = 'loading';
  render();
  try {
    await backend.init(local.cfg);
  } catch (e) {
    ui.screen = 'error';
    ui.error = 'Impossible de charger Firebase. Vérifie ta connexion internet, puis réessaie.';
    return render();
  }
  syncUrl();
  let first = true;
  unsub.push(
    backend.watchPlan(
      local.planId,
      (data, meta) => {
        if (!data) {
          // Le cache du téléphone peut être vide au premier lancement : on attend la réponse du serveur.
          if (meta.fromCache) return;
          ui.screen = 'error';
          ui.error = 'Ce planning n’existe pas (ou plus). Vérifie le lien d’invitation.';
          return render();
        }
        plan = data;
        synced = !meta.hasPendingWrites && !meta.fromCache;
        const wasName = ui.screen === 'name';
        const known = local.memberId && plan.members?.[local.memberId];
        ui.screen = known ? 'main' : 'name';
        // Ne pas effacer ce qu'on est en train d'écrire.
        if (!(wasName && ui.screen === 'name' && !first)) render();
        first = false;
      },
      (err) => {
        ui.screen = 'error';
        ui.error = explain(err);
        render();
      },
    ),
  );
  unsub.push(
    backend.watchEvents(
      local.planId,
      iso(addDays(new Date(), -90)),
      (list, meta) => {
        events = list;
        synced = !meta.hasPendingWrites && !meta.fromCache;
        if (ui.screen === 'main' && !document.querySelector('.sheet-back')) render();
      },
      (err) => toast(explain(err)),
    ),
  );
  for (const coll of ['courses', 'stock'])
    unsub.push(
      backend.watchAll(
        local.planId,
        coll,
        (list) => {
          if (coll === 'courses') courses = list;
          else stock = list;
          if (ui.screen === 'main' && !document.querySelector('.sheet-back')) render();
        },
        (err) => toast(explain(err)),
      ),
    );
  unsub.push(
    backend.watchWork(
      local.planId,
      iso(addDays(new Date(), -120)),
      (list) => {
        work = list;
        if (ui.screen === 'main' && !document.querySelector('.sheet-back')) render();
      },
      (err) => toast(explain(err)),
    ),
  );
}

// Minuit passé ou retour sur l'app : « Aujourd'hui » doit être à jour.
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && ui.screen === 'main' && !document.querySelector('.sheet-back')) render();
});

start();
</script>
